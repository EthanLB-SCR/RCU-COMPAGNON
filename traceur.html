et le Drive du chantier. Le chef et le bureau déposent, toute l'équipe consulte.`,si:Gc(`admin`)},{sel:Jc(`qse`,Kc),titre:`⛑️ QSE`,texte:`Ton accueil chantier, le quart d'heure sécurité, les documents à émarger et la déclaration d'un accident.`,si:Gc(`qse`)},{sel:Jc(`export`,Kc),titre:`📷 DOE et exports`,texte:`Carnet de soudage, plan des soudures numérotées, photos par soudure, plan interactif : le dossier DOE se fabrique ici.`,si:Gc(`export`)},{sel:Jc(`bouclage`,qc),titre:`💧 Détection d'humidité`,texte:`Les mesures des fils d'alarme, boucle par boucle : contrôler le réseau, localiser un défaut, poser un bouclage temporaire.`,si:Gc(`bouclage`)},{sel:Jc(`hydro`,qc),titre:`🌊 Hydraulique`,texte:`Les essais du réseau (épreuve, rinçage) : tronçons d'essai, point d'eau, remplissage, calendrier et procès-verbaux.`,si:Gc(`hydro`)},{sel:Jc(`stock`,qc),titre:`🚚 Stockage`,texte:`Les livraisons (camions) et les zones de stock du chantier : ce qui est arrivé, où c'est rangé, ce qui en a été pris.`,si:Gc(`stock`)},{sel:Jc(`fourniture`,qc),titre:`🧾 Fournitures`,texte:`Le besoin en pièces calculé sur le tracé, les commandes fournisseur, ce qui est livré et ce qui reste à livrer.`,si:Gc(`fourniture`)},{sel:Jc(`phasage`,qc),titre:`📅 Phasage`,texte:`Le chantier découpé en phases, prises sur le plan et datées : le planning d'exécution, pour suivre l'avance ou le retard.`,si:Gc(`phasage`)},{sel:Jc(`ts`,qc),titre:`✍️ Modifications`,texte:`Le marché comparé au réel : par défaut, tout est compris. « ＋ Déclarer une modif » ressort un changement (TS, pour mémoire), pointé sur le plan.`,si:Gc(`ts`)},{sel:Jc(`points`,qc),titre:`📍 Points de contrôle`,texte:`Vannes, purges, vidanges, sous-stations, raccordements : leur état (ouvert, fermé) et leurs photos, datés.`,si:Gc(`points`)},{sel:Yc,titre:`📊 Récapitulatif`,texte:`Dans « ⋯ Plus » : les totaux par DN et par ligne, la liste des pièces, les manchons à poser et l'export pour Excel.`},{sel:Yc,titre:`🎖 Liste des soudures`,texte:`Dans « ⋯ Plus » : toutes les soudures, ligne par ligne, avec leur statut. Touche-en une pour la retrouver sur le plan.`},{sel:Yc,titre:`📦 Catalogue des pièces`,texte:`Dans « ⋯ Plus » : les dimensions des pièces de chaque fournisseur, celles qui servent à dessiner le plan.`,si:Gc(`catalogue`)}],"chantier:plan":[{sel:`#svg`,titre:`Le plan d'ensemble`,texte:`Glisse un doigt pour te déplacer, pince à deux doigts pour zoomer. Touche une soudure (un rond) : sa fiche s'ouvre.`},{sel:`#legend`,titre:`ℹ Légende : les couleurs`,texte:`Repliée pour laisser le plan : touche « ℹ Légende ». Gris : à souder · orange : soudée · bleu : contrôlée · vert : manchonnée · rouge : à reprendre. Trait rouge = aller, bleu = retour.`},{titre:`La fiche d'une soudure`,texte:`En haut : n°, statut, DN, aller ou retour, PK. « Faire l'étape … » ouvre la tienne : 1 Soudure (soudeur), puis 2 Fils raccordés, 3 Manchon posé, 4 Moussage (manchonneur).`},{titre:`Photo, puis « Valider l'étape »`,texte:`📷 Photo du cordon (obligatoire pour la soudure), puis « Valider l'étape » : ton nom et la date restent sur la fiche. Sans réseau, c'est gardé et envoyé au retour du réseau.`},{titre:`👥 Pour le compte du soudeur`,texte:`Tuyauteur, manchonneur, pelleur : le soudeur a fini ? Ouvre la soudure, « Soudé par » : choisis-le, prends la photo du cordon et valide. La soudure compte pour lui, ton nom reste dans l'historique.`,si:e=>Hc(e,`weld.step1.for`)},{sel:`#planFab, #btnMenu`,titre:`＋ Poser sur le plan`,texte:`Le ＋ orange en bas du plan (ou ☰ › Terrain & chantier) : une note avec photo, une soudure faite sur place, une modif… Choisis, puis touche l'endroit. Une barre t'explique chaque étape.`,si:e=>Hc(e,`phasage.edit`,`stock.edit`,`conv.post`,`site.tracer`)},{sel:`.zoomctl [data-z="eye"]`,titre:`👁 Ce qui s'affiche`,texte:`Les calques : DN, longueurs, n° de soudure, fils, notes, points… « Épuré » allège le plan, « Par défaut » remet tout. 📅 juste dessous : qui a fait quoi, et quand.`},{sel:`#btnSearch`,titre:`🔍 Retrouver une soudure`,texte:`Tape son n° (ex. 24) puis Entrée : le plan se centre dessus et sa fiche s'ouvre. Le même menu ☰ filtre le plan : « Pour moi », « À souder »…`},{sel:`#pxPlanBtn`,titre:`📄 Mes plans`,texte:`Les plans d'exé du chantier, ceux de ta zone en premier. Depuis la fiche d'une soudure, « 📄 Plan d'exé » ouvre directement la bonne planche.`,si:e=>Vc(e,`plansexe`)}],"chantier:bureau":[{sel:`#bureau .ac-bhero`,titre:`Aujourd'hui sur ce chantier`,texte:`Le % soudé, le chef et le conducteur, la météo et qui est placé aujourd'hui (planning). La première chose à regarder en arrivant.`},{sel:`#bureau .okbox, #bureau .ac-notif`,titre:`Ce qui t'attend ici`,texte:`Ton accueil chantier, un quart d'heure sécurité, des documents à émarger, tes tâches : touche une ligne pour t'en occuper. Bandeau vert : rien ne t'attend.`},{sel:`#bureau .ac-notif.warn, #bureau .ac-kt.bad, #bureau .ac-kt.warn`,titre:`Ce qui coince`,texte:`Pour l'encadrement : les points bloquants (✗) et à surveiller (!) du chantier. Touche une ligne pour ouvrir l'onglet concerné.`,si:Uc},{sel:`#bureau .ac-kt.ok, #bureau .ac-kt.warn, #bureau .ac-kt.bad, #bureau .ac-kt.off`,titre:`La checklist du chantier`,texte:`Une case par sujet : ✓ complet, ! manque, ✗ bloquant, ○ pas commencé. 👥 Équipe et ⏱ Pointages ouvrent Pilotage.`,si:Uc},{sel:`#bureau .dx-stat`,titre:`🗂 Pièces du dossier`,texte:`Les pièces obligatoires en règle (ex. 5/8). Touche le compteur pour compléter le Dossier du chantier.`,si:e=>Vc(e,`dossier`)&&Hc(e,`dossier.edit`)},{sel:`#bureau .ac-kt:not(.ok):not(.warn):not(.bad):not(.off)`,titre:`Le chantier : raccourcis`,texte:`Une case par onglet auquel tu as accès : touche-la pour y aller directement, sans passer par la barre du bas.`},{sel:`#bureau [data-bur="__compte"]`,titre:`💶 Compte chantier`,texte:`Bons de commande, dépenses et heures par poste de ce chantier, en lecture seule et imprimable. Pas de compta.`,si:e=>Vc(e,`comptechantier`)&&(Hc(e,`planning.edit`)||Hc(e,`affaires.edit`)&&Hc(e,`pointage.validate`,`qse.manage`))},{sel:`#bureau [data-nc-fiche]`,titre:`✎ Fiche du chantier`,texte:`Ville, client, date de début, fournisseur, note : touche « ✎ Fiche » pour compléter la fiche du chantier.`,si:e=>Hc(e,`site.tracer`,`planning.edit`)}],"chantier:conv":[{sel:`#cvList`,titre:`Le fil du chantier`,texte:`Messages, notes posées sur le plan, tâches : tout reste ici, daté et signé. Le 📍 d'une note la montre sur le plan.`},{sel:`#convview .cvFilters`,titre:`Retrouver un message`,texte:`Filtre : 💬 Messages, 📍 Sur le plan, ☐ À faire, 👤 Mes tâches, ✓ Faites. 📅 Période et Type valent aussi pour les pastilles du plan.`},{sel:`#convview .cvCats`,titre:`Le type du message`,texte:`Choisis d'abord le type (🚧 Balisage, ⛏️ Tranchée, 🦺 Sécurité…) : son icône apparaît sur le plan et sert de filtre.`,si:e=>Hc(e,`conv.post`)},{sel:`#cvPose`,titre:`📍 Sur le plan, 📷 en photo`,texte:`« 📍 Placer sur le plan », puis touche l'endroit : la note y apparaît en pastille. « 📷 Photo » ajoute une ou plusieurs photos.`,si:e=>Hc(e,`conv.post`)},{sel:`#convview label.pill`,titre:`☐ Tâche à faire`,texte:`Coche « Tâche à faire » et choisis pour qui. La personne la voit dans « 👤 Mes tâches » et la déclare faite, photo à l'appui.`,si:e=>Hc(e,`conv.task`)},{sel:`#cvText, #cvSend`,titre:`Écrire et envoyer`,texte:`Écris ton message, puis « Envoyer ». Sans réseau, il est gardé sur le téléphone et part au retour du réseau.`,si:e=>Hc(e,`conv.post`)},{titre:`Une tâche pour toi`,texte:`Elle est dans « 👤 Mes tâches » et au Bureau. « 👋 Je la prends » si elle n'est à personne, puis « ✓ Déclarer fait (photo) » une fois le travail fait.`}],"chantier:admin":[{sel:`#admin .dx-sum, #admin .dx-top`,titre:`Pièces obligatoires en règle`,texte:`Le compteur du chantier (ex. 5/8) et la liste de ce qui manque. Le chef et le conducteur le retrouvent aussi en tête du chantier.`},{sel:`#admin .dx-p`,titre:`Une ligne par pièce`,texte:`DT / DICT, PPSPS, PGC, plans d'exé… : ✓ présente, ✗ manquante, ⚠ à mettre à jour (échéance). Touche une pièce présente pour l'ouvrir.`},{sel:`#admin .dx-dep, #admin .dx-man`,titre:`📎 Déposer une pièce`,texte:`« 📎 Déposer », puis choisis le fichier (PDF, photo…). DICT, arrêté, qualification : indique la date de fin, l'appli prévient 15 jours avant.`,si:e=>Hc(e,`dossier.edit`)},{sel:`#admin .dx-man`,titre:`⋯ Versions, échéance, sans objet`,texte:`Le ⋯ d'une pièce : ses versions, sa date de fin, « à mettre à jour », ou « sans objet » sur ce chantier (elle sort alors du compteur).`,si:e=>Hc(e,`dossier.edit`)},{sel:`#dx-drive-in, #dx-drive-open, #admin .dx-drvNo`,titre:`📁 Le Drive du chantier`,texte:`Tout ce qui n'est pas obligatoire vit dans le dossier partagé (Drive, SharePoint…). Son lien https:// s'enregistre une fois, puis « 📁 Ouvrir le Drive du chantier ».`},{sel:`#px-sec`,titre:`📄 Plans d'exé`,texte:`Une planche par page (n°, indice, date), rattachée à sa zone du plan. Le chef ou le bureau les importe, les équipes les ouvrent depuis « 📄 Mes plans ».`,si:e=>Vc(e,`plansexe`)},{sel:`#dx-fold`,titre:`Autres documents`,texte:`BL, épreuves, plans, accueil, émargements QSE… : touche pour déplier, tout est rangé par catégorie.`}],"chantier:qse":[{sel:`#qse-parcours, #qse .okbox`,titre:`🦺 Ton accueil chantier`,texte:`Une fois par chantier, avant de commencer : PPSPS, 10 points (DICT, prévention), signature au doigt. 10 à 15 minutes, ta fiche d'accueil est produite à la fin.`,si:e=>Hc(e,`qse.sign`)},{sel:`#qse-acc`,titre:`Le registre des accueils`,texte:`L'émargement de chaque arrivant sur ce chantier, avec la date. « 🖨 Feuille d'émargement » en sort une version papier.`},{sel:`#qse-accext`,titre:`👤 Accueillir sans compte`,texte:`Un intérimaire, un sous-traitant ou un visiteur sans compte : déroule son accueil sur ton téléphone, il signe au doigt.`,si:e=>Hc(e,`qse.manage`)},{sel:`#qse [data-qhnew], #qse [data-qhdo]`,titre:`⛑️ Quart d'heure sécurité`,texte:`L'encadrement le déclenche (un sujet, 3 questions) ; chacun le fait sur son téléphone et signe. Il s'affiche aussi au Bureau, dans « Ce qui t'attend ici ».`},{sel:`#qse-accident`,titre:`⚠ Accident ou presque-accident`,texte:`Blessure, soin, presque-accident : déclare-le tout de suite, depuis le chantier. La RH, la direction et le QSE sont prévenus.`},{sel:`#qse-controle`,titre:`📋 Contrôle chantier`,texte:`La trame SCR, point par point, sur le terrain. Les non-conformités restent listées ici jusqu'à leur levée (✓ Lever).`,si:e=>Hc(e,`qse.manage`)},{sel:`#qse [data-qsignme], #qse [data-qopen], #qse label.btn`,titre:`✍️ Documents à émarger`,texte:`Lis le document puis signe au doigt : l'émargement vaut « j'ai pris connaissance ». Un chiffre rouge sur l'onglet QSE = ce qu'il te reste à signer.`}],"chantier:export":[{sel:`#exportview .doeParts`,titre:`📁 Le dossier DOE complet`,texte:`Coche ce qu'il contient : carnet de soudage, plan numéroté, photos par n° de soudure, plan interactif, modifications, dossier administratif, données.`},{sel:`#exportview .doeOpts`,titre:`Les réglages du plan`,texte:`Soudures documentées ou toutes, photos, format (A4 à A0), échelle et orientation des planches.`},{sel:`#doeZip`,titre:`📁 Fabriquer le dossier DOE`,texte:`Un .zip complet, prêt à remettre. Reste connecté pendant la fabrication : les photos viennent du serveur.`},{sel:`#doeCarnet, #doePlan`,titre:`À la carte : carnet et plan`,texte:`📕 Carnet de soudage, 🗺 Plan des soudures numérotées : ils s'ouvrent dans un nouvel onglet, avec « Imprimer / enregistrer en PDF ».`},{sel:`#doeLink`,titre:`🔗 Le lien pour le client`,texte:`« Plan interactif : lien à envoyer » : à coller dans un mail, il s'ouvre sur PC comme sur téléphone. Les messageries bloquent les fichiers .html.`},{sel:`#doeViewer, #doeMail`,titre:`🧭 Le plan interactif en fichier`,texte:`Le même plan en .html ou en .zip, pour WeTransfer, OneDrive ou une clé USB. Dans le dossier DOE, il marche même hors ligne.`},{titre:`Avant d'envoyer`,texte:`En bas, « Ce que contient ce chantier » : soudures documentées, photos, intervenants. Tout vient des fiches saisies sur le terrain : vérifie qu'il ne manque rien.`}],"chantier:liste":[{sel:`#liste h3`,titre:`Ligne par ligne`,texte:`Les soudures de chaque ligne : l'aller (titre rouge), puis le retour (titre bleu), avec leur nombre.`},{sel:`#liste .wrow`,titre:`Une ligne = une soudure`,texte:`Son n°, son PK (en mètres) et son DN. « FC » = fausse coupe ; « fils ✓ » = fils raccordés (« étamé → cuivré » noté tel quel, pour le DOE et la recherche de défaut).`},{sel:`#liste .wrow .badge`,titre:`Son statut, à droite`,texte:`À souder, S Soudée, ✓ Contrôlée, M Manchonnée, ! À reprendre : les mêmes couleurs que sur le plan.`},{sel:`#liste .wrow`,titre:`Touche une soudure`,texte:`Le plan s'ouvre, centré sur elle, avec sa fiche : tu y fais ton étape comme d'habitude.`},{sel:`#btnMenu`,titre:`Seulement tes soudures`,texte:`Sur le plan, ☰ → Filtrer le plan (« Pour moi », « À souder », « À reprendre »…) : la liste reprend ce filtre.`},{sel:`#btnSearch`,titre:`🔍 Aller droit au but`,texte:`Tape le n° d'une soudure puis Entrée : le plan s'ouvre dessus. Les totaux sont dans « ⋯ Plus » → Récapitulatif.`}],"chantier:recap":[{sel:`#recap .kpis`,titre:`Le chantier en chiffres`,texte:`Lignes, mètres de tracé (aller), soudures, % soudées ou plus, % manchonnées.`},{sel:`#recap .prog`,titre:`La barre d'avancement`,texte:`Vert : manchonnées, bleu : contrôlées, orange : soudées, rouge : à reprendre. Le nombre de chaque statut est juste dessous.`},{sel:`#recap table.rc`,titre:`Par DN et par ligne`,texte:`À soud., Soud., Contr., Manch., À repr., FC (fausses coupes) et % d'avancement : pour chaque DN, puis pour chaque ligne.`},{titre:`Pièces et manchons`,texte:`Plus bas : la nomenclature des pièces du calepinage (quantités aller et retour, ml) et les manchons à poser, posés, restants.`},{sel:`#csvWelds, #csvPieces`,titre:`⤓ Pour Excel`,texte:`« CSV soudures » et « CSV pièces » : les mêmes chiffres en fichier, à ouvrir dans Excel.`},{sel:`#recap [data-gots], #doe-go`,titre:`Modifications et DOE`,texte:`Tout en bas, deux raccourcis : l'onglet Modifications (écarts à qualifier) et l'onglet DOE et exports.`,si:e=>Vc(e,`modifs`)&&Hc(e,`ts.qualify`)||Vc(e,`export`)&&Hc(e,`export.doe`)}]},Qc=e=>!e||!e.can||e.can(`weld.admin`),$c={"chantier:bouclage":`Détection d'humidité`,"chantier:hydro":`Hydraulique`,"chantier:stock":`Stockage`,"chantier:fourniture":`Fournitures`,"chantier:phasage":`Phasage`,"chantier:ts":`Modifications`,"chantier:points":`Points de contrôle`,"chantier:catalogue":`Catalogue des pièces`},el={"chantier:bouclage":[{sel:`#tabbar [data-tab="bouclage"]`,titre:`Détection d'humidité`,texte:`En haut, le plan de bouclage : ce qui est prévu. En dessous, le bouclage fait sur le chantier : la boucle réelle, ta mesure, l'endroit d'un défaut.`},{sel:`#bpCard`,titre:`Le plan de bouclage`,texte:`Antennes isolées (I) ou en série (S), coupures du feeder (✂), boîtier de détection (▣) : chaque boucle a sa couleur et sa longueur de fil.`},{sel:`#bpCard .bpModes`,titre:`Préparer le plan`,texte:`Chef ou bureau : « Tés I / S », « ✂ Couper » à un manchon (on boucle de part et d'autre), « ▣ Boîtier », puis « ✓ Valider le plan ». Les équipes voient la consigne aux tés.`},{sel:`#bpCard [data-bpmode="at"]`,titre:`Je me place`,texte:`Touche un manchon ou le boîtier sur le petit plan : l'appli dit dans quelle boucle tu es et ce que tu dois lire en théorie.`},{sel:`#bl-line`,titre:`Le bouclage réel`,texte:`Choisis la ligne, puis Aller ou Retour : chaque conduite a sa boucle, calculée depuis le départ. Les paramètres (Ω/km, isolement mini) sont juste en dessous.`},{sel:`#bouclage .card:has(#dh-rows)`,titre:`La boucle réelle`,texte:`Fermée ou non, raccordés, à faire, dont étamé → cuivré. Le détail manchon par manchon est replié : ouvre-le si besoin (pour chercher un défaut sur un manchon rouvert).`},{sel:`#dh-mesure`,titre:`Mesure en un point`,texte:`Saisis la boucle (Ω) et l'isolement (MΩ), puis « Comparer » : vert = conforme, jaune = à vérifier. « 💾 Enregistrer » garde la mesure et le bouclage du moment.`},{sel:`#loc-from`,titre:`Localiser un défaut`,texte:`Dis où l'appareil est branché, sur quel fil et la distance annoncée, puis « Localiser ». « Voir sur le plan » montre l'endroit.`}],"chantier:hydro":[{sel:`#tabbar [data-tab="hydro"]`,titre:`Hydraulique`,texte:`Prépare et trace les essais du réseau (épreuve, rinçage, passivation, remplissage), du découpage en tronçons jusqu'au procès-verbal. Pour le chef de chantier et le bureau.`},{sel:`#hydro .hyCard`,titre:`1 · Prestations à préparer`,texte:`Coche chaque essai prévu (✓). Dessous, ce qu'il faut aux extrémités : kits fin de ligne, by-pass dès que l'eau circule, et les sous-stations avec leurs vannes et leur by-pass (jamais un kit fin de ligne).`},{sel:`#hydroMap`,titre:`2 · Sectorisation & points d'eau`,texte:`Avec les boutons juste au-dessus de la carte : « ✂ Sectoriser » coupe le réseau en tronçons d'essai ; « 💧 Point d'eau », « 🚰 Remplissage » (un par tronçon) et « ⬛ Skid » se posent sur le plan.`},{sel:`#hydroMap`,titre:`Les tronçons sur la carte`,texte:`Chaque tronçon a sa couleur, ses extrémités en toutes lettres (by-pass à poser, kit fin de ligne, sous-station) et ses vannes ⋈ à leur état. « 🔎 Bornes incendie de la ville » affiche les bornes proches.`},{sel:`#hydro [data-monew], #hydro .pt-row`,titre:`Vannes et mode opératoire`,texte:`Les vannes de sectionnement sont sur la vue d'ensemble : touches-en une pour son état. « ＋ Créer un mode opératoire » : vannes de départ, puis remplir, purger, mettre en pression… le terrain coche « ✓ Fait ».`},{sel:`#hydro .hyPal, #hydro .hyOp`,titre:`3 · Calendrier prévisionnel`,texte:`Glisse une pastille (Eau brute, Épreuve, Rinçage, Vidange…) sur le jour, dans la ligne du tronçon ; sur « 🗑 » pour l'enlever. Sans glisser : « ＋ Ajouter par formulaire ».`},{sel:`#hyReport`,titre:`4 · Récap par tronçon`,texte:`Linéaire, volume, débit de rinçage, temps de remplissage et pièces à poser, tronçon par tronçon. « 📄 Dossier de préparation » sort une page globale et une page par tronçon.`},{sel:`#hydro [data-hxedit]`,titre:`5 · Exécution et procès-verbaux`,texte:`« ＋ Renseigner » pour chaque tronçon et chaque essai : relevés de début et de fin, photo du manomètre, Conforme ou Non conforme. Puis « 📄 Rapport de réalisation et procès-verbaux ».`}],"chantier:stock":[{sel:`#tabbar [data-tab="stock"]`,titre:`Stockage`,texte:`Les pièces pré-isolées livrées sur le chantier : camions, zones de stockage posées sur le plan, ce qui est pris et ce qui reste. Pour le chef, le conducteur et le magasin.`},{sel:`#stk-new`,titre:`＋ Nouvelle livraison (camion)`,texte:`Nom, n° de BL, date, puis le contenu : le PDF du bon de livraison se lit tout seul ; sinon « 📋 Coller », « ✍ Catalogue » ou « Depuis le calepinage ».`},{titre:`Prévu, puis la zone`,texte:`Laisse « Déchargement prévu » coché tant que le camion n'est pas là. Pour une nouvelle zone, touche le plan à l'endroit du déchargement, ajuste (glisser, poignées, ↻ 15°), puis « Terminer ».`},{sel:`#stock [data-stkunload]`,titre:`📦 Le camion est arrivé`,texte:`Quand il arrive, touche « 📦 … est arrivé — pointer » : photo, puis quantités réelles face au BL. Les écarts sont signalés ⚠ et la marchandise entre en stock.`},{sel:`#stock details[open] #stkMap, #stock [data-stkui="map"] > summary`,titre:`Plan d'ensemble des stockages`,texte:`Toutes les zones sur un plan : touche une zone pour sa fiche. Livré, pris, reste, et la provenance pièce par pièce (camion d'origine, déplacements).`},{sel:`#stock [data-stkui^="z:"] > summary`,titre:`Une carte par zone`,texte:`Bord vert = en stock, jaune = prévue ; la vignette montre les pièces stockées, puis livré, pris et reste par référence. « ⇄ Scinder / transférer » déplace des pièces, leur camion les suit.`},{titre:`Les prises du terrain`,texte:`Au manchonnage, l'opérateur touche dans la fiche de la soudure la zone d'où vient la pièce (la plus proche est pré-choisie). « Pris » et « reste » se mettent à jour tout seuls.`},{sel:`#stock [data-stkui^="z:"] ~ [data-stkui="bal"] > summary`,titre:`Besoin / livré / reste à poser`,texte:`En bas, le stock et l'attendu face à ce qu'il reste à poser, pour tout le réseau ou une ligne : rouge = il manque, beige = surplus. « ⬇ CSV besoin / livré / reste » pour le transmettre.`}],"chantier:fourniture":[{sel:`#tabbar [data-tab="fourniture"]`,titre:`Fournitures`,texte:`Ce que le tracé demande (besoin), ce qui est commandé et livré, ce qui reste à livrer et à commander. Pour le chef, le conducteur et le bureau.`},{sel:`#fourniture .ac-stats`,titre:`Les chiffres clés`,texte:`Besoin, commandé, livré, reste à livrer, à commander, surplus. Livré et attendu viennent tout seuls de l'onglet Stockage (réceptions pointées) : rien à ressaisir.`},{sel:`#fourniture [data-fzui="cmd"]`,titre:`Commande fournisseur`,texte:`« 📥 Importer une commande » : l'accusé de réception du fournisseur (Excel, CSV ou PDF) est lu ligne par ligne et vérifié avant d'entrer.`},{sel:`#fourniture details[open] .fz-cmp tr:has(th), #fourniture [data-fzui="cmp"] > summary`,titre:`Comparatif tracé ↔ commande ↔ livré`,texte:`Une ligne par référence, de l'initial au reste à livrer, avec les filtres au-dessus. En rouge : à commander ; les variations par rapport à la commande se traitent dans « ⚖ Variations » (fournisseur informé).`},{sel:`#fourniture details[open] [data-fa="lasso"], #fourniture [data-fzui="zones"] > summary`,titre:`Zones à livrer · planning`,texte:`« ⭕ Entourer une zone sur le plan » (une ou plusieurs parties livrées ensemble) ou « 📅 Reprendre les phases » : ce qui est sur place, annoncé, à faire livrer et à commander.`},{sel:`#fourniture [data-fzui="trucks"]`,titre:`Camions · planning des livraisons`,texte:`Les camions se calculent depuis les zones datées (livraison = début de zone − délai). « → Stock » annonce le camion dans l'onglet Stockage, où se fait le pointage.`},{titre:`Pièces en plus`,texte:`Plus bas, le pli « Pièces en plus » : casse, chutes, réserve, modif terrain → « ＋ Ajouter des pièces en plus ». Elles s'ajoutent au besoin, avec qui et pourquoi.`},{titre:`Hypothèses · délai et camions`,texte:`Tout en bas : délai avant le début de zone, plateau, hauteur, charge utile. Ce sont des ordres de grandeur pour planifier les camions ; le fournisseur confirme.`}],"chantier:phasage":[{sel:`#tabbar [data-tab="phasage"]`,titre:`Phasage`,texte:`Découpe le chantier en phases réelles, prises sur le plan, avec leurs dates : Tracé en déduit les soudures par jour et les fournitures. Pour le chef, le conducteur et le bureau.`},{sel:`#phasage [data-phnew]`,titre:`➕ Nouvelle phase`,texte:`Touche la conduite au début du tronçon, puis à la fin (même au milieu d'une barre) ; pour une antenne, touche-la jusqu'où tu veux aller. Puis « Créer ».`},{sel:`#phasage .phMini, #phasage [data-phens="plan"]`,titre:`Les phases sur le plan`,texte:`Vue d'ensemble, « 🗺 Plan » : chaque phase EXE y prend sa couleur et son numéro, les phases marché sont en gris. Touche un tronçon pour ouvrir sa phase.`},{titre:`Les dates d'une phase`,texte:`Touche une phase pour la déplier : son nom, ses 4 périodes (tranchée, soudure, remblaiement, enrobé), puis la présence : décoche les jours où la soudure ou le terrassement ne viennent pas.`},{sel:`#phasage [data-phwk]`,titre:`Semaine de soudure`,texte:`« 4 j (lun → jeu) » ou « 5 j (lun → ven) », jours fériés déduits. Tracé en tire les soudures par jour et par DN, les mètres ouverts et remblayés par jour (ou sur les jours cochés).`},{sel:`#phImport`,titre:`＋ Phase marché`,texte:`Le planning du marché : pose-la sur le plan comme une phase, avec sa période, puis « 🔒 Figer (référence des écarts) ». Les phases EXE s'y rattachent seules, par leur position.`},{sel:`#phasage [data-phlv]`,titre:`EXE, Marché, Tout`,texte:`Filtre la liste des phases ; coche des phases EXE puis « Σ Grouper les cochées » pour suivre un secteur. « 📊 Semaines », en haut, compare chaque marché à ses phases.`},{sel:`#phExport`,titre:`📄 Exporter le phasage`,texte:`Une page imprimable (PDF) : le plan, le planning, puis une section par phase avec ses soudures et ses fournitures, à partager avec les équipes.`}],"chantier:ts":[{sel:`#tabbar [data-tab="ts"]`,titre:`Modifications`,texte:`Compare le tracé du marché (figé) au réel. Par défaut tout est compris : tu déclares seulement ce que tu veux ressortir (TS, pour mémoire…), pointé sur le plan.`},{sel:`#tsview .tsMain, #tsview .mdEc`,titre:`Marché vs réel / projeté`,texte:`Linéaire, soudures, coudes, vannes, tés… : la quantité du marché, celle du réel et l'écart, avec ce qui est ajouté ou retiré. La ligne au-dessus résume les écarts.`},{sel:`#tsview [data-mod="decl"]`,titre:`＋ Déclarer une modif`,texte:`Un nom, un état, le n° de devis, puis « Ce que je veux ressortir » : changement de DN, linéaire, soudures, pièces ou autre. Un écart constaté s'ajoute d'un toucher.`},{titre:`📍 Pointer sur le plan`,texte:`Dans la fenêtre, « 📍 Pointer sur le plan » : touche l'endroit (plusieurs points possibles, re-touche pour enlever), puis « ✓ Terminé ». Depuis le plan : ＋ Poser → ✍ Déclarer une modif.`},{titre:`Les états`,texte:`TS proposé (jaune), TS commandé (orange, n° de devis obligatoire), Pour mémoire (vert), Compris (violet), Oubli du dessin (gris, le marché est corrigé). Le repère sur le plan prend sa couleur.`},{sel:`#tsview .dclCard, #tsview .mdCard`,titre:`Les modifs déclarées`,texte:`Une carte par modif : ce qui est ressorti, où, la note, les photos, le journal ; « ✎ Modifier », « 🗺 Voir sur le plan ». Sur le plan, touche un repère n° pour sa fiche.`},{sel:`#tsview [data-mod="export"]`,titre:`📄 Export des modifications`,texte:`Une page imprimable : comparaison marché → réel, récap par état, puis chaque modif avec son plan et son repère. À joindre au devis ou au DOE.`},{sel:`#tsview [data-tsrefreeze]`,titre:`🔒 Re-figer le marché…`,texte:`Si le tracé de base n'était pas fini quand le marché a été figé, ou pour un avenant : le tracé actuel devient la référence. L'ancien marché est gardé.`}],"chantier:points":[{sel:`#tabbar [data-tab="points"]`,titre:`Points de contrôle`,texte:`Les vannes, purges, vidanges, sous-stations et raccordements du tracé : leur état et leurs photos datées, pour le suivi et le DOE. Pour toute l'équipe du chantier.`},{sel:`#points .pt-kpi`,titre:`Ce qui reste à faire`,texte:`Les vannes sans état et les points sans photo, en rouge tant qu'il en manque. Juste en dessous, les filtres (Sans photo, Vannes, Purges / vidanges…) ne montrent qu'eux.`},{sel:`#points .pt-row`,titre:`Ouvrir un point`,texte:`Touche une ligne : la fiche du point s'ouvre. « 📐 Plan » montre la pièce sur le plan, avec sa pastille.`},{titre:`Ouverte ou fermée`,texte:`Dans la fiche d'une vanne, d'une purge ou d'une vidange : « 🔓 Ouverte » ou « 🔒 Fermée ». C'est daté, à ton nom, et l'appli te demande aussitôt la photo.`},{titre:`Les constats photo`,texte:`« 📷 Ajouter des photos », puis le contexte : pénétration, pièce posée, épreuve, fuite… Sans réseau, les photos attendent sur le téléphone et partent toutes seules.`},{titre:`Les pastilles sur le plan`,texte:`À côté de chaque pièce : vert = ouverte, rouge = fermée, bleu = photos, gris = rien encore, orange = à voir (vanne de coupe ouverte pendant un essai).`},{sel:`#points [data-moterrain]`,titre:`Mode opératoire hydraulique`,texte:`Quand le bureau a préparé un essai, il s'affiche en haut : « Suivre sur le plan » montre chaque étape (vannes, remplissage, purges). Coche « ✓ Fait » au fur et à mesure.`,si:e=>!e||!e.feat||e.feat(`hydro`)},{titre:`Suivre une autre pièce`,texte:`Encadrement : dans la fiche d'une pièce, « 📍 Suivre ce point (photos, état) » l'ajoute à cette liste, filtre « Autres suivis ».`,si:Qc}],"chantier:catalogue":[{sel:`#tabbar [data-tab="__more"], #catalogue h2.vt`,titre:`Catalogue des pièces`,texte:`Les cotes des pièces de chaque fournisseur : Tracé s'en sert pour reconnaître les pièces du plan et les dessiner. Cet écran s'ouvre par « ⋯ Plus », au bout de la barre du bas.`},{sel:`#catalogue [data-cat]`,titre:`Un fournisseur à la fois`,texte:`Touche une puce pour changer de fournisseur ; « · ce chantier » marque celui du chantier ouvert.`},{sel:`#catalogue table.cat`,titre:`Les tableaux`,texte:`Tubes droits (DN, Ø acier, gaines, longueurs de barre), puis coudes, tés, réductions, vannes et manchons. Glisse un tableau large sur le côté pour tout voir.`},{titre:`Une cote fausse ?`,texte:`La source du catalogue est indiquée en haut. Une cote fausse donne un plan faux : signale-la au bureau, avec la référence du fournisseur.`}],concepteur:[{titre:`Tracé Concepteur`,texte:`On dessine ici le réseau (lignes, pièces) sur un plan de fond, puis on l'envoie dans le chantier. Pour le bureau et l'encadrement, plutôt sur ordinateur.`},{sel:`#mTrace`,titre:`✎ Tracer une ligne`,texte:`Clique les sommets de l'axe un à un, puis Entrée (ou « Terminer ») ; ou saisis longueur et angle, puis « Ajouter ». Les soudures se placent toutes seules.`},{sel:`#supplier`,titre:`Fournisseur, série, DN, barre`,texte:`À régler avant ou pendant le tracé : la ligne prend ces valeurs quand tu la valides. « prof. » = profondeur de pose par défaut, modifiable ligne par ligne.`},{sel:`#mSelect`,titre:`☝ Sélection`,texte:`Touche une ligne, une soudure ou une pièce pour sa fiche ; glisse un sommet pour retoucher. « ◐ Un seul côté » ne bouge qu'une conduite.`},{sel:`#mAdd`,titre:`Les pièces`,texte:`« ＋ Té / vanne / réduction / lyre / drapeau » : choisis la pièce et son DN, puis touche la ligne à l'endroit voulu.`},{sel:`#bUndo`,titre:`Annuler, rétablir`,texte:`↶ annule la dernière retouche (Ctrl+Z), ↷ la rétablit (Ctrl+Y), plans de fond compris.`},{sel:`label:has(> #bgAdd)`,titre:`＋ Plan (DXF, PDF, image)`,texte:`Ajoute un ou plusieurs plans de fond : DXF du bureau d'études, PDF (une page = un plan), image ou scan. Chaque plan se cale ensuite.`},{sel:`#bgTools #bgCal2, #bgTools #bgScale, aside .tabs [data-tab="fond"]`,titre:`Caler un plan`,texte:`« 📏 Échelle » : deux points de distance connue ; « 1/N » pour un PDF ; « ✥ Déplacer » ; « ⟲ 2 points » le cale d'un coup sur le tracé. Sur ordinateur : onglet Fond.`},{sel:`#bAer`,titre:`📍 Vue aérienne`,texte:`Tape une adresse : la photo IGN se met en fond, derrière les plans. Puis « ⌖ Caler sur la vue aérienne » : 1 point pour placer, 2 pour tourner aussi.`},{sel:`#t1Zones`,titre:`▦ Zones de chiffrage`,texte:`« ▭ Sélection » : entoure des lignes d'un rectangle, puis « Mettre dans la zone… ». « ▦ Zones » liste chaque zone avec son nom, ses lignes et ses ml.`},{sel:`#tbVers`,titre:`🕑 Versions`,texte:`Dans une étude (Commerce), « 🕑 Versions » montre ce qui a été ajouté, modifié ou supprimé à chaque version ; touche une version pour voir ses changements.`},{sel:`#bSave`,titre:`💾 Enregistrer dans Tracé`,texte:`Donne le nom du chantier, ou mets à jour l'existant (soudures déjà faites gardées). Le réseau part dans le chantier, soudures numérotées, et au serveur si tu es connecté.`}]},tl=e=>{try{return!!document.querySelector(e)}catch{return!1}},nl=e=>{try{return String(e&&e.where&&e.where()||``)}catch{return``}},rl=(e,t)=>nl(e)===t,il=(e,t)=>{let n=nl(e);return n===t||n.startsWith(t+`:`)},al=(e,t)=>!e||!e.can||!!e.can(t),ol=(e,t)=>!e||!e.feat||!!e.feat(t),sl=()=>{try{let e=window.TRACE;return!!(e&&e.acces&&e.acces.isAdmin&&e.acces.isAdmin())}catch{return!1}},cl=e=>{try{let e=window.TRACE,t=e&&e.acces&&e.acces.current&&e.acces.current();if(t&&e.acces.rights)return!!e.acces.rights(Object.assign({},t,{admin:!1}))[`pointage.self`]}catch{}return al(e,`pointage.self`)},ll=(e,t,n)=>r=>(e.includes(`:`)?rl(r,e):il(r,e))?tl(t):!n||!!n(r),ul=(e,t)=>n=>rl(n,`equipe`)?tl(e):!t||!!t(n),dl=e=>`#eq-app .eq-subs [data-v="`+e+`"]`,fl=e=>sl()||al(e,`qse.manage`),pl={"compagnon:docs":`Documents`,"compagnon:planning":`Planning`,"compagnon:chantiers":`Chantiers`,"compagnon:prod":`Productions`,"compagnon:frais":`Notes de frais`,"compagnon:heures":`Heures`,"compagnon:habs":`Passeport`,"compagnon:avatar":`Avatar`,"compagnon:dem":`Mes demandes · commande`,"compagnon:mag":`Mes demandes concerne : pointage, heures, documents, matériel. Glisse la barre pour voir tes rubriques ; « ? » relance le tutoriel.`},{sel:`#eq-app section.ptc, `+dl(`moi`),titre:`Accueil et pointage`,texte:`L'Accueil, c'est ta journée : chantier, demain, échéances, ta fiche. Pointe ici : « ▶ Commencer la journée », la pause, la fin.`,si:ll(`compagnon`,dl(`heures`),cl)},{sel:dl(`moi`),titre:`Accueil : ta journée`,texte:`Ton chantier du jour, demain, tes notes de frais, tes échéances et ta fiche : tout d'un coup d'œil.`,si:e=>il(e,`compagnon`)?!tl(dl(`heures`)):!cl(e)},{sel:dl(`docs`)+`, #eq-app .eq-subs`,titre:`Documents`,texte:`Règlement, notes de service, flash info : à lire jusqu'en bas, puis à signer au doigt sous 7 jours. La pastille rouge compte ce qui reste.`},{sel:dl(`planning`)+`, #eq-app .eq-subs`,titre:`Planning`,texte:`Ta semaine jour par jour : ton chantier, avec qui, tes objectifs. « Semaine prochaine » pour savoir où tu vas lundi.`,si:ll(`compagnon`,dl(`planning`),e=>ol(e,`planning`))},{sel:dl(`heures`)+`, `+dl(`prod`)+`, #eq-app .eq-subs`,titre:`Heures et Productions`,texte:`Heures : tes journées pointées, ce qui est validé, ta navette du mois. Productions : tes soudures et manchons comptés sur le plan.`,si:ll(`compagnon`,dl(`heures`)+`, `+dl(`prod`),cl)},{sel:dl(`frais`)+`, #eq-app .eq-subs`,titre:`Notes de frais`,texte:`Une dépense avancée pour le chantier : le montant, le ticket en photo, c'est envoyé. Ton conducteur valide, le bureau rembourse.`,si:ll(`compagnon`,dl(`frais`),e=>ol(e,`frais`))},{sel:dl(`habs`)+`, #eq-app .eq-subs`,titre:`Passeport et Avatar`,texte:`Passeport : tes habilitations, à jour ou à renouveler. Avatar : ton personnage dans l'appli, il porte tes récompenses.`},{sel:dl(`mag`)+`, `+dl(`dem`)+`, #eq-app .eq-subs`,titre:`Mes demandes`,texte:`Besoin de matériel pour ton chantier ? « ＋ Nouvelle demande », puis tu suis l'état : avec un magasin, tu la retires au dépôt ; sinon l'encadrement la commande et la fait livrer.`,si:ll(`compagnon`,dl(`mag`)+`, `+dl(`dem`),e=>ol(e,`magasin`)||ol(e,`demandes`))},{sel:dl(`vlaisse`)+`, #eq-app .eq-subs`,titre:`Véhicule laissé`,texte:`Un véhicule t'attend sur un chantier ou au dépôt : lis son état des lieux, puis signe pour le prendre.`,si:e=>il(e,`compagnon`)&&tl(dl(`vlaisse`))},{sel:dl(`chantiers`)+`, #eq-app .eq-subs`,titre:`Chantiers`,texte:`Les chantiers dont tu es chef ou conducteur : avancement, stock, engins.`,si:e=>il(e,`compagnon`)&&tl(dl(`chantiers`))}],"compagnon:docs":[{sel:`#eq-app .ac-row.todo, #eq-app h2.vt`,titre:`À lire et signer`,texte:`Les documents qui te concernent : règlement intérieur, notes de service, flash info. Le plus urgent en haut, à signer sous 7 jours.`},{sel:`#eq-app [data-act="docopen"]`,titre:`Ouvrir un document`,texte:`Touche-le : il s'ouvre en grand (« ⤢ Plein écran » si besoin). Déroule-le jusqu'en bas, ou jusqu'à la dernière page du PDF.`},{titre:`Signer au doigt`,texte:`En bas, « ✓ J'ai lu en entier — je signe » se débloque. Signe dans le cadre avec le doigt, puis « Valider ma signature ».`},{titre:`Les couleurs`,texte:`Bord rouge : à lire et signer, avec la date limite (en rouge si elle est dépassée) ; ✓ vert : signé, avec sa date.`},{titre:`Nouvelle version`,texte:`Un document qui change revient « nouvelle version, à lire et signer ». Ton ancienne signature reste gardée.`},{titre:`Livrets et déjà signés`,texte:`Plus bas : tes livrets d'accueil, à relire chapitre par chapitre quand tu veux, et tout ce que tu as déjà signé.`},{titre:`Rien ne bloque`,texte:`Tu gardes l'accès à toute l'appli pendant ces 7 jours. Les RH voient qui a signé et relancent les retards.`}],"compagnon:planning":[{sel:`#eq-app .eq-semaine`,titre:`Ta semaine`,texte:`Un jour par case : ton chantier, la météo, 🎯 tes objectifs ; « repos » si rien n'est prévu. Touche un jour pour son détail.`},{sel:`#eq-app [data-act="plansem"]`,titre:`Cette semaine, la suivante`,texte:`« Semaine prochaine » pour savoir où tu vas lundi. Le week-end, c'est elle qui s'ouvre.`},{sel:`#eq-app .eq-plan-site, #eq-app .eq-cols`,titre:`Le détail du jour`,texte:`Horaires et point de rassemblement, tes objectifs, les responsables du chantier et tes compagnons : 📞 pour appeler.`},{sel:`#eq-app .eq-plan-site [data-act="opensite"]`,titre:`Ouvrir le chantier`,texte:`En bas du jour, « Ouvrir le chantier » t'emmène sur son plan. 🗺 à côté d'un objectif le montre sur le plan.`,si:ll(`compagnon:planning`,`#eq-app .eq-plan-site`)},{sel:`#eq-app [data-act="xgo"][data-v="agenda"]`,titre:`Composer ma semaine`,texte:`Encadrement : ton planning n'est pas imposé. Ajoute visites, réunions et rendez-vous ; export Outlook possible.`,si:ll(`compagnon:planning`,`#eq-app [data-act="xgo"][data-v="agenda"]`,e=>al(e,`planning.edit`))},{titre:`Qui fait le planning`,texte:`Ton conducteur place les équipes. Dès que c'est fait, ton Accueil affiche aussi où tu vas demain.`}],"compagnon:prod":[{sel:`#eq-app .eq-filtres`,titre:`Choisis la période`,texte:`Semaine, Mois ou 12 semaines. ◀ ▶ ou la liste juste en dessous pour aller à une semaine précise.`},{sel:`#eq-app .eq-tiles, #eq-app .eq-scroll .card`,titre:`Ton total`,texte:`Ce que tu as fait sur la période : soudures, manchons… et le détail par DN juste en dessous.`},{sel:`#eq-app .eq-sem-h`,titre:`Semaine par semaine`,texte:`Touche une semaine pour la déplier jour par jour : ton chantier et ta production de chaque jour.`},{titre:`D'où viennent les chiffres`,texte:`Chaque soudure ou manchon pointé sur le plan à ton nom compte ici. En cas d'erreur, vois avec ton chef de chantier.`},{titre:`Ta récompense`,texte:`Ta production fait monter ton palier : il se voit sur ton avatar (carte « Tes récompenses » de l'Accueil, rubrique Avatar).`}],"compagnon:frais":[{sel:`#eq-app .ac-stats`,titre:`Tes notes de frais`,texte:`Le total de tes notes de frais et combien attendent d'être validées.`},{sel:`#eq-app [data-act="cmd"][data-v="dbnew|"]`,titre:`➕ Note de frais`,texte:`Une dépense avancée pour le chantier : carburant, péage, hôtel, repas… Touche le bouton dès que tu as payé.`},{titre:`Remplir la note`,texte:`Date, montant TTC, nature, chantier, payé avec (carte SCR, tes deniers, caisse du chantier). Puis « Enregistrer la note de frais ».`},{titre:`Le ticket, tout de suite`,texte:`« 📷 Prendre en photo » ou « 📎 Importer » (photo, PDF). Ticket donné au chef : écris « ticket remis au chef » dans Lien.`},{titre:`Qui valide`,texte:`Ton conducteur ou le bureau valide, puis le bureau rembourse. Tant qu'elle est « Saisi », tu peux la retirer (🗑).`},{titre:`Les états`,texte:`Saisi (jaune) → Validé (vert) → Remboursé (violet). Refusé (rouge) : le nom de qui a refusé est sur la ligne.`},{titre:`Hors réseau`,texte:`Sans réseau, la photo du ticket reste dans la note et part avec elle au retour du réseau.`}],"compagnon:heures":[{sel:`#eq-app section.ptc`,titre:`Ton pointage du jour`,texte:`Comme sur l'Accueil : « ▶ Commencer la journée », « Pause midi », « ▶ Reprise après la pause », « ■ Fin de journée ».`},{sel:`#eq-app section.ptc`,titre:`Les couleurs du pointage`,texte:`Gris : pas commencée ; vert : au travail ; orange : en pause ; bleu : en route vers un autre chantier ; noir : journée finie.`},{sel:`#eq-app .pi-pts`,titre:`Tes derniers pointages`,texte:`Chaque jour passe par 3 étapes : déclaré › chef › conducteur. Fin oubliée : « 🕓 Indiquer l'heure de fin », ton chef la voit.`,si:ll(`compagnon:heures`,`#eq-app .pi-pts`)},{sel:`#eq-app .eq-filtres`,titre:`Tes heures par période`,texte:`Semaine, Mois ou 12 semaines : heures travaillées, jours pointés, pauses. Touche une semaine pour le jour par jour.`},{sel:`#eq-app .mynav`,titre:`Ma navette`,texte:`Tes variables du mois : heures, heures sup à 125 % et 150 %, déplacements. « ⬇ Ma navette (Excel) » pour la garder.`},{titre:`Une erreur ?`,texte:`Fin touchée par erreur : « ↩ Annuler la fin » tant que personne n'a validé. Après, ton chef corrige, avec le motif.`},{titre:`Hors réseau`,texte:`Sans réseau, ton pointage est gardé sur le téléphone et part dès que le réseau revient. Ta position n'est notée qu'au début et à la fin.`}],"compagnon:habs":[{sel:`#eq-app .eq-scroll .eq-filtres`,titre:`Ton passeport d'un coup d'œil`,texte:`Tes formations et habilitations comptées par état : à jour, à renouveler (90 j), expiré, manquant.`},{sel:`#eq-app .eq-scroll .eq-list`,titre:`Chaque habilitation`,texte:`Son nom, son numéro, jusqu'à quand elle est valable. S'il y a une pièce jointe, touche la ligne pour l'ouvrir.`},{titre:`Les couleurs`,texte:`Vert : à jour ; orange : à renouveler sous 90 jours ; rouge : expirée ; gris : manquante pour ton poste.`},{titre:`Qui le tient à jour`,texte:`Les RH saisissent tes habilitations : une date fausse, une pièce à ajouter, préviens-les.`},{titre:`Qui voit tes alertes`,texte:`Ton chef et les RH voient aussi tes échéances : ils programment les recyclages avant qu'elles n'expirent.`}],"compagnon:mag":[{sel:`#eq-app [data-v="mag|new"]`,titre:`＋ Nouvelle demande`,texte:`Du matériel du dépôt ? Touche « ＋ Nouvelle demande ».`},{titre:`Choisis les articles`,texte:`Ta liste de métier en premier, ou 🔍 cherche dans tout le dépôt. + et − pour la quantité, puis « Suivant › ».`},{titre:`Pour quoi ?`,texte:`🏗 Chantier, 🚐 Véhicule ou 📦 Dépôt, ⚡ urgent si besoin, une note. Puis « 📤 Envoyer la demande ».`},{sel:`#eq-app .mag-row, #eq-app .mag-vide`,titre:`Suivre ta demande`,texte:`Envoyée (bleu) → En préparation (jaune) → Prête au dépôt (vert) : tu es prévenu, passe la retirer. Touche-la pour le détail.`},{titre:`Annuler, reliquat`,texte:`« Annuler la demande » tant que la préparation n'a pas commencé. Prête en partie : le reste suit, tu seras prévenu.`},{sel:`#eq-app [data-v="mag|fiches|"]`,titre:`🧰 Fiches type`,texte:`Le matériel prévu pour chaque poste : à regarder avant de demander.`},{sel:`#eq-app .mag-rf`,titre:`Hors réseau`,texte:`Sans réseau, ta demande reste sur le téléphone et part toute seule au retour. ↻ recharge l'état depuis le serveur.`}],"compagnon:dem":[{sel:`#eq-app .dm-head`,titre:`Mes demandes`,texte:`Du matériel pour un chantier, commandé par ton conducteur ou le bureau (pas par le dépôt). Tu demandes, tu suis chaque étape.`},{sel:`#eq-app [data-v="dem|new|"]`,titre:`＋ Nouvelle demande`,texte:`1/2 : ce qu'il te faut. Ta liste de métier (+ et −), ou écris l'article et la quantité, puis « ＋ Ajouter à ma demande ».`},{titre:`2/2 : pour quel chantier`,texte:`Le chantier (les tiens en premier), ⚡ urgent si besoin, une photo, une note. Puis « 📤 Envoyer la demande ».`},{sel:`#eq-app .dm-row, #eq-app .dm-vide`,titre:`Suivre l'état`,texte:`Envoyée (bleu) → Commandée (jaune, avec la date prévue) → Livrée (vert). Livrée en partie (violet) : le reste suit.`},{titre:`Refusée, annulée`,texte:`Refusée (rouge) : le motif est écrit. Tu peux annuler ta demande tant qu'elle n'est pas commandée.`},{titre:`Tu es prévenu`,texte:`À chaque changement, « nouveau » s'affiche sur la demande et une pastille sur la rubrique.`},{sel:`#eq-app [data-v="dem|file|"]`,titre:`📋 Demandes à traiter`,texte:`Encadrement : les demandes de tes équipes. « 🛒 Commandé », puis « 📦 Livré / remis », ou « Refuser la demande » avec un motif.`,si:e=>rl(e,`compagnon:dem`)&&tl(`#eq-app [data-v="dem|file|"]`)},{titre:`Hors réseau`,texte:`Sans réseau, la demande reste sur le téléphone (« ⏳ pas encore partie ») et part toute seule au retour du réseau.`}],"compagnon:avatar":[{sel:`#eq-av-prev`,titre:`Ton avatar`,texte:`C'est toi dans l'appli : Accueil, planning, annuaire. « Au travail » et « Hors travail » montrent tes deux tenues.`},{sel:`#eq-av-side .card`,titre:`Poste`,texte:`Ton poste fixe ta tenue de travail : il est attribué par l'administrateur.`},{titre:`Visage`,texte:`Silhouette, teint, cheveux, coiffure, barbe… Touche une vignette : l'aperçu change tout de suite.`},{titre:`Tenue hors travail`,texte:`Haut, bas, chaussures, couleurs, accessoire : ta tenue perso, montrée en dehors de tes heures pointées.`},{titre:`Récompenses`,texte:`Elles se gagnent sur le terrain (production, sécurité, qualité, ancienneté) et se voient sur ton avatar.`},{sel:`#eq-app [data-act="avhasard"]`,titre:`Au hasard, réinitialiser`,texte:`« 🎲 Au hasard » tire un avatar, « Réinitialiser » revient au départ. Tout est enregistré au fur et à mesure.`}],"compagnon:chantiers":[{sel:`#eq-app .eq-sems .card`,titre:`Tes chantiers`,texte:`Un chantier par carte : ville, météo, qui est dessus aujourd'hui, le chef de chantier.`},{sel:`#eq-app .eq-prog`,titre:`L'avancement`,texte:`Soudures faites sur le total, en %. La barre avance avec les soudures pointées sur le plan.`},{titre:`Stock et engins`,texte:`Les articles suivis (orange : sous le seuil, à commander) et les engins, loués ou en propre, avec la fin de location.`},{sel:`#eq-app .eq-sems [data-act="opensite"]`,titre:`Ouvrir le stock`,texte:`« Ouvrir le stock » t'emmène dans l'onglet Stock du chantier : livraisons, zones, prélèvements.`}],"compagnon:vlaisse":[{sel:`#eq-app .veh2-card`,titre:`Un véhicule à prendre`,texte:`Laissé sur un chantier ou au dépôt, pour toi ou « à qui le prendra » : qui l'a laissé, où, quand, ses kilomètres.`},{sel:`#eq-app .veh2-card .veh-big`,titre:`Le prendre`,texte:`Touche le bouton : tu lis l'état des lieux laissé (photos, kilomètres, remarques). S'il n'y en a pas, tu fais le tien, étape par étape.`},{titre:`Exact ou contesté`,texte:`Si c'est exact, signe : le véhicule est à toi. Sinon, conteste avec un mot ; les responsables tranchent.`},{titre:`Qui valide ?`,texte:`Signer l'état des lieux laissé suffit, sans responsable. Ton propre état des lieux, lui, est relu et validé par un responsable.`}],"compagnon:vx":[{sel:`#eq-app .veh-wiz h2.vt, #eq-app .veh-bar, #eq-app .veh-wiz`,titre:`Une étape par écran`,texte:`L'état des lieux du véhicule que tu prends ou que tu laisses : le numéro (1/9…) et la barre montrent où tu en es.`},{sel:`#veh-next`,titre:`Continuer ›`,texte:`Remplis l'étape, puis touche « Continuer › ». « Abandonner » arrête l'état des lieux.`},{sel:`#eq-app [data-v^="veh|qui|"]`,titre:`Qui est là ?`,texte:`Le responsable est avec toi : il relit et valide tout de suite. Personne avec toi : tu fais tout et tu signes, un responsable valide ensuite.`},{titre:`Kilomètres et niveaux`,texte:`Le kilométrage, le carburant et les niveaux, puis les points d'état et les documents à bord.`},{titre:`Les photos`,texte:`Les photos imposées, puis chaque impact. Elles protègent la personne qui laisse le véhicule comme celle qui le prend.`},{titre:`Inventaire et cartes`,texte:`L'inventaire est pré-coché « présent » : ne touche que ce qui manque. Puis les cartes et dispositifs à bord.`},{titre:`Signer`,texte:`Relis le récapitulatif et signe au doigt. Un état des lieux laissé par quelqu'un d'autre : signe qu'il est exact, ou conteste.`},{titre:`Rien ne se perd`,texte:`Hors réseau, tout reste sur ce téléphone et part à la reconnexion ; une saisie interrompue se reprend depuis « À faire ».`}],equipe:[{titre:`Équipe`,texte:`L'entreprise : les personnes, les documents à signer, les infos. Tout le monde y a accès ; quelques lignes sont réservées aux RH, au bureau et à l'administrateur.`},{sel:`#eq-q`,titre:`L'équipe de ton chantier`,texte:`Intérimaire : tu vois les personnes de ton chantier. Touche une personne pour sa fiche et l'appeler.`,si:e=>rl(e,`equipe`)&&tl(`#eq-q`)&&!tl(`#eq-app [data-act="xgo"][data-v="annu"]`)},{sel:`#eq-app [data-act="xgo"][data-v="annu"]`,titre:`Annuaire`,texte:`Toute l'entreprise par poste : fiche, téléphone, e-mail. Touche une personne pour l'appeler.`,si:ul(`#eq-app [data-act="xgo"][data-v="annu"]`)},{sel:`#eq-app [data-act="xgo"][data-v="docs"]`,titre:`Documents d'entreprise`,texte:`Règlement intérieur, notes de service, flash info sécurité, documents d'accueil des nouveaux : qui les a signés.`,si:ul(`#eq-app [data-act="xgo"][data-v="docs"]`)},{sel:`#eq-app [data-act="xgo"][data-v="info"]`,titre:`Communication interne`,texte:`Les infos publiées à tout le monde : actualités, résultats, événements. À lire, sans signature.`,si:ul(`#eq-app [data-act="xgo"][data-v="info"]`)},{sel:`#eq-app [data-act="xgo"][data-v="x:dob:ent"]`,titre:`Documents administratifs`,texte:`Assurances, Kbis, URSSAF, RIB, qualifications : déposés une fois, joints aux offres, avec une alerte avant échéance.`,si:ul(`#eq-app [data-act="xgo"][data-v="x:dob:ent"]`,e=>fl(e)||al(e,`affaires.view`)||al(e,`dossier.edit`))},{sel:`#eq-app [data-act="xgo"][data-v="x:pack:imp"]`,titre:`Pack SCR`,texte:`Administrateur : le fichier privé de l'entreprise (catalogue du magasin, documents d'accueil, véhicules…), importé une fois.`,si:ul(`#eq-app [data-act="xgo"][data-v="x:pack:imp"]`,sl)},{sel:`#eq-app [data-act="tabgo"][data-v="admin"]`,titre:`Administration`,texte:`Administrateur : comptes et accès, postes, qui peut quoi, options et modules. C'est l'écran Réglages.`,si:ul(`#eq-app [data-act="tabgo"][data-v="admin"]`,sl)}],"equipe:annu":[{sel:`#eq-q`,titre:`Chercher quelqu'un`,texte:`Tape un nom ou un poste : la liste se filtre au fur et à mesure.`},{sel:`#eq-app .eq-filtres:has([data-act="ffam"]), #eq-app [data-act="ffam"]`,titre:`Par famille`,texte:`Toutes, Direction, Encadrement, Terrain, Support : touche une famille pour ne garder qu'elle.`},{sel:`#eq-app [data-chg="fSite"]`,titre:`Par chantier`,texte:`Choisis un chantier dans la liste : tu vois qui y travaille aujourd'hui.`},{sel:`#eq-app .eq-filtres:has([data-act="entvue"]), #eq-app [data-act="entvue"]`,titre:`Tenue de travail ou hors travail`,texte:`Les avatars en tenue de chantier ou en tenue perso : pratique pour mettre un visage sur un nom.`},{sel:`#eq-app .eq-pers`,titre:`La fiche et l'appel`,texte:`Touche une personne : sa fiche s'ouvre en bas — poste, chantier du jour, chef. « 📞 Appeler » ou « ✉️ E-mail » en un toucher.`},{titre:`Ce qui reste privé`,texte:`Domicile, contrat, compteurs d'heures : seuls les RH et l'encadrement concerné les voient. Ta fiche à toi est dans Compagnon (« Ta fiche »).`},{titre:`Ancienneté et médailles`,texte:`RH et direction : les paliers d'ancienneté des 6 prochains mois et les médailles du travail à vérifier, en haut de la liste.`,si:e=>al(e,`rh.voir`)}],"equipe:docs":[{sel:`#eq-app [data-act="xgo"][data-v="x:acc:admin"]`,titre:`📗 Accueil RH`,texte:`Le livret d'accueil, les documents d'accueil des nouveaux, le passeport de prévention : qui a signé, qui est en retard.`,si:e=>fl(e)||al(e,`dossier.edit`)},{sel:`#eq-app [data-act="docadm"]`,titre:`Les documents`,texte:`Règlement intérieur, notes de service, flash info : pour chacun, qui doit signer et combien l'ont fait.`},{sel:`#eq-app [data-act="docadm"]`,titre:`Qui a signé ?`,texte:`Touche un document : chaque personne, ✓ avec la date ou « à signer ». « 🖨 Feuille des signatures » pour l'imprimer.`},{sel:`#eq-app [data-act="docnew"][data-v="note"]`,titre:`➕ Note de service`,texte:`Un PDF à dérouler en entier, ou un texte. Choisis qui doit la signer, puis « Publier — à lire et signer ».`,si:fl},{sel:`#eq-app [data-act="docnew"][data-v="flash"]`,titre:`⚡ Flash info sécurité`,texte:`Toujours un PDF ; par défaut pour tous les postes exploitation et les intérimaires. Il arrive aussitôt « à lire et signer ».`,si:fl},{sel:`#eq-app [data-act="doclate"], #eq-app .okbox`,titre:`À relancer`,texte:`Qui n'a pas signé, les retards d'abord. « 🖨 Liste des retardataires » pour les relancer sur le chantier.`,si:fl},{titre:`Cibler, archiver`,texte:`Dans un document : « 👥 Qui doit signer ? » pour changer qui est concerné, « Archiver » quand il n'est plus à signer.`,si:fl},{titre:`Et tes signatures ?`,texte:`Tes propres documents à signer sont dans Compagnon → Documents, avec leur date limite (7 jours).`}],"equipe:info":[{sel:`#eq-app .ac-row[data-act="docopen"], #eq-app .ac-empty`,titre:`Les infos de l'entreprise`,texte:`Actualités, résultats, événements, arrivées : la plus récente en haut, avec qui l'a publiée et quand.`},{sel:`#eq-app .ac-row[data-act="docopen"], #eq-app .ac-empty`,titre:`Lire une info`,texte:`Touche une info pour l'ouvrir en grand, avec son PDF s'il y en a un.`},{titre:`À lire, pas à signer`,texte:`Une info se lit, elle ne se signe pas. Ce qui doit être signé (note de service, flash info) passe par Documents d'entreprise.`},{sel:`#eq-app [data-act="infonew"]`,titre:`📣 Publier une info`,texte:`Un titre, le texte (un paragraphe par ligne), un PDF si besoin, puis « Publier » : tout le monde la voit.`,si:ll(`equipe:info`,`#eq-app [data-act="infonew"]`,fl)}],"equipe:x:acc":[{sel:`#eq-app .eq-kpis`,titre:`Accueil RH en chiffres`,texte:`Documents d'accueil, lisibles, PDF à joindre, signatures en retard : un chiffre rouge est à traiter.`},{sel:`#eq-app [data-v="acc|pick|pack"]`,titre:`1. Importer le pack`,texte:`Administrateur : le fichier privé de l'entreprise (documents, livrets, passeport). Le réimporter met à jour, sans doublon.`,si:ll(`equipe:x:acc`,`#eq-app [data-v="acc|pick|pack"]`,sl)},{sel:`#eq-app [data-v="acc|pick|pdfs"]`,titre:`2. Joindre les PDF`,texte:`Plusieurs PDF d'un coup : chacun va au document qui porte son nom, et part aussitôt « à lire et signer ».`,si:ll(`equipe:x:acc`,`#eq-app [data-v="acc|pick|pdfs"]`,sl)},{titre:`La carte de bienvenue`,texte:`Un nouveau compte voit en tête de son accueil « Bienvenue », ses documents à signer sous 7 jours et « Commencer ». Rien ne bloque son accès.`},{sel:`#eq-app .acc-drow, #eq-app .ac-empty`,titre:`Les documents d'accueil`,texte:`Pour chacun : texte ou PDF, qui doit signer, combien l'ont fait. Touche-le pour la liste des signatures.`},{titre:`Retards et passeport`,texte:`« En retard » liste qui n'a pas signé à temps. Plus bas : le passeport de prévention, formation par formation.`}],"equipe:x:dob":[{sel:`#eq-app .eq-kpis`,titre:`Les pièces en chiffres`,texte:`Combien sont valides, à renouveler (30 jours ou moins), expirées ou encore à déposer.`},{sel:`#eq-app .dob-erow`,titre:`Une pièce par ligne`,texte:`Attestations RC et décennale, Kbis, URSSAF, attestation fiscale, RIB, qualifications : leur validité et leur état.`},{sel:`#eq-app .dob-erow [data-v^="dob|edit|"]`,titre:`📎 Déposer`,texte:`Choisis le fichier et sa date « Valide jusqu'au » (assureur et police pour une assurance), puis « Enregistrer ».`,si:ll(`equipe:x:dob`,`#eq-app .dob-erow [data-v^="dob|edit|"]`,e=>sl()||al(e,`affaires.edit`))},{titre:`Les couleurs`,texte:`Vert : valide ; orange : expire sous 30 jours (une alerte arrive dans « À faire ») ; rouge : expiré, « 📎 Remplacer » passe en premier.`},{titre:`Joints aux offres`,texte:`Déposés une fois, ils sont repris dans les offres. Une même attestation peut couvrir RC et décennale : un seul document.`},{sel:`#eq-app [data-v="dob|new|"]`,titre:`＋ Autre document`,texte:`Un RIB de plus, une carte CIBTP, la liste des salariés étrangers… : ajoute-le à la liste.`,si:ll(`equipe:x:dob`,`#eq-app [data-v="dob|new|"]`,e=>sl()||al(e,`affaires.edit`))}],"equipe:x:pack":[{sel:`#eq-app h2.vt + .card, #eq-app h2.vt`,titre:`Pourquoi un pack`,texte:`Le site de l'appli est public : rien de confidentiel dans son code. Les données privées de l'entreprise arrivent par ce fichier.`},{sel:`#eq-app label.btn:has([data-xin="pack|file"]), #eq-app label.btn.primary`,titre:`1 · Choisir le fichier`,texte:`« 📂 Choisir le pack (.json) » : le fichier privé, gardé sur ton ordinateur.`},{titre:`2 · Ce qui sera importé`,texte:`Les parties trouvées (magasin, accueil, véhicules, mémoire technique…) : décoche ce que tu ne veux pas, puis « ⬆ Importer ».`},{titre:`Le résultat`,texte:`Une ligne par partie, verte si c'est passé. Réimporter met à jour sans doublon : signatures et stock gardent leur historique.`},{titre:`Hors réseau`,texte:`Les écritures partent au serveur ; sans réseau, elles attendent sur cet appareil et partent à son retour.`}],reglages:[{titre:`Réglages`,texte:`L'écran de l'administrateur : qui a accès à Tracé, avec quels droits, quelles options et quels modules.`},{sel:`#homeBody .admNav [data-av="people"]`,titre:`👥 Personnes`,texte:`Chaque compte : poste, type, chantiers 🏗, droits 🔑, Socle ou 🧪 Labo, actif ou non. ★ = administrateur.`},{sel:`#admNew, #homeBody .admNav [data-av="people"]`,titre:`➕ Créer un accès`,texte:`Prénom, nom, e-mail, poste, type, puis « Créer l'accès ». 1re connexion : donne le « 🔐 Code de 1re connexion » de sa carte ; la personne choisit son mot de passe.`},{sel:`#homeBody .admNav [data-av="postes"]`,titre:`🧩 Postes`,texte:`Les droits d'un poste valent pour toutes ses personnes (sauf ajustement 🔑). Coche, décoche : c'est enregistré tout de suite.`},{sel:`#homeBody .admNav [data-av="who"]`,titre:`🔎 Qui peut quoi ?`,texte:`Choisis un droit : tu vois qui l'a et pourquoi (poste, ajustement personnel, administrateur).`},{sel:`#homeBody .admNav [data-av="options"]`,titre:`🧪 Options`,texte:`Les options rangées par module : Socle (tout le monde) ou 🧪 Labo (les testeurs). Désigne les testeurs, toi compris.`},{sel:`#homeBody .admPalBan, #homeBody .admNav [data-av="options"]`,titre:`⏻ Les paliers`,texte:`Éteints : tout le monde voit tout. Allumés : chacun ne voit que son palier — passe-toi en 🧪 Labo avant d'allumer.`},{sel:`#homeBody .admNav [data-av="entreprise"]`,titre:`🏢 Entreprise et modules`,texte:`Le logo et le nom en haut à droite, chez tout le monde. Plus bas, les modules pris : un module décoché disparaît partout.`},{sel:`#homeBody .admNav [data-av="sandbox"]`,titre:`🧪 Bac à sable`,texte:`Un chantier et des personnages de démo pour tester sans rien envoyer au serveur. « Retirer » efface tout d'un coup.`}]},hl=e=>String(e).replace(/ ([:;?!»])/g,`\xA0$1`).replace(/« /g,`«\xA0`);Object.values(ml).forEach(e=>e.forEach(e=>{e.titre=hl(e.titre),e.texte=hl(e.texte)}));var gl=()=>typeof document<`u`?document:null,_l=e=>{try{let t=gl();return!!(t&&t.querySelector(e))}catch{return!0}},vl=(e,t)=>{try{return!!(e&&e.where&&e.where()===t)}catch{return!1}},yl=(e,t)=>!e||!e.can||!!e.can(t),bl=(e,t)=>!!(e&&e.can&&!e.can(t)),xl=(e,t)=>!e||!e.feat||!!e.feat(t),Sl=(e,t,n)=>r=>vl(r,e)?_l(t):!n||!!n(r),I=e=>`#eq-app [data-act="xgo"][data-v="${e}"]`,Cl=e=>yl(e,`planning.edit`)||yl(e,`affaires.edit`)||yl(e,`mag.manage`),wl={"pilotage:plan":`Planning de la semaine`,"pilotage:orga":`Planning des équipes`,"pilotage:obj":`Objectifs des équipes`,"pilotage:agenda":`Ma semaine`,"pilotage:valid":`Pointages à valider`,"pilotage:prodEq":`Production par équipe`,"pilotage:rapport":`Variables de paie`,"pilotage:gd":`Grands déplacements`,"pilotage:cpt":`Compteurs d'heures`,"pilotage:annul":`Demandes d'annulation`,"pilotage:x:mag":`Commandes au dépôt`,"pilotage:x:dem":`Demandes de matériel`,"pilotage:secu":`Sécurité`,"pilotage:qhs":`Quart d'heure sécurité`,"pilotage:controles":`Contrôles chantier`,"pilotage:accident":`Déclarer un accident`,"pilotage:habsEq":`Habilitations de l'équipe`,"affaire:cmd":`Bons de commande`,"affaire:frais":`Notes de frais à valider`,"affaire:comptes":`Comptes chantier`,"affaire:x:cc":`Compte d'un chantier`},Tl={pilotage:[{titre:`Pilotage`,texte:`Le suivi des équipes : planning, objectifs, heures, production, matériel et sécurité. Chaque ligne ouvre une option, avec son tutoriel (« ? » à droite du titre).`},{sel:I(`plan`),titre:`Planning de la semaine`,texte:`Le planning, en un seul écran : cherche quelqu'un par son nom, place-le en 3 touchers, copie la semaine dernière. Chacun voit « Demain : chantier » dans Compagnon.`,si:Sl(`pilotage`,I(`plan`),e=>xl(e,`planning`)&&yl(e,`planning.edit`))},{sel:I(`orga`),titre:`Mon planning et mon équipe`,texte:`Qui est avec toi, quels jours, sur quels chantiers : le planning que ton conducteur a fait.`,si:e=>bl(e,`planning.edit`)&&(vl(e,`pilotage`)?_l(I(`orga`)):xl(e,`planning`))},{sel:I(`obj`),titre:`Objectifs des équipes`,texte:`Par chantier, équipe et jour : une mission et ses heures estimées, posée sur le plan si tu veux. Un repère, pas un plafond.`,si:Sl(`pilotage`,I(`obj`),e=>xl(e,`objectifs`))},{sel:I(`agenda`),titre:`Ma semaine`,texte:`Compose ta semaine (visites, réunions, rendez-vous), reliée à Outlook, et regarde celle de ceux qui dépendent de toi.`,si:Sl(`pilotage`,I(`agenda`))},{sel:I(`valid`),titre:`Pointages à valider`,texte:`Les heures de l'équipe : le chef de chantier valide, puis le conducteur. Une erreur se corrige avec un motif ; les pointages manquants sont signalés.`,si:Sl(`pilotage`,I(`valid`))},{sel:I(`prodEq`),titre:`Production par équipe`,texte:`Les heures et la production de chacun (soudures, manchons), additionnées par équipe et comparées aux objectifs.`,si:Sl(`pilotage`,I(`prodEq`),e=>xl(e,`production`))},{sel:I(`rapport`),titre:`Variables de paie · rapport RH`,texte:`Les heures telles qu'elles partent en paie : définitives, validées chef, à valider, grands déplacements. Export CSV pour la RH.`,si:Sl(`pilotage`,I(`rapport`),e=>yl(e,`pointage.validate`)&&(yl(e,`planning.edit`)||yl(e,`rh.voir`)))},{sel:I(`gd`),titre:`Grands déplacements`,texte:`Le cas 1 à 4 de chacun selon la distance domicile → chantier : nuitées, repas, indemnités. Tu accordes la semaine.`,si:Sl(`pilotage`,I(`gd`),e=>yl(e,`planning.edit`)||yl(e,`rh.voir`))},{sel:I(`cpt`),titre:`Compteurs d'heures`,texte:`Contrat, compteur d'heures sup (plafond, solde) et heures à reporter de chacun ; import du compteur existant.`,si:Sl(`pilotage`,I(`cpt`),e=>yl(e,`rh.voir`)||yl(e,`rh.edit`))},{sel:I(`annul`),titre:`Demandes d'annulation`,texte:`Une soudure à annuler au-delà des crédits de la personne arrive ici : tu tranches dans la conversation du chantier.`,si:Sl(`pilotage`,I(`annul`))},{sel:I(`x:mag:equipe`),titre:`Commandes au dépôt de l'équipe`,texte:`Ce que ton équipe a demandé au magasin, et ce qui est prêt à retirer au dépôt.`,si:Sl(`pilotage`,I(`x:mag:equipe`),e=>xl(e,`magasin`))},{sel:`#eq-app [data-act="x"][data-v="veh|gomouv|"]`,titre:`Véhicules : mouvements`,texte:`Qui a quel véhicule, états des lieux et signatures attendus, contestations : le fil des déclarations.`,si:Sl(`pilotage`,`#eq-app [data-v="veh|gomouv|"]`,e=>xl(e,`parc`)&&yl(e,`flotte.manage`))},{sel:I(`x:dem:file`),titre:`Demandes de matériel`,texte:`Les demandes des équipes pour leurs chantiers : « Commandé », puis « Livré / remis ». Elles suivent l'état sur leur téléphone.`,si:Sl(`pilotage`,I(`x:dem:file`),e=>xl(e,`demandes`)&&Cl(e))},{sel:I(`qhs`),titre:`Quart d'heure sécurité`,texte:`Déclenche un sujet du jour sur un chantier ou sur tous : chacun le fait et le signe sur son téléphone.`,si:Sl(`pilotage`,I(`qhs`),e=>yl(e,`qse.manage`))},{sel:I(`controles`),titre:`Contrôles chantier`,texte:`Qui contrôle, à quelle fréquence, où ça traîne, les NC ouvertes. Objectif : un contrôle par chantier actif toutes les 2 semaines.`,si:Sl(`pilotage`,I(`controles`),e=>yl(e,`qse.manage`))},{sel:I(`accident`),titre:`Déclarer un accident`,texte:`Accident, presque-accident ou soin bénin : qui, où, quand, circonstances, photos. La RH est prévenue.`,si:Sl(`pilotage`,I(`accident`),e=>xl(e,`accident`))},{sel:I(`habsEq`),titre:`Habilitations de l'équipe`,texte:`Les échéances de l'équipe triées par urgence : expirées, à renouveler bientôt, manquantes.`,si:Sl(`pilotage`,I(`habsEq`))}],"pilotage:plan":[{sel:`#eq-app #pi-q`,titre:`🔍 Chercher quelqu'un`,texte:`Tape un nom, un poste ou une agence : seules ses lignes restent, sur les chantiers et dans « À placer ». Les accents ne comptent pas.`},{sel:`#eq-app .eq-wknav`,titre:`Change de semaine`,texte:`Touche ‹ ou ›, ou glisse le bandeau des jours. Sous les boutons : combien sont placés toute la semaine et les jours à pourvoir (en rouge).`},{sel:`#eq-app [data-act="pi"][data-v="open|"]`,titre:`＋ Placer, en 3 touchers`,texte:`1 qui, 2 sur quel chantier, 3 quels jours (ses jours libres sont cochés), l'équipe si tu veux, puis « Placer ». La personne voit « Demain : chantier » dans Compagnon.`},{sel:`#eq-app [data-act="pi"][data-v="copy|"]`,titre:`Copier la semaine dernière`,texte:`Reprend la semaine passée des personnes pas encore placées : mêmes chantiers, mêmes équipes, fériés sautés.`},{sel:`#eq-app [data-act="plnew"], #eq-app #pl-new`,titre:`＋ Nouvelle personne`,texte:`Un intérimaire, une embauche : nom, poste, e-mail. Elle se place tout de suite ; avec son e-mail, son accès est créé.`},{sel:`#eq-app .pi-trayc`,titre:`À placer`,texte:`Ceux qui ont encore des jours libres, filtrés par métier si tu veux. Touche une personne (ou 👥 une équipe), puis le chantier ; sur PC, glisse-la sur la carte.`},{sel:`#eq-app .pi-sites > .pi-site .eq-plfd > summary`,titre:`⚙ La fiche du chantier`,texte:`Sous le nom : secteur, chef, conducteur, horaires et point de rassemblement. Ils servent à l'accueil chantier et aux pointages.`},{sel:`#eq-app .pi-sites > .pi-site [data-act="pi"][data-v^="edit|"], #eq-app .pi-sites > .pi-site [data-act="pi"][data-v^="here|"]`,titre:`Modifier une personne`,texte:`Touche sa ligne sur la carte du chantier : ses jours, son équipe, son secteur, ou « Retirer de ce chantier ». « ＋ Placer quelqu'un ici » part du chantier.`}],"pilotage:orga":[{sel:`#eq-app [data-act="plansem"]`,titre:`Ta semaine`,texte:`« Cette semaine » ou « Semaine prochaine » : ton planning, tel que ton conducteur l'a fait.`,si:e=>bl(e,`planning.edit`)},{sel:`#eq-app .eq-semaine`,titre:`Jour par jour`,texte:`Chaque jour : la météo et ta tenue. Touche un jour pour voir son détail dessous.`,si:e=>bl(e,`planning.edit`)},{sel:`#eq-app .eq-cols.eq-2`,titre:`Ton chantier, ton équipe`,texte:`Le chantier du jour, qui est avec toi, le chef et le conducteur ; à côté, tes chantiers de la semaine.`,si:e=>bl(e,`planning.edit`)},{titre:`Un changement ?`,texte:`Le planning se fait par le conducteur : signale-lui un oubli ou un changement. Ton équipe retrouve le sien dans Compagnon → Planning.`,si:e=>bl(e,`planning.edit`)}],"pilotage:obj":[{sel:`#eq-app .eq-nav`,titre:`Choisis la semaine`,texte:`Semaine passée, cette semaine, semaine prochaine, ou ◀ ▶. Un objectif se prépare à l'avance : la semaine prochaine est souvent la bonne.`},{sel:`#eq-app [data-act="objday"].active, #eq-app [data-act="objday"]`,titre:`Puis le jour`,texte:`Touche un jour : le chiffre à côté compte ses objectifs. Chaque chantier montre l'équipe placée ce jour-là.`},{sel:`#eq-app .eq-objsite`,titre:`Un chantier, ses équipes`,texte:`Les équipes du planning (A, B…) avec leurs personnes, les objectifs déjà posés et les heures estimées face aux heures d'équipe.`},{sel:`#eq-app [data-act="objadd"]`,titre:`➕ Objectif`,texte:`Type, heures estimées, mission, jours (plusieurs jours cochés = la semaine planifiée) et pour qui. Puis « Poser l'objectif ».`},{sel:`#eq-app [data-act="objplan"], #eq-app [data-act="objadd"]`,titre:`📐 Poser sur le plan`,texte:`Touche des soudures une à une, ou la conduite au début puis à la fin du tronçon : l'équipe le voit en surbrillance 🎯 sur son plan.`},{sel:`#eq-app [data-act="objdone"], #eq-app .eq-objrow, #eq-app .eq-objnone`,titre:`Faite ou pas`,texte:`Sur la mission : ✓ faite, ↩ pas faite, ✕ retirer ; 🗺 la montre sur le plan.`},{titre:`Ce que voit l'équipe`,texte:`L'équipe voit l'objectif sur son accueil et en surbrillance 🎯 sur le plan du chantier. Ce n'est pas un plafond : c'est un repère partagé.`}],"pilotage:agenda":[{sel:`#eq-app [data-chg="agWho"]`,titre:`La semaine de ton équipe`,texte:`Choisis quelqu'un qui dépend de toi pour voir sa semaine, en lecture seule.`,si:()=>_l(`#eq-app [data-chg="agWho"]`)},{sel:`#eq-app .eq-wknav`,titre:`Ta semaine`,texte:`‹ › ou glisse pour changer de semaine ; touche un jour pour y aller. Les points comptent tes rendez-vous et tes chantiers.`},{sel:`#eq-app [data-act="aglink"], #eq-app [data-act="agsync"]`,titre:`Relié à Outlook`,texte:`Colle le lien ICS de ton calendrier Outlook publié : ta semaine se remplit toute seule. « ⟳ Synchroniser maintenant » pour forcer.`},{sel:`#eq-app [data-act="agics"]`,titre:`Vers Outlook`,texte:`« ⬇ Exporter la semaine » crée un fichier .ics pour Outlook, Google Agenda ou l'iPhone ; « → Outlook » sur une ligne pour un seul rendez-vous.`},{sel:`#eq-app .eq-agday [data-act="agnew"]`,titre:`＋ Ajouter`,texte:`＋ sur un jour : visite de chantier, réunion, rendez-vous… avec le chantier, les heures et une note. « Ajouter » et c'est dans ta semaine.`},{sel:`#eq-app .eq-agday`,titre:`Tes chantiers du jour`,texte:`Chaque jour rappelle tes chantiers du planning (📍). Sur un rendez-vous lié à un chantier, › ouvre son bureau.`}],"pilotage:valid":[{sel:`#eq-app [data-act="valmode"]`,titre:`Par jour ou par personne`,texte:`« Par jour » : toute l'équipe d'un jour. « Par personne » : la semaine d'une personne, à valider d'un coup.`},{sel:`#eq-app [data-act="valjour"].active, #eq-app [data-act="valpers"].active, #eq-app [data-act="valjour"]`,titre:`Choisis le jour`,texte:`Le chiffre sur un jour : pointages à valider ; en rouge : quelqu'un de placé n'a rien pointé. Le lundi, le vendredi d'avant est proposé.`},{sel:`#eq-app [data-act="toutvalider"]`,titre:`✅ Tout valider`,texte:`Valide d'un coup les journées complètes et cohérentes. Fin manquante, pas de pause, plus de 12 h : ces lignes se traitent à part.`},{sel:`#eq-app .eq-vrow`,titre:`Une journée`,texte:`Début → fin, pause, objectif et production du jour, et l'état. « ⚠ aucune fiche de soudure ce jour-là » : vérifie avant de valider.`},{sel:`#eq-app [data-act="corr"]`,titre:`✏️ Corriger`,texte:`Quoi corriger (début, pause, reprise, fin), l'heure et le motif : la plus probable est proposée. La personne voit « Pointage corrigé » et par qui.`},{sel:`#eq-app [data-act="pi"][data-v^="saisie|"]`,titre:`Pas de pointage`,texte:`Quelqu'un de placé n'a rien pointé : « ✏️ Saisir ses heures » avec un motif. La journée est enregistrée et validée à ton niveau.`,si:()=>_l(`#eq-app [data-act="pi"][data-v^="saisie|"]`)},{titre:`Qui valide quoi`,texte:`Le chef de chantier valide d'abord, puis le conducteur : les heures deviennent définitives pour la paie. La personne suit chaque étape dans Compagnon → Heures.`}],"pilotage:prodEq":[{sel:`#eq-app .eq-wknav`,titre:`Choisis la semaine`,texte:`‹ › ou glisse le bandeau des jours. Les points sous un jour : les personnes placées sur tes chantiers.`},{sel:`#eq-app .pi-pm`,titre:`Semaine ou jour`,texte:`« Semaine » additionne les jours passés ; « Jour » en montre un seul, à choisir dans la rangée.`,si:e=>xl(e,`prod_tableau`)},{sel:`#eq-app [data-act="pi"][data-v="print|"]`,titre:`🖨 Imprimer (A4)`,texte:`Une feuille A4 par chantier et par équipe, avec le détail par personne, à afficher ou à envoyer.`,si:e=>xl(e,`prod_tableau`)},{sel:`#eq-app .pi-scope`,titre:`Chantiers comptés`,texte:`✓ compté, ✗ pas chargé sur cet appareil : ouvre-le une fois (« Ouvrir … »), puis reviens ici pour qu'il compte.`,si:e=>xl(e,`prod_tableau`)},{sel:`#eq-app .pi-tab`,titre:`Le tableau par équipe`,texte:`Par chantier et par équipe : soudures, manchons, ml, heures pointées. La barre compare à l'objectif posé 🎯, sinon à la meilleure équipe.`,si:e=>xl(e,`prod_tableau`)},{sel:`#eq-app .eq-peteam`,titre:`Détail par personne`,texte:`Heures, production et soudures par heure de chacun. Le tuyauteur ne s'additionne pas : c'est la production de son soudeur.`},{titre:`D'où viennent les chiffres`,texte:`Production : les fiches de soudure signées au nom de chacun, le jour où la personne est placée sur le chantier. Heures : les pointages.`}],"pilotage:rapport":[{sel:`#eq-app [data-act="rpweek"]`,titre:`Choisis la semaine`,texte:`S-2, Semaine dernière ou Cette semaine : les heures telles qu'elles partent en paie, rien d'autre.`},{sel:`#eq-app .ac-stats`,titre:`Où en sont les heures`,texte:`Pointées, définitives (conducteur), validées chef en attente, à valider ; en rouge, les jours planifiés sans pointage.`},{sel:`#eq-app table.af-tab`,titre:`Une ligne par personne`,texte:`Jours, heures pointées, définitives, chef, à valider, pauses et cas de grand déplacement (GD) de la semaine.`},{sel:`#eq-app [data-act="rpcsv"][data-v="paie"]`,titre:`⬇ Variables de paie`,texte:`Le fichier CSV jour par jour pour la RH : heures, statut, qui a validé, objectifs, production, grand déplacement.`},{sel:`#eq-app [data-act="rpcsv"][data-v="semaine"]`,titre:`⬇ Rapport de la semaine`,texte:`Le récapitulatif par personne, en CSV, à ouvrir dans Excel.`},{titre:`Avant d'envoyer`,texte:`Tout doit être « définitif » : sinon, relance la validation dans Pointages à valider. Une pause non pointée n'est jamais déduite.`}],"pilotage:gd":[{sel:`#eq-app [data-act="gdmode"]`,titre:`Par semaine ou par personne`,texte:`« 🗓 Par semaine » : toute l'équipe. « 👤 Par personne · mois » : le calendrier d'une personne, nuitées et repas jour par jour.`},{sel:`#eq-app [data-gdaddr] > summary, #eq-app .okbox`,titre:`Les adresses`,texte:`Le cas se calcule depuis l'adresse de chacun. « 📍 Adresses à vérifier » : sans adresse localisée, pas de calcul.`},{sel:`#eq-app .eq-wknav`,titre:`Choisis la semaine`,texte:`‹ › ou glisse le bandeau. Le cycle se lit sur les semaines d'avant du planning.`},{sel:`#eq-app .ac-stats`,titre:`La semaine en chiffres`,texte:`Planifiés, en grand déplacement, nuitées, repas, indemnités de trajet et semaines déjà accordées.`},{sel:`#eq-app [data-act="gdaccall"], #eq-app [data-act="gdacc"], #eq-app [data-act="gdpers"]`,titre:`✓ Accorder`,texte:`Accorder fige la semaine (chantiers, cas, nuitées, repas, indemnités) : c'est l'historique de paie, même si le planning change ensuite.`},{sel:`#eq-app [data-act="gdx"], #eq-app [data-act="gdpers"]`,titre:`Détente et exception`,texte:`La détente tombe seule selon le cycle (cas 3 : une semaine sur 2, cas 4 : une sur 4). 🏠 ou ✗ seulement si la réalité diffère.`},{sel:`#eq-app [data-act="gdpers"]`,titre:`Le mois d'une personne`,texte:`Touche un nom : son mois jour par jour, accordé (vert) ou calculé à accorder (orange). Un jour se corrige à la main.`},{titre:`Les règles`,texte:`Les cas 1 à 4 du livret d'accueil et les tableaux jour par jour sont en bas de l'écran. Le livret déposé ici est aussi dans Compagnon → Heures.`}],"pilotage:cpt":[{sel:`#eq-app .eq-kpis`,titre:`Les compteurs en bref`,texte:`Qui a un compteur, le total d'heures dedans, les compteurs pleins, les heures à reporter et les cas forcés.`},{sel:`#eq-app .cpt-imp > summary`,titre:`⬆ Importer le compteur existant`,texte:`Colle le tableau de ton classeur (ou dépose le fichier), vérifie l'aperçu, importe : les soldes deviennent le point de départ.`,si:e=>yl(e,`rh.edit`)},{sel:`#eq-app .cpt-tab`,titre:`Une ligne par personne`,texte:`Contrat, compteur (solde, plafond et jauge), heures à reporter, déplacement : cas forcé ou selon la distance.`},{sel:`#eq-app .cpt-tab [data-act="fiche"], #eq-app .cpt-tab tr[data-pid]`,titre:`Fiche`,texte:`Au bout de la ligne : contrat, plafond, repos, posé par l'entreprise, prime, replacer, cas forcé. Les RH modifient ; gérant et direction lisent.`},{sel:`#eq-app [data-act="cptxls"]`,titre:`⬇ Tableau Excel`,texte:`Les soldes arrêtés à la fin de la navette du mois, prêts pour la paie.`},{titre:`Comment ça compte`,texte:`Chaque semaine finie, les heures sup entrent majorées jusqu'au plafond ; le surplus est payé sur la navette.`}],"pilotage:annul":[{titre:`Pourquoi ces demandes`,texte:`Chacun annule ses propres erreurs, dans la limite de ses crédits de la semaine. Au-delà, sa demande arrive ici.`},{sel:`#eq-app [data-act="opensite"][data-v$="|conv"], #eq-app .ac-empty`,titre:`Une demande`,texte:`Qui demande, quelle soudure, sur quel chantier et pourquoi. Touche-la : la conversation du chantier s'ouvre.`},{titre:`Tu tranches`,texte:`Dans la conversation : « ✓ Valider » (étape annulée ou soudure retirée), « ＋ Redonner 1 crédit », ou refuser avec un motif. Tout est journalisé.`},{titre:`Sur cet appareil`,texte:`La liste lit les chantiers ouverts sur cet appareil : un chantier jamais ouvert ici n'y apparaît pas.`}],"pilotage:x:mag":[{sel:`#eq-app .mag-kp`,titre:`Les commandes de l'équipe`,texte:`Prêtes au dépôt, en attente, en préparation, reliquats à venir : ce que ton équipe a demandé au magasin.`},{sel:`#eq-app .mag-row, #eq-app .ac-empty`,titre:`Par personne`,texte:`Les demandes en cours de chacun, les plus anciennes d'abord. Touche une demande pour voir ses articles.`},{titre:`Qui fait quoi`,texte:`Lecture seule : le magasin prépare et remet, la personne suit l'état dans Compagnon → Magasin. Toi, tu sais qui doit passer au dépôt.`}],"pilotage:x:dem":[{sel:`#eq-app .dm-kp`,titre:`Ce qui attend`,texte:`À traiter, urgentes, commandées (et en retard), livrées en partie. Les demandes arrivent des téléphones : Compagnon → Mes demandes.`},{sel:`#eq-app [data-xin="dem|fsite"]`,titre:`Un chantier`,texte:`Filtre la liste sur un seul chantier.`,si:()=>_l(`#eq-app [data-xin="dem|fsite"]`)},{sel:`#eq-app .dm-row`,titre:`Ouvrir une demande`,texte:`Qui, quel chantier, les articles et les quantités, la note et les photos. ⚡ urgent : à traiter en premier.`},{sel:`#eq-app [data-act="x"][data-v^="dem|cmd|"], #eq-app .dm-row`,titre:`🛒 Commandé`,texte:`Indique le fournisseur et la livraison prévue ; tu peux préparer un bon de commande pré-rempli (Affaire → Bons de commande).`},{sel:`#eq-app [data-act="x"][data-v^="dem|liv|"], #eq-app .dm-row`,titre:`📦 Livré / remis`,texte:`La date, à qui, et ce qui est remis : en partie si tout n'est pas là, le reste suit. « Refuser » demande un motif.`},{sel:`#eq-app .dm-fold`,titre:`Les demandes finies`,texte:`Livrées, refusées, annulées : rangées en bas, touche pour les revoir.`,si:()=>_l(`#eq-app .dm-fold`)},{titre:`Ce que voit l'équipe`,texte:`Chaque état (commandé, livré, refusé) arrive sur le téléphone de la personne. Aucun stock ici : tu commandes, tu fais livrer.`}],"pilotage:secu":[{sel:`#eq-app .eq-kpis`,titre:`Sécurité`,texte:`Quarts d'heure du jour, contrôles en retard, NC ouvertes, accidents à traiter : ce qui demande ton attention.`},{sel:I(`qhs`),titre:`Quart d'heure sécurité`,texte:`Déclenche un sujet du jour : chacun le fait et le signe sur son téléphone.`,si:Sl(`pilotage:secu`,I(`qhs`),e=>yl(e,`qse.manage`))},{sel:I(`controles`),titre:`Contrôles chantier`,texte:`Qui contrôle, à quelle fréquence, où ça traîne : un contrôle par chantier actif toutes les 2 semaines.`,si:Sl(`pilotage:secu`,I(`controles`),e=>yl(e,`qse.manage`))},{sel:I(`accident`),titre:`Déclarer un accident`,texte:`Accident, presque-accident ou soin bénin, avec photos : la RH est prévenue.`,
