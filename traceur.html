 ne compte pas.`}],"affaire:frais":[{sel:`#eq-app [data-act="cmd"][data-v="tab|db"]`,titre:`Trois volets`,texte:`Bons de commande, Notes de frais, Comptes chantier : touche une puce pour passer de l'un à l'autre.`},{sel:`#eq-app [data-act="cmd"][data-v^="etat|"]`,titre:`Filtre par état`,texte:`Saisi (à valider), Validé, Refusé, Remboursé : le chiffre dit combien.`},{sel:`#eq-app .ac-stats`,titre:`En bref`,texte:`Le total affiché et le nombre de notes à valider.`},{sel:`#eq-app [data-act="cmd"][data-v="dbnew|"]`,titre:`➕ Note de frais`,texte:`Pour saisir une dépense toi-même : date, montant TTC, nature, chantier, moyen de paiement, ticket en photo.`},{sel:`#eq-app [data-act="cmd"][data-v^="dbok|"], #eq-app .eq-list .eq-row`,titre:`Valider ou refuser`,texte:`Regarde le ticket en vignette (photo ou PDF), puis ✓ valider ou ✕ refuser. « sans ticket » en orange : demande-le.`},{sel:`#eq-app [data-act="cmd"][data-v^="dbremb|"], #eq-app .eq-list .eq-row`,titre:`Remboursé`,texte:`Une fois la note payée, touche « remboursé » : la personne le voit dans Compagnon → Notes de frais.`},{titre:`D'où elles viennent`,texte:`Chacun saisit ses notes dans Compagnon, ticket pris en photo. Validées, elles entrent dans le compte du chantier, en HT.`}],"affaire:comptes":[{sel:`#eq-app [data-act="cmd"][data-v="tab|comptes"]`,titre:`Trois volets`,texte:`Bons de commande, Notes de frais, Comptes chantier : touche une puce pour passer de l'un à l'autre.`},{sel:`#eq-app .ac-stats`,titre:`Le total`,texte:`Chiffré, facturé, heures pointées (et leur coût), dépenses, résultat indicatif : tous les chantiers ensemble.`},{sel:`#eq-app table.af-tab`,titre:`Une ligne par chantier`,texte:`Affaire liée, chiffré, facturé (et %), soudures, heures, main-d'œuvre, dépenses, résultat : en rouge s'il est négatif.`},{titre:`D'où viennent les chiffres`,texte:`Chiffré : le marché de l'affaire liée ; facturé : les situations ; heures × taux chargé ; dépenses : notes validées et bons hors brouillon.`},{titre:`Un résultat indicatif`,texte:`Un repère, pas la compta : le compte réel se fait sur la paie et les factures. Le détail d'un chantier : Compte d'un chantier.`}],"affaire:x:cc":[{sel:`#eq-app .cc-q, #eq-app [data-act="x"][data-v="cc|choix|"]`,titre:`Choisis le chantier`,texte:`Cherche par nom ou par ville. Tes chantiers et ceux qui ont des chiffres d'abord ; les autres sont repliés dessous.`},{sel:`#cc-list .ac-row, #eq-app [data-act="x"][data-v="cc|autres|"], #eq-app .cc-card`,titre:`Ouvrir un compte`,texte:`Touche un chantier : sa ligne résume les jours pointés, les bons et les notes de frais.`},{sel:`#eq-app .cc-per, #cc-list .ac-row`,titre:`La période`,texte:`Dans le compte : « Tout » ou « Un mois » avec ‹ ›. Les heures sont rangées au mois du jour pointé.`},{sel:`#eq-app .cc-tiles, #cc-list .ac-row`,titre:`Les totaux`,texte:`Dans le compte : total HT, main-d'œuvre (heures × coût horaire du poste), bons de commande engagés, dépenses.`},{titre:`Le détail`,texte:`Puis les heures par poste (⚠ si un coût horaire manque), les bons de commande, les notes de frais validées, la sous-traitance et la location, les totaux par nature.`},{sel:`#eq-app [data-act="x"][data-v^="cc|print|"], #cc-list .ac-row`,titre:`🖨 Imprimer (A4)`,texte:`En haut du compte : le compte en A4. Rien ne se modifie ici : bons, notes de frais et dépenses se corrigent à leur place.`},{titre:`Aussi dans le chantier`,texte:`Le même compte s'ouvre depuis le chantier : onglet Bureau → 💶 Compte chantier.`}]},El=(e,t)=>!e||!e.can||e.can(t),Dl=(e,t)=>!e||!e.feat||e.feat(t),Ol=(e,t)=>!!e&&!!e.can&&!e.can(t),kl=`#homeBody .af-segs`,Al=`#homeBody .eq-filtres:has([data-v="tab|fiche"]), #homeBody .af-head + .eq-filtres`,jl=`#homeBody .eq-filtres:has([data-v="mag|mseg|dem"])`,Ml=e=>`#homeBody [data-act="af"][data-v="${e}"]`,Nl=e=>`#homeBody [data-act="fl"][data-v="${e}"]`,Pl=e=>`#homeBody [data-act="x"][data-v="mag|mseg|${e}"]`,Fl={"commerce:aff":`Une affaire ouverte`,"flotte:x:veh":`États des lieux`,"magasin:materiel":`Matériel`},Il={commerce:[{titre:`Commerce`,texte:`L'écran Affaires : de la consultation à l'offre, puis le suivi des affaires gagnées. Pour les chargés d'affaires, la direction et le bureau.`},{sel:Ml(`seg|rep`)+`, #homeBody .af-segs`,titre:`📊 Reporting`,texte:`Toutes les affaires d'un coup d'œil : CA mensuel par secteur, gagné, facturé, restant à facturer, débours, et « ⬇ Export CSV » pour Excel.`},{sel:Ml(`seg|devis`)+`, #homeBody .af-segs`,titre:`📝 Devis & chiffrage`,texte:`Les affaires à l'étude, en préconsultation ou en devis : DCE, chiffrage en versions, mémoire, offre remise.`},{sel:kl,titre:`🏗 Dossiers en cours`,texte:`Les affaires gagnées, à débuter ou en cours : facturation, situations, débours ; au téléphone, glisse la barre des rubriques pour la voir.`},{sel:kl,titre:`✓ Terminés · perdus`,texte:`Les dossiers clos : le chiffrage, le facturé et les documents restent consultables.`},{sel:kl,titre:`⚙ Base de prix SCR`,texte:`Taux, équipes, cadences, fournitures, contrôles CND, paniers : la base commune qui alimente chaque nouveau chiffrage.`},{sel:Ml(`new|`),titre:`➕ Affaire`,texte:`Crée une affaire : numéro proposé (lettre du secteur, année-mois, rang), nom, client, état, puis « Créer l'affaire » pour l'ouvrir.`,si:e=>El(e,`affaires.edit`)},{sel:`#homeBody .af-row, #homeBody [data-afin="q"]`,titre:`Ouvrir une affaire`,texte:`Cherche par numéro, client ou ville et touche l'affaire pour l'ouvrir ; son guide pas à pas est dans 📚 Tous les tutoriels.`}],"commerce:aff":[{sel:`#homeBody .af-head`,titre:`L'affaire en un coup d'œil`,texte:`Numéro, état en couleur, client ; montant du devis, facturé et restant à facturer. Dessous, les onglets suivent le dossier : au téléphone, fais-les glisser.`},{sel:`#homeBody [data-afin="etat"], `+Ml(`tab|fiche`),titre:`Fiche : l'état de l'affaire`,texte:`Préconsultation → devis → à débuter → en cours → terminé, ou perdu. Chaque champ s'enregistre quand tu le quittes, même hors connexion (envoyé ensuite).`},{sel:Ml(`tab|dossier`)+`, #homeBody .eq-filtres:has([data-v="tab|fiche"]), #homeBody .af-head + .eq-filtres`,titre:`1 · Dossier et 2 · Lecture`,texte:`Dossier : dates de la consultation, tâches, pièces du DCE. Lecture : surligne un passage, il devient une note pour le chiffrage, le mémoire ou une question.`},{sel:Al,titre:`3 · Quantités et 4 · Chiffrage`,texte:`Le tracé ou une étude fournisseur, puis « → Préremplir le chiffrage ». « ＋ Nouvelle version » fige la précédente, consultable en lecture seule.`},{sel:Al,titre:`5 · Mémoire et 6 · DPGF`,texte:`Mémoire : « Créer le plan type SCR », puis les blocs SCR déjà validés. DPGF : importe celle du maître d'œuvre et traduis-y ton chiffrage, ligne à ligne.`},{sel:Al,titre:`7 · Offre`,texte:`Coche les pièces à remettre, « 📦 Dossier de remise (.zip) », puis « 📤 Marquer l'offre remise ». Aujourd'hui te rappelle la remise à J-3, J-1 et le jour J.`},{sel:Al,titre:`Facturation et 💶 Débours`,texte:`Ils apparaissent quand l'affaire est gagnée : « ➕ Situation / facture » mois par mois, puis heures, achats et frais. Facturé − débours = marge.`},{sel:Al,titre:`Tracé & chantiers`,texte:`« ✎ Dessiner le projet (traceur) », puis « Lier » l'affaire à ses chantiers : leurs heures et leurs achats remontent dans les débours.`}],flotte:[{titre:`Flotte`,texte:`Le parc véhicules de SCR : qui conduit quoi, contrôles techniques, vidanges, états des lieux. Pour le responsable flotte, la direction et le bureau.`},{sel:Nl(`vue|list`),titre:`🚐 Véhicules`,texte:`Le parc, alertes en couleur (rouge bloquant, orange à surveiller) ; touche un véhicule pour sa fiche : CT, vidange, contrôles, signalements.`},{sel:Nl(`alert|`),titre:`⚠ alertes`,texte:`Ne garde que les véhicules à traiter ; filtre aussi par agence ou par type, ou cherche une immatriculation.`},{sel:Nl(`vue|agenda`),titre:`📅 Échéances & interventions`,texte:`CT, vidanges, contrats et restitutions à venir, les retards d'abord, avec les interventions programmées depuis les fiches.`},{sel:Nl(`vue|mouv`),titre:`↔ Mouvements`,texte:`Remises, véhicules laissés, changements de conducteur : ce qui attend une signature ou une décision, et les mouvements contestés.`},{sel:Nl(`vue|qui`),titre:`🧑 Qui a quoi`,texte:`Chaque véhicule et son conducteur aujourd'hui, à imprimer en A4.`},{sel:Nl(`vue|hist`),titre:`🕓 Historique`,texte:`Qui avait quel véhicule à une date donnée, par véhicule ou par personne.`},{sel:Nl(`new|`),titre:`➕ Véhicule`,texte:`Ajoute un véhicule par son immatriculation, puis remplis sa fiche : type, contrôle technique, kilométrage, conducteur.`,si:e=>El(e,`flotte.manage`)},{sel:`#homeBody .fl-row, #homeBody [data-v^="veh|recep|"]`,titre:`États des lieux`,texte:`Remettre un véhicule, le reprendre ou le laisser à un collègue : depuis sa fiche, un état des lieux guidé, signé sur le téléphone.`},{sel:`#homeBody [data-act="parcseg"][data-v="magasin"]`,titre:`📦 Magasin`,texte:`Les fiches type du matériel par poste, en lecture ; tes demandes au dépôt se font dans Compagnon → Magasin.`,si:e=>Ol(e,`mag.manage`)&&Dl(e,`magasin`)}],"flotte:x:veh":[{titre:`États des lieux du véhicule`,texte:`Remise, restitution, véhicule laissé à un collègue : un état des lieux guidé, signé sur le téléphone, rangé dans la fiche. Ses points viennent du pack véhicules de SCR.`},{sel:`#homeBody .veh-wiz .veh-h`,titre:`Une étape à la fois`,texte:`En haut, l'étape (1/10…) et la barre qui avance. Remise : conducteur, permis, kilométrage, points d'état, photos, inventaire, cartes, charte, signatures.`},{sel:`#homeBody [data-v="veh|qui|avec"]`,titre:`Le responsable et moi`,texte:`Le responsable est à côté du conducteur : il vérifie avec lui et signe à la fin, sur ce téléphone.`},{sel:`#homeBody [data-v="veh|qui|seul"]`,titre:`Je suis seul`,texte:`Personne sur place : le conducteur fait tout l'état des lieux et signe, puis un responsable relit les photos et les écarts, et valide.`},{titre:`Relevés, photos, inventaire`,texte:`Ok ou Non ok en gros boutons, photos imposées une à une, un impact avec sa zone. À l'inventaire du métier, un manque devient un écart.`},{titre:`Charte et signatures`,texte:`Le conducteur lit la charte jusqu'en bas et la signe au doigt dans le cadre. Au récapitulatif, chacun signe dans son cadre.`},{sel:`#veh-next`,titre:`Continuer ›`,texte:`S'il manque quelque chose, l'appli te dit quoi. Sans réseau, tout reste sur le téléphone ; « ▶ Reprendre » sur la fiche repart de la même étape.`},{titre:`Après l'enregistrement`,texte:`Remis : le véhicule passe au nom du conducteur, qui le retrouve dans Compagnon. Rendu : l'appli compare, et les différences vont au responsable flotte.`}],magasin:[{titre:`Magasin`,texte:`Le dépôt de SCR : les demandes des équipes arrivent ici, tu prépares, tu remets, le stock se tient tout seul. Pour le référent magasin.`},{sel:Pl(`dem`)+`, #homeBody .eq-filtres:has([data-v="mag|mseg|dem"])`,titre:`📋 Demandes`,texte:`La file : à préparer (⚡ urgentes en tête), en préparation, prêtes à remettre, reliquats ; elles arrivent des téléphones, par Compagnon → Magasin.`},{sel:`#homeBody [data-v^="mag|mopen|"], #homeBody .mag-kp`,titre:`Préparer`,texte:`Touche une demande, « ▶ Commencer la préparation », mets les quantités, puis « ✓ Prête » (ou « ✓ Déclarer prête cette partie » s'il manque un article).`},{sel:`#homeBody [data-v^="mag|mopen|"], #homeBody .mag-kp`,titre:`Remettre`,texte:`« Qui retire ? », puis « 📤 Remis — enregistrer les sorties » : le stock se met à jour tout seul, et le demandeur suit chaque état sur son téléphone.`},{sel:Pl(`fiches`)+`, #homeBody .eq-filtres:has([data-v="mag|mseg|dem"])`,titre:`🧰 Fiches type`,texte:`Le matériel nécessaire par poste : à retoucher, à imprimer, ou pour équiper un véhicule avec une demande pré-remplie.`},{sel:Pl(`stock`)+`, #homeBody .eq-filtres:has([data-v="mag|mseg|dem"])`,titre:`📦 Stock`,texte:`Le stock du dépôt, article par article ; touche un article pour une réception fournisseur, un inventaire, le tampon, l'emplacement ou le prix.`},{sel:jl,titre:`🛒 À commander`,texte:`Ce qui passe sous le tampon (tampon − stock), trié par fournisseur, avec les reliquats ; au téléphone, glisse les rubriques pour la voir.`},{sel:jl,titre:`↕ Mouvements`,texte:`Le journal des entrées et sorties ; « ＋ Entrée de stock » ou « − Sortie de stock » pour plusieurs articles d'un coup, sur un bon imprimable.`},{sel:jl,titre:`⚙ Catalogue`,texte:`Le pack magasin (catalogue, listes par métier, dotations camion) ; « ⬆ Importer le pack (.json) » le met à jour sans toucher au stock.`},{sel:`#homeBody [data-act="parcseg"][data-v="materiel"]`,titre:`🔧 Matériel`,texte:`Postes à souder, groupes, outillage, engins : la rubrique se prépare, son guide dit où trouver le reste en attendant.`}],"magasin:materiel":[{sel:`#homeBody h2.vt`,titre:`🔧 Matériel`,texte:`Ici viendra le matériel du dépôt : postes à souder, groupes, outillage, engins, avec leur affectation, leurs contrôles, leur entretien et leurs pannes.`},{titre:`En attendant`,texte:`Le stock d'un chantier (livraisons, prélèvements) est dans le chantier, Technique → Stock. Le consommable du dépôt est dans 📦 Magasin.`},{sel:`#homeBody [data-act="parcseg"][data-v="magasin"]`,titre:`Retour au dépôt`,texte:`Touche 📦 Magasin pour retrouver les demandes, le stock et les commandes.`}]},Ll={reglages:`Tracé · Réglages`,concepteur:`Tracé Concepteur`,accueil:`Tracé`,chantiers:`Tracé Chantier`,chantier:`Tracé Chantier`,pilotage:`Tracé Pilotage`,compagnon:`Tracé Compagnon`,commerce:`Tracé Commerce`,affaire:`Tracé Affaire`,flotte:`Tracé Flotte`,magasin:`Tracé Magasin`,equipe:`Tracé Équipe`},Rl={accueil:[{titre:`Bienvenue dans Tracé`,texte:`L'appli de SCR pour tes chantiers : soudures, pointage, documents. Trente secondes pour faire le tour.`},{sel:`#tbHomeMod`,titre:`Tracé + le module`,texte:`En haut, le nom du module où tu es. Touche-le pour passer d'un module à l'autre.`},{sel:`#homeTabs`,titre:`Un onglet = un module`,texte:`Chantier, Compagnon, Pilotage… Tu ne vois que ce qui te sert.`},{sel:`#homeBody`,titre:`Aujourd'hui`,texte:`Ce qui t'attend aujourd'hui : ton pointage, tes chantiers, tes documents à signer.`},{sel:`#tbHomeHelp`,titre:`Revoir un guide`,texte:`Touche ❓ pour revoir le guide du module où tu es.`}],chantiers:[{sel:`#homeSubTabs`,titre:`Tes chantiers`,texte:`Sur la carte ou en liste. Sécurité : accidents, quarts d'heure, contrôles (encadrement).`},{sel:`#homeBody`,titre:`Ouvrir un chantier`,texte:`Touche un chantier pour ouvrir son plan.`}],chantier:[{sel:`#siteSel`,titre:`Le chantier ouvert`,texte:`Son nom ici. Touche ▾ pour changer de chantier, ⌂ pour revenir à l'accueil.`},{sel:`#svg, #view-plan`,titre:`Le plan`,texte:`Touche une soudure (un rond) : sa fiche s'ouvre — statut, photo, numéro. Deux doigts pour zoomer.`},{sel:`#legend, .legend`,titre:`Les couleurs`,texte:`Gris à souder, orange soudée, bleu contrôlée, vert manchonnée, rouge à reprendre.`},{sel:`.siteHead .seg, .siteHead [data-facet], #facets`,titre:`Plan · Vie du chantier · Technique`,texte:`Le plan ; la vie du chantier (sécurité, conversation, dossier) ; la technique (DH, hydro, stock…).`},{sel:`#planFab`,titre:`＋ Poser`,texte:`Une photo, une note, un point sur le plan : touche ＋.`},{sel:`.pxw-b, [data-pxlist]`,titre:`📄 Mes plans`,texte:`Les plans d'exé, ceux de ta zone en premier. Depuis la fiche d'une soudure, la bonne planche s'ouvre directement.`,si:e=>!e||!e.feat||e.feat(`plansexe`)},{sel:`#shDoss`,titre:`Le Dossier du chantier`,texte:`Les pièces obligatoires (DICT, PPSPS, plans d'exé…) : ce qui manque est en rouge. Touche pour ouvrir le Dossier et le Drive du chantier.`,si:e=>!e||!e.can||e.can(`dossier.edit`)},{titre:`Les modifs`,texte:`Par défaut, tout est compris dans le marché. Pour ressortir un changement de DN, des ml, des soudures ou des pièces (TS) : onglet Modifications → « ＋ Déclarer une modif », puis pointe-la sur le plan.`,si:e=>!e||(!e.feat||e.feat(`modifs`))&&(!e.can||e.can(`ts.qualify`))},{sel:`#btnSearch`,titre:`Chercher`,texte:`Retrouve une soudure par son numéro.`},{sel:`#btnMenu`,titre:`Le menu ☰`,tex     <span id="bgTools" style="display:none;align-items:center;gap:6px">
      <button class="btn sm" id="bgScale" title="plan actif : clique deux points du plan dont tu connais la distance, puis entre-la">📏 Échelle</button>
      <button class="btn sm" id="bgEch" title="échelle d'un plan PDF ou image : 1/N (taille réelle de la page, ou dpi de l'image)">1/N</button>
      <button class="btn sm" id="bgMove" title="plan actif : glisse-le pour le déplacer">✥ Déplacer</button>
      <button class="btn sm" id="bgCal2" title="plan actif : 2 points sur le plan, puis les 2 mêmes endroits sur le tracé déjà calé → échelle, rotation et position d'un coup">⟲ 2 points</button>
      <label class="muted" style="font-size:11.5px">opacité <input type="range" id="bgOp" min="10" max="100" value="50" style="width:70px;vertical-align:middle"></label>
      <label class="muted" style="font-size:11.5px"><input type="checkbox" id="bgShow" checked> afficher</label>
      <button class="btn sm" id="bgLayers" title="options du plan DXF actif : calques du réseau, étendue, détail">⚙</button>
      <button class="btn sm" id="bgInfo" title="rapport de fidélité du plan DXF actif : ce qui est dessiné, ce qui manque (images externes, objets propriétaires…)">ⓘ</button>
      <button class="btn sm" id="bgFit" title="cadrer tous les plans de fond (et le réseau)">⤢ Tout voir</button>
      <button class="btn sm" id="bgClear" title="retirer le plan actif">✕</button>
    </span>
    <button class="btn" id="bClear">Tout effacer</button>
    <span class="sep"></span>
    <button class="btn on" id="bSave" title="remet le réseau à l'appli Tracé (chantier, soudures numérotées) et l'envoie au serveur si tu es connecté">💾 Enregistrer dans Tracé</button>
    <button class="btn" id="bOpenApp" title="ouvre l'appli">↗ Tracé</button>
    <button class="btn" id="bTuto" title="revoir le guide du traceur" aria-label="revoir le guide du traceur" style="min-width:36px;font-weight:700;color:#5E46B8">?</button>
    
    <button class="btn sm" id="bExport" title="fichier JSON de secours">⤓ JSON</button>
    <label class="btn sm">⤒ JSON<input type="file" id="impFile" accept=".json" style="display:none"></label>
  </header>
  <main id="main">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="bg"></g><g id="grid"></g><g id="net"></g><g id="draft"></g></g></svg>
    <div class="hint" id="hint" style="display:none"></div>
    <button class="btn" id="offscreen" style="display:none;position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.25)">↩ Réseau hors écran — revenir</button>
    <div class="zoominfo" id="zoominfo">1 m ≈ 10 px</div>
    <div class="disp" id="disp"></div>
    <div class="zoomctl"><button id="zEye" title="choisir ce qui s'affiche (étiquettes, n°, manchons, fond…)">👁</button><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="tout voir">⌂</button></div>
    <div class="legend"><span><i style="background:#c8382f"></i>aller</span><span><i style="background:#2a5fb4"></i>retour</span><span>○ soudure</span><span><i style="background:#f0c76a"></i>sélection</span><span><i style="background:#d03b3b"></i>règle violée</span><span style="color:#b8560f">FC = fausse coupe (tubes coupés en biais)</span><span class="muted">molette : zoom · glisser : déplacer (à la souris, glisser dans le vide = rectangle de sélection) · Maj : angles par 15° · 👁 : choisir ce qui s'affiche</span></div>
  </main>
  <aside>
    <div class="tabs"><button data-tab="sel" class="on">Sélection</button><button data-tab="lignes">Lignes</button><button data-tab="soud">Soudures</button><button data-tab="nomen">Nomenclature</button><button data-tab="notes">Notes</button><button data-tab="fond" title="plans de fond : liste, calage de chaque plan">Fond</button><button data-tab="regles">Règles</button></div>
    <div class="panel" id="panel"></div>
  </aside>
  <footer id="foot"></footer>
</div>
<div class="modal" id="modal"><div id="modalBody"></div></div>
</body>
</html>
