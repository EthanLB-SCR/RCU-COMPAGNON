,{sel:`#homeBody .siteCard, #homeMap .hmPin, #homeBody .siteRecap`,titre:`Ouvrir un chantier`,texte:`Chaque carte montre l'avancement (% soudé) et la dernière mise à jour : touche-la pour ouvrir le chantier. 🔒 : pas dans ton planning, vois avec ton conducteur.`},{sel:`#homeBody .siteRecaps`,titre:`Mes chantiers`,texte:`Sous la carte, tes chantiers avec leur récap : présents du jour, ✓ en règle, ✗ ce qui bloque. Touche-en un pour arriver directement dans son Bureau.`,si:e=>Fc(e,`planning.edit`,`pointage.validate`,`qse.manage`)},{sel:`#homeBody [data-nc-new]`,titre:`＋ Nouveau chantier`,texte:`Crée la fiche d'un chantier (nom, ville, client, chef, conducteur…) sans passer par Commerce. Le tracé viendra ensuite : plan DXF ou traceur.`,si:e=>Fc(e,`site.tracer`)},{sel:`#homeResume`,titre:`↩ Reprendre`,texte:`En bas de l'écran : le dernier chantier ouvert, à rouvrir d'un seul toucher.`}],chantier:[{sel:`#shName`,titre:`Bienvenue dans Tracé Chantier`,texte:`Le chantier ouvert et, juste dessous, son avancement. Ici, toute l'équipe, du terrain au bureau, trouve le plan, la vie du chantier (sécurité, conversation, dossier) et la technique.`},{sel:`#tbSiteMod`,titre:`Le bandeau : Tracé Chantier ▾`,texte:`Le module où tu es. Touche-le pour passer à un autre module, revoir le tutoriel de l'écran ou ouvrir 📚 Tous les tutoriels.`},{sel:`#siteSel`,titre:`2e ligne : le chantier ouvert`,texte:`Touche son nom pour changer de chantier, ⌂ pour revenir à tes chantiers. À droite : ? relance le tutoriel de l'onglet, 🔍 cherche une soudure, ☰ ouvre le menu.`},{sel:`#facets`,titre:`Plan · Vie du chantier · Technique`,texte:`Les onglets sont rangés en trois familles. Touche une famille : ses onglets s'affichent dans la barre du bas (glisse-la s'il y en a d'autres).`},{sel:`#facets [data-facet="plan"]`,titre:`📐 Plan d'ensemble`,texte:`Le réseau et toutes ses soudures, en plein écran. Touche une soudure pour ouvrir sa fiche, ＋ pour poser une note, une photo ou une soudure faite sur place.`},{sel:Vc(`bureau`,zc),titre:`🏢 Bureau`,texte:`Le tableau de bord du chantier : ce qui t'attend aujourd'hui, ce qui coince, et un raccourci vers chaque onglet.`},{sel:Vc(`conv`,zc),titre:`💬 Conversation`,texte:`Messages, notes posées sur le plan avec photo, tâches à faire : tout ce qui se dit sur le chantier, daté et signé.`,si:Rc(`conv`)},{sel:Vc(`admin`,zc),titre:`🗂 Dossier`,texte:`Les pièces obligatoires (DT / DICT, PPSPS, PGC, plans d'exé…) et le Drive du chantier. Le chef et le bureau déposent, toute l'équipe consulte.`,si:Rc(`admin`)},{sel:Vc(`qse`,zc),titre:`⛑️ QSE`,texte:`Ton accueil chantier, le quart d'heure sécurité, les documents à émarger et la déclaration d'un accident.`,si:Rc(`qse`)},{sel:Vc(`export`,zc),titre:`📷 DOE et exports`,texte:`Carnet de soudage, plan des soudures numérotées, photos par soudure, plan interactif : le dossier DOE se fabrique ici.`,si:Rc(`export`)},{sel:Vc(`bouclage`,Bc),titre:`💧 Détection d'humidité`,texte:`Les mesures des fils d'alarme, boucle par boucle : contrôler le réseau, localiser un défaut, poser un bouclage temporaire.`,si:Rc(`bouclage`)},{sel:Vc(`hydro`,Bc),titre:`🌊 Hydraulique`,texte:`Les essais du réseau (épreuve, rinçage) : tronçons d'essai, point d'eau, remplissage, calendrier et procès-verbaux.`,si:Rc(`hydro`)},{sel:Vc(`stock`,Bc),titre:`🚚 Stockage`,texte:`Les livraisons (camions) et les zones de stock du chantier : ce qui est arrivé, où c'est rangé, ce qui en a été pris.`,si:Rc(`stock`)},{sel:Vc(`fourniture`,Bc),titre:`🧾 Fournitures`,texte:`Le besoin en pièces calculé sur le tracé, les commandes fournisseur, ce qui est livré et ce qui reste à livrer.`,si:Rc(`fourniture`)},{sel:Vc(`phasage`,Bc),titre:`📅 Phasage`,texte:`Le chantier découpé en phases, prises sur le plan et datées : le planning d'exécution, pour suivre l'avance ou le retard.`,si:Rc(`phasage`)},{sel:Vc(`ts`,Bc),titre:`✍️ Modifications`,texte:`Le marché comparé au réel : par défaut, tout est compris. « ＋ Déclarer une modif » ressort un changement (TS, pour mémoire), pointé sur le plan.`,si:Rc(`ts`)},{sel:Vc(`points`,Bc),titre:`📍 Points de contrôle`,texte:`Vannes, purges, vidanges, sous-stations, raccordements : leur état (ouvert, fermé) et leurs photos, datés.`,si:Rc(`points`)},{sel:Hc,titre:`📊 Récapitulatif`,texte:`Dans « ⋯ Plus » : les totaux par DN et par ligne, la liste des pièces, les manchons à poser et l'export pour Excel.`},{sel:Hc,titre:`🎖 Liste des soudures`,texte:`Dans « ⋯ Plus » : toutes les soudures, ligne par ligne, avec leur statut. Touche-en une pour la retrouver sur le plan.`},{sel:Hc,titre:`📦 Catalogue des pièces`,texte:`Dans « ⋯ Plus » : les dimensions des pièces de chaque fournisseur, celles qui servent à dessiner le plan.`,si:Rc(`catalogue`)}],"chantier:plan":[{sel:`#svg`,titre:`Le plan d'ensemble`,texte:`Glisse un doigt pour te déplacer, pince à deux doigts pour zoomer. Touche une soudure (un rond) : sa fiche s'ouvre.`},{sel:`#legend`,titre:`Les couleurs des soudures`,texte:`Gris : à souder · orange : soudée · bleu : contrôlée · vert : manchonnée · rouge : à reprendre. Trait rouge = aller, trait bleu = retour.`},{titre:`La fiche d'une soudure`,texte:`En haut : n°, statut, DN, aller ou retour, PK. « Faire l'étape … » ouvre la tienne : 1 Soudure (soudeur), puis 2 Fils raccordés, 3 Manchon posé, 4 Moussage (manchonneur).`},{titre:`Photo, puis « Valider l'étape »`,texte:`📷 Photo du cordon (obligatoire pour la soudure), puis « Valider l'étape » : ton nom et la date restent sur la fiche. Sans réseau, c'est gardé et envoyé au retour du réseau.`},{sel:`#planFab`,titre:`＋ Poser sur le plan`,texte:`Une note avec photo, une soudure faite sur place, une modif… : choisis, puis touche l'endroit sur le plan. Une barre en haut t'explique chaque étape.`,si:e=>Fc(e,`phasage.edit`,`stock.edit`,`conv.post`,`site.tracer`)},{sel:`.zoomctl [data-z="eye"]`,titre:`👁 Ce qui s'affiche`,texte:`Les calques : DN, longueurs, n° de soudure, fils, notes, points… « Épuré » allège le plan, « Par défaut » remet tout. 📅 juste dessous : qui a fait quoi, et quand.`},{sel:`#btnSearch`,titre:`🔍 Retrouver une soudure`,texte:`Tape son n° (ex. 24) puis Entrée : le plan se centre dessus et sa fiche s'ouvre. Le même menu ☰ filtre le plan : « Pour moi », « À souder »…`},{sel:`#pxPlanBtn`,titre:`📄 Mes plans`,texte:`Les plans d'exé du chantier, ceux de ta zone en premier. Depuis la fiche d'une soudure, « 📄 Plan d'exé » ouvre directement la bonne planche.`,si:e=>Pc(e,`plansexe`)}],"chantier:bureau":[{sel:`#bureau .ac-bhero`,titre:`Aujourd'hui sur ce chantier`,texte:`Le % soudé, le chef et le conducteur, la météo et qui est placé aujourd'hui (planning). La première chose à regarder en arrivant.`},{sel:`#bureau .okbox, #bureau .ac-notif`,titre:`Ce qui t'attend ici`,texte:`Ton accueil chantier, un quart d'heure sécurité, des documents à émarger, tes tâches : touche une ligne pour t'en occuper. Bandeau vert : rien ne t'attend.`},{sel:`#bureau .ac-notif.warn, #bureau .ac-kt.bad, #bureau .ac-kt.warn`,titre:`Ce qui coince`,texte:`Pour l'encadrement : les points bloquants (✗) et à surveiller (!) du chantier. Touche une ligne pour ouvrir l'onglet concerné.`,si:Ic},{sel:`#bureau .ac-kt.ok, #bureau .ac-kt.warn, #bureau .ac-kt.bad, #bureau .ac-kt.off`,titre:`La checklist du chantier`,texte:`Une case par sujet : ✓ complet, ! manque, ✗ bloquant, ○ pas commencé. 👥 Équipe et ⏱ Pointages ouvrent Pilotage.`,si:Ic},{sel:`#bureau .dx-stat`,titre:`🗂 Pièces du dossier`,texte:`Les pièces obligatoires en règle (ex. 5/8). Touche le compteur pour compléter le Dossier du chantier.`,si:e=>Pc(e,`dossier`)&&Fc(e,`dossier.edit`)},{sel:`#bureau .ac-kt:not(.ok):not(.warn):not(.bad):not(.off)`,titre:`Le chantier : raccourcis`,texte:`Une case par onglet auquel tu as accès : touche-la pour y aller directement, sans passer par la barre du bas.`},{sel:`#bureau [data-bur="__compte"]`,titre:`💶 Compte chantier`,texte:`Bons de commande, dépenses et heures par poste de ce chantier, en lecture seule et imprimable. Pas de compta.`,si:e=>Pc(e,`comptechantier`)&&(Fc(e,`planning.edit`)||Fc(e,`affaires.edit`)&&Fc(e,`pointage.validate`,`qse.manage`))},{sel:`#bureau [data-nc-fiche]`,titre:`✎ Fiche du chantier`,texte:`Ville, client, date de début, fournisseur, note : touche « ✎ Fiche » pour compléter la fiche du chantier.`,si:e=>Fc(e,`site.tracer`,`planning.edit`)}],"chantier:conv":[{sel:`#cvList`,titre:`Le fil du chantier`,texte:`Messages, notes posées sur le plan, tâches : tout reste ici, daté et signé. Le 📍 d'une note la montre sur le plan.`},{sel:`#convview .cvFilters`,titre:`Retrouver un message`,texte:`Filtre : 💬 Messages, 📍 Sur le plan, ☐ À faire, 👤 Mes tâches, ✓ Faites. 📅 Période et Type valent aussi pour les pastilles du plan.`},{sel:`#convview .cvCats`,titre:`Le type du message`,texte:`Choisis d'abord le type (🚧 Balisage, ⛏️ Tranchée, 🦺 Sécurité…) : son icône apparaît sur le plan et sert de filtre.`,si:e=>Fc(e,`conv.post`)},{sel:`#cvPose`,titre:`📍 Sur le plan, 📷 en photo`,texte:`« 📍 Placer sur le plan », puis touche l'endroit : la note y apparaît en pastille. « 📷 Photo » ajoute une ou plusieurs photos.`,si:e=>Fc(e,`conv.post`)},{sel:`#convview label.pill`,titre:`☐ Tâche à faire`,texte:`Coche « Tâche à faire » et choisis pour qui. La personne la voit dans « 👤 Mes tâches » et la déclare faite, photo à l'appui.`,si:e=>Fc(e,`conv.task`)},{sel:`#cvText, #cvSend`,titre:`Écrire et envoyer`,texte:`Écris ton message, puis « Envoyer ». Sans réseau, il est gardé sur le téléphone et part au retour du réseau.`,si:e=>Fc(e,`conv.post`)},{titre:`Une tâche pour toi`,texte:`Elle est dans « 👤 Mes tâches » et au Bureau. « 👋 Je la prends » si elle n'est à personne, puis « ✓ Déclarer fait (photo) » une fois le travail fait.`}],"chantier:admin":[{sel:`#admin .dx-sum, #admin .dx-top`,titre:`Pièces obligatoires en règle`,texte:`Le compteur du chantier (ex. 5/8) et la liste de ce qui manque. Le chef et le conducteur le retrouvent aussi en tête du chantier.`},{sel:`#admin .dx-p`,titre:`Une ligne par pièce`,texte:`DT / DICT, PPSPS, PGC, plans d'exé… : ✓ présente, ✗ manquante, ⚠ à mettre à jour (échéance). Touche une pièce présente pour l'ouvrir.`},{sel:`#admin .dx-dep, #admin .dx-man`,titre:`📎 Déposer une pièce`,texte:`« 📎 Déposer », puis choisis le fichier (PDF, photo…). DICT, arrêté, qualification : indique la date de fin, l'appli prévient 15 jours avant.`,si:e=>Fc(e,`dossier.edit`)},{sel:`#admin .dx-man`,titre:`⋯ Versions, échéance, sans objet`,texte:`Le ⋯ d'une pièce : ses versions, sa date de fin, « à mettre à jour », ou « sans objet » sur ce chantier (elle sort alors du compteur).`,si:e=>Fc(e,`dossier.edit`)},{sel:`#dx-drive-in, #dx-drive-open, #admin .dx-drvNo`,titre:`📁 Le Drive du chantier`,texte:`Tout ce qui n'est pas obligatoire vit dans le dossier partagé (Drive, SharePoint…). Son lien https:// s'enregistre une fois, puis « 📁 Ouvrir le Drive du chantier ».`},{sel:`#px-sec`,titre:`📄 Plans d'exé`,texte:`Une planche par page (n°, indice, date), rattachée à sa zone du plan. Le chef ou le bureau les importe, les équipes les ouvrent depuis « 📄 Mes plans ».`,si:e=>Pc(e,`plansexe`)},{sel:`#dx-fold`,titre:`Autres documents`,texte:`BL, épreuves, plans, accueil, émargements QSE… : touche pour déplier, tout est rangé par catégorie.`}],"chantier:qse":[{sel:`#qse-parcours, #qse .okbox`,titre:`🦺 Ton accueil chantier`,texte:`Une fois par chantier, avant de commencer : PPSPS, 10 points (DICT, prévention), signature au doigt. 10 à 15 minutes, ta fiche d'accueil est produite à la fin.`,si:e=>Fc(e,`qse.sign`)},{sel:`#qse-acc`,titre:`Le registre des accueils`,texte:`L'émargement de chaque arrivant sur ce chantier, avec la date. « 🖨 Feuille d'émargement » en sort une version papier.`},{sel:`#qse-accext`,titre:`👤 Accueillir sans compte`,texte:`Un intérimaire, un sous-traitant ou un visiteur sans compte : déroule son accueil sur ton téléphone, il signe au doigt.`,si:e=>Fc(e,`qse.manage`)},{sel:`#qse [data-qhnew], #qse [data-qhdo]`,titre:`⛑️ Quart d'heure sécurité`,texte:`L'encadrement le déclenche (un sujet, 3 questions) ; chacun le fait sur son téléphone et signe. Il s'affiche aussi au Bureau, dans « Ce qui t'attend ici ».`},{sel:`#qse-accident`,titre:`⚠ Accident ou presque-accident`,texte:`Blessure, soin, presque-accident : déclare-le tout de suite, depuis le chantier. La RH, la direction et le QSE sont prévenus.`},{sel:`#qse-controle`,titre:`📋 Contrôle chantier`,texte:`La trame SCR, point par point, sur le terrain. Les non-conformités restent listées ici jusqu'à leur levée (✓ Lever).`,si:e=>Fc(e,`qse.manage`)},{sel:`#qse [data-qsignme], #qse [data-qopen], #qse label.btn`,titre:`✍️ Documents à émarger`,texte:`Lis le document puis signe au doigt : l'émargement vaut « j'ai pris connaissance ». Un chiffre rouge sur l'onglet QSE = ce qu'il te reste à signer.`}],"chantier:export":[{sel:`#exportview .doeParts`,titre:`📁 Le dossier DOE complet`,texte:`Coche ce qu'il contient : carnet de soudage, plan numéroté, photos par n° de soudure, plan interactif, modifications, dossier administratif, données.`},{sel:`#exportview .doeOpts`,titre:`Les réglages du plan`,texte:`Soudures documentées ou toutes, photos, format (A4 à A0), échelle et orientation des planches.`},{sel:`#doeZip`,titre:`📁 Fabriquer le dossier DOE`,texte:`Un .zip complet, prêt à remettre. Reste connecté pendant la fabrication : les photos viennent du serveur.`},{sel:`#doeCarnet, #doePlan`,titre:`À la carte : carnet et plan`,texte:`📕 Carnet de soudage, 🗺 Plan des soudures numérotées : ils s'ouvrent dans un nouvel onglet, avec « Imprimer / enregistrer en PDF ».`},{sel:`#doeLink`,titre:`🔗 Le lien pour le client`,texte:`« Plan interactif : lien à envoyer » : à coller dans un mail, il s'ouvre sur PC comme sur téléphone. Les messageries bloquent les fichiers .html.`},{sel:`#doeViewer, #doeMail`,titre:`🧭 Le plan interactif en fichier`,texte:`Le même plan en .html ou en .zip, pour WeTransfer, OneDrive ou une clé USB. Dans le dossier DOE, il marche même hors ligne.`},{titre:`Avant d'envoyer`,texte:`En bas, « Ce que contient ce chantier » : soudures documentées, photos, intervenants. Tout vient des fiches saisies sur le terrain : vérifie qu'il ne manque rien.`}],"chantier:liste":[{sel:`#liste h3`,titre:`Ligne par ligne`,texte:`Les soudures de chaque ligne : l'aller (titre rouge), puis le retour (titre bleu), avec leur nombre.`},{sel:`#liste .wrow`,titre:`Une ligne = une soudure`,texte:`Son n°, son PK (en mètres) et son DN. « FC » = fausse coupe ; « inversion fils » en rouge = manchon à reprendre.`},{sel:`#liste .wrow .badge`,titre:`Son statut, à droite`,texte:`À souder, S Soudée, ✓ Contrôlée, M Manchonnée, ! À reprendre : les mêmes couleurs que sur le plan.`},{sel:`#liste .wrow`,titre:`Touche une soudure`,texte:`Le plan s'ouvre, centré sur elle, avec sa fiche : tu y fais ton étape comme d'habitude.`},{sel:`#btnMenu`,titre:`Seulement tes soudures`,texte:`Sur le plan, ☰ → Filtrer le plan (« Pour moi », « À souder », « À reprendre »…) : la liste reprend ce filtre.`},{sel:`#btnSearch`,titre:`🔍 Aller droit au but`,texte:`Tape le n° d'une soudure puis Entrée : le plan s'ouvre dessus. Les totaux sont dans « ⋯ Plus » → Récapitulatif.`}],"chantier:recap":[{sel:`#recap .kpis`,titre:`Le chantier en chiffres`,texte:`Lignes, mètres de tracé (aller), soudures, % soudées ou plus, % manchonnées.`},{sel:`#recap .prog`,titre:`La barre d'avancement`,texte:`Vert : manchonnées, bleu : contrôlées, orange : soudées, rouge : à reprendre. Le nombre de chaque statut est juste dessous.`},{sel:`#recap table.rc`,titre:`Par DN et par ligne`,texte:`À soud., Soud., Contr., Manch., À repr., FC (fausses coupes) et % d'avancement : pour chaque DN, puis pour chaque ligne.`},{titre:`Pièces et manchons`,texte:`Plus bas : la nomenclature des pièces du calepinage (quantités aller et retour, ml) et les manchons à poser, posés, restants.`},{sel:`#csvWelds, #csvPieces`,titre:`⤓ Pour Excel`,texte:`« CSV soudures » et « CSV pièces » : les mêmes chiffres en fichier, à ouvrir dans Excel.`},{sel:`#recap [data-gots], #doe-go`,titre:`Modifications et DOE`,texte:`Tout en bas, deux raccourcis : l'onglet Modifications (écarts à qualifier) et l'onglet DOE et exports.`,si:e=>Pc(e,`modifs`)&&Fc(e,`ts.qualify`)||Pc(e,`export`)&&Fc(e,`export.doe`)}]},Gc=e=>!e||!e.can||e.can(`weld.admin`),Kc={"chantier:bouclage":`Détection d'humidité`,"chantier:hydro":`Hydraulique`,"chantier:stock":`Stockage`,"chantier:fourniture":`Fournitures`,"chantier:phasage":`Phasage`,"chantier:ts":`Modifications`,"chantier:points":`Points de contrôle`,"chantier:catalogue":`Catalogue des pièces`},qc={"chantier:bouclage":[{sel:`#tabbar [data-tab="bouclage"]`,titre:`Détection d'humidité`,texte:`Le suivi des fils de détection (étamé, cuivré), manchon par manchon : la boucle attendue, ta mesure, l'endroit d'un défaut. Pour les manchonneurs, les soudeurs et l'encadrement.`},{sel:`#bl-line`,titre:`La ligne et la conduite`,texte:`Choisis la ligne, puis Aller ou Retour : chaque conduite a sa propre boucle, calculée depuis le départ.`},{sel:`#dh-rkm`,titre:`Les paramètres`,texte:`Fil (Ω/km), isolement mini, tolérance, fil monté dans un piquage : mets les valeurs du fournisseur. Hors connexion, ce sont les réglages de ton appareil ; connecté, ceux publiés pour tout SCR.`},{sel:`#bouclage .card:has(#dh-rows)`,titre:`La boucle, manchon par manchon`,texte:`Fils raccordés en vert, inversion en rouge, à raccorder en gris ; « Ω pont. » = la valeur attendue si on ponte à ce manchon. Touche un manchon pour mesurer depuis lui.`},{sel:`#dh-mesure`,titre:`Mesure en un point`,texte:`Touche la carte de la boucle mesurée (vers l'amont ou vers l'aval), saisis la boucle (Ω) et l'isolement (MΩ), puis « Comparer » : vert = conforme, jaune = écart à vérifier.`},{titre:`Enregistrer la mesure`,texte:`« 💾 Enregistrer cette mesure » garde la date, les valeurs, le verdict et le bouclage du moment. Les dernières mesures s'affichent juste en dessous, pour comparer dans le temps.`},{titre:`Bouclage temporaire ⟲`,texte:`Dans la fiche d'une soudure, « ⟲ Bouclage temporaire des fils ici » ferme la boucle à ce manchon (test DH amont). « 📏 DH : mesurer depuis ce manchon » ouvre cet écran dessus.`},{sel:`#loc-from`,titre:`Localiser un défaut`,texte:`Dis où l'appareil est branché (« Branché à »), sur quel fil et la distance qu'il annonce, puis touche « Localiser ». « Voir sur le plan » montre l'endroit et le trajet du fil.`}],"chantier:hydro":[{sel:`#tabbar [data-tab="hydro"]`,titre:`Hydraulique`,texte:`Prépare et trace les essais du réseau (épreuve, rinçage, passivation, remplissage), du découpage en tronçons jusqu'au PV. Pour le chef de chantier et le bureau.`},{sel:`#hydro .hyCard`,titre:`1 · Prestations à préparer`,texte:`Touche la carte de chaque essai prévu (✓). Son étiquette dit ce qu'il faut aux extrémités : kits fin de ligne, ou by-pass dès que l'eau circule.`},{sel:`#hydroMap`,titre:`2 · Sectorisation & points d'eau`,texte:`Avec les boutons juste au-dessus de la carte : « ✂ Sectoriser » coupe le réseau en tronçons d'essai ; « 💧 Point d'eau », « 🚰 Remplissage » (un par tronçon) et « ⬛ Skid » se posent sur le plan.`},{sel:`#hydroMap`,titre:`Les tronçons sur la carte`,texte:`Chaque tronçon a sa couleur ; ⇄ BP = by-pass à poser, KFL = kit fin de ligne, ⚠ = fond bombé déjà soudé. « 🔎 Bornes de la ville » affiche les bornes d'eau proches.`},{sel:`#hydro [data-monew], #hydro .pt-row`,titre:`Vannes et mode opératoire`,texte:`L'état de chaque vanne de sectionnement se suit ici. « ＋ Créer un mode opératoire » : vannes de départ sur le plan, puis remplir, purger, mettre en pression… et le terrain coche « ✓ Fait ».`},{sel:`#hydro .hyPal, #hydro .hyOp`,titre:`3 · Calendrier prévisionnel`,texte:`Glisse une pastille (Eau brute, Épreuve, Rinçage, Vidange…) sur le jour, dans la ligne du tronçon ; sur « 🗑 » pour l'enlever. Sans glisser : « ＋ Ajouter par formulaire ».`},{sel:`#hyReport`,titre:`4 · Récap par tronçon`,texte:`Linéaire, volume, débit de rinçage, temps de remplissage et pièces à poser, tronçon par tronçon. « 📄 Dossier de prépa » sort une page globale et une page par tronçon.`},{sel:`#hydro [data-hxedit]`,titre:`5 · Exécution et PV`,texte:`« ＋ Renseigner » pour chaque tronçon et chaque essai : relevés de début et de fin, photo du manomètre, Conforme ou Non conforme. Puis « 📄 Rapport de réalisation + PV ».`}],"chantier:stock":[{sel:`#tabbar [data-tab="stock"]`,titre:`Stockage`,texte:`Les pièces pré-isolées livrées sur le chantier : camions, zones de stockage posées sur le plan, ce qui est pris et ce qui reste. Pour le chef, le conducteur et le magasin.`},{sel:`#stk-new`,titre:`＋ Nouvelle livraison (camion)`,texte:`Nom, n° de BL, date, puis le contenu : le PDF du bon de livraison se lit tout seul ; sinon « 📋 Coller », « ✍ Catalogue » ou « Depuis le calepinage ».`},{titre:`Prévu, puis la zone`,texte:`Laisse « Déchargement prévu » coché tant que le camion n'est pas là. Pour une nouvelle zone, touche le plan à l'endroit du déchargement, ajuste (glisser, poignées, ↻ 15°), puis « Terminer ».`},{sel:`#stock [data-stkunload]`,titre:`📦 Le camion est arrivé`,texte:`Quand il arrive, touche « 📦 … est arrivé — pointer » : photo, puis quantités réelles face au BL. Les écarts sont signalés ⚠ et la marchandise entre en stock.`},{sel:`#stock details[open] #stkMap, #stock [data-stkui="map"] > summary`,titre:`Plan d'ensemble des stockages`,texte:`Toutes les zones sur un plan : touche une zone pour sa fiche. Livré, pris, reste, et la provenance pièce par pièce (camion d'origine, déplacements).`},{sel:`#stock [data-stkui^="z:"] > summary`,titre:`Une carte par zone`,texte:`Bord vert = en stock, jaune = prévue ; livré, pris et reste par référence. « ⇄ Scinder / transférer » déplace des pièces vers une autre zone, leur camion d'origine les suit.`},{titre:`Les prises du terrain`,texte:`Au manchonnage, l'opérateur touche dans la fiche de la soudure la zone d'où vient la pièce (la plus proche est pré-choisie). « Pris » et « reste » se mettent à jour tout seuls.`},{sel:`#stock [data-stkui^="z:"] ~ [data-stkui="bal"] > summary`,titre:`Besoin / livré / reste à poser`,texte:`En bas, le stock et l'attendu face à ce qu'il reste à poser, pour tout le réseau ou une ligne : rouge = il manque, beige = surplus. « ⬇ CSV besoin / livré / reste » pour le transmettre.`}],"chantier:fourniture":[{sel:`#tabbar [data-tab="fourniture"]`,titre:`Fournitures`,texte:`Ce que le tracé demande (besoin), ce qui est commandé et livré, ce qui reste à livrer et à commander. Pour le chef, le conducteur et le bureau.`},{sel:`#fourniture .ac-stats`,titre:`Les chiffres clés`,texte:`Besoin, commandé, livré, reste à livrer, à commander, surplus. Livré et attendu viennent tout seuls de l'onglet Stockage (réceptions pointées) : rien à ressaisir.`},{sel:`#fourniture [data-fzui="cmd"]`,titre:`Commande fournisseur`,texte:`« 📥 Importer une commande » : l'accusé de réception du fournisseur (Excel, CSV ou PDF) est lu ligne par ligne et vérifié avant d'entrer.`},{sel:`#fourniture details[open] .fz-cmp tr:has(th), #fourniture [data-fzui="cmp"] > summary`,titre:`Comparatif tracé ↔ commande ↔ livré`,texte:`Une ligne par référence, de l'initial au reste à livrer ; au-dessus, les filtres Écarts, À commander, Reste à livrer. En rouge : à commander, ou au-delà de la commande, à qualifier.`},{sel:`#fourniture details[open] [data-fa="lasso"], #fourniture [data-fzui="zones"] > summary`,titre:`Zones à livrer · planning`,texte:`« ⭕ Entourer une zone sur le plan » (ou « 📅 Reprendre les phases du phasage ») : pour la zone, ce qui est sur place, annoncé, à faire livrer et à commander.`},{sel:`#fourniture [data-fzui="trucks"]`,titre:`Camions · planning des livraisons`,texte:`Les camions se calculent depuis les zones datées (livraison = début de zone − délai). « → Stock » annonce le camion dans l'onglet Stockage, où se fait le pointage.`},{titre:`Pièces en plus`,texte:`Plus bas, le pli « Pièces en plus » : casse, chutes, réserve, modif terrain → « ＋ Ajouter des pièces en plus ». Elles s'ajoutent au besoin, avec qui et pourquoi.`},{titre:`Hypothèses · délai et camions`,texte:`Tout en bas : délai avant le début de zone, plateau, hauteur, charge utile. Ce sont des ordres de grandeur pour planifier les camions ; le fournisseur confirme.`}],"chantier:phasage":[{sel:`#tabbar [data-tab="phasage"]`,titre:`Phasage`,texte:`Découpe le chantier en phases réelles, prises sur le plan, avec leurs dates : Tracé en déduit les soudures par jour et les fournitures. Pour le chef, le conducteur et le bureau.`},{sel:`#phasage [data-phnew]`,titre:`➕ Nouvelle phase`,texte:`Touche la conduite au début du tronçon, puis à la fin (même au milieu d'une barre) ; pour une antenne, touche-la jusqu'où tu veux aller. Puis « Créer ».`},{sel:`#phasage .phMini`,titre:`Les phases sur le plan`,texte:`Chaque phase EXE y prend sa couleur et son numéro, les phases marché sont en gris. Touche un tronçon pour ouvrir sa phase.`},{titre:`Les dates d'une phase`,texte:`« Ouvrir » une phase : son nom et 4 périodes, ouverture de tranchée (marron), soudure (orange), remblaiement (vert), enrobé (gris). Sous « On vient souder », coche les jours réels.`},{sel:`#phasage [data-phwk]`,titre:`Semaine de soudure`,texte:`« 4 j (lun → jeu) » ou « 5 j (lun → ven) », jours fériés déduits. Tracé en tire les soudures par jour et par DN, les mètres ouverts et remblayés par jour (ou sur les jours cochés).`},{sel:`#phImport`,titre:`＋ Phase marché`,texte:`Le planning du marché : pose-la sur le plan comme une phase, avec sa période, puis « 🔒 Figer (référence des écarts) ». Les phases EXE s'y rattachent seules, par leur position.`},{sel:`#phasage [data-phlv]`,titre:`EXE, Marché, Tout`,texte:`Filtre la liste des phases ; coche des phases EXE puis « Σ Grouper les cochées » pour suivre un secteur. Le planning, en bas, compare chaque marché à ses phases.`},{sel:`#phExport`,titre:`📄 Exporter le phasage`,texte:`Une page imprimable (PDF) : le plan, le planning, puis une section par phase avec ses soudures et ses fournitures, à partager avec les équipes.`}],"chantier:ts":[{sel:`#tabbar [data-tab="ts"]`,titre:`Modifications`,texte:`Compare le tracé du marché (figé) au réel. Par défaut tout est compris : tu déclares seulement ce que tu veux ressortir (TS, pour mémoire…), pointé sur le plan.`},{sel:`#tsview .tsMain, #tsview .mdEc`,titre:`Marché vs réel / projeté`,texte:`Linéaire, soudures, coudes, vannes, tés… : la quantité du marché, celle du réel et l'écart, avec ce qui est ajouté ou retiré. La ligne au-dessus résume les écarts.`},{sel:`#tsview [data-mod="decl"]`,titre:`＋ Déclarer une modif`,texte:`Un nom, un état, le n° de devis, puis « Ce que je veux ressortir » : changement de DN, linéaire, soudures, pièces ou autre. Un écart constaté s'ajoute d'un toucher.`},{titre:`📍 Pointer sur le plan`,texte:`Dans la fenêtre, « 📍 Pointer sur le plan » : touche l'endroit (plusieurs points possibles, re-touche pour enlever), puis « ✓ Terminé ». Depuis le plan : ＋ Poser → ✍ Déclarer une modif.`},{titre:`Les états`,texte:`TS proposé (jaune), TS commandé (orange, n° de devis obligatoire), Pour mémoire (vert), Compris (violet), Oubli du dessin (gris, le marché est corrigé). Le repère sur le plan prend sa couleur.`},{sel:`#tsview .dclCard, #tsview .mdCard`,titre:`Les modifs déclarées`,texte:`Une carte par modif : ce qui est ressorti, où, la note, les photos, le journal ; « ✎ Modifier », « 🗺 Voir sur le plan ». Sur le plan, touche un repère n° pour sa fiche.`},{sel:`#tsview [data-mod="export"]`,titre:`📄 Export des modifications`,texte:`Une page imprimable : comparaison marché → réel, récap par état, puis chaque modif avec son plan et son repère. À joindre au devis ou au DOE.`},{sel:`#tsview [data-tsrefreeze]`,titre:`🔒 Re-figer le marché…`,texte:`Si le tracé de base n'était pas fini quand le marché a été figé, ou pour un avenant : le tracé actuel devient la référence. L'ancien marché est gardé.`}],"chantier:points":[{sel:`#tabbar [data-tab="points"]`,titre:`Points de contrôle`,texte:`Les vannes, purges, vidanges, sous-stations et raccordements du tracé : leur état et leurs photos datées, pour le suivi et le DOE. Pour toute l'équipe du chantier.`},{sel:`#points .pt-kpi`,titre:`Ce qui reste à faire`,texte:`Les vannes sans état et les points sans photo, en rouge tant qu'il en manque. Juste en dessous, les filtres (Sans photo, Vannes, Purges / vidanges…) ne montrent qu'eux.`},{sel:`#points .pt-row`,titre:`Ouvrir un point`,texte:`Touche une ligne : la fiche du point s'ouvre. « 📐 Plan » montre la pièce sur le plan, avec sa pastille.`},{titre:`Ouverte ou fermée`,texte:`Dans la fiche d'une vanne, d'une purge ou d'une vidange : « 🔓 Ouverte » ou « 🔒 Fermée ». C'est daté, à ton nom, et l'appli te demande aussitôt la photo.`},{titre:`Les constats photo`,texte:`« 📷 Ajouter des photos », puis le contexte : pénétration, pièce posée, épreuve, fuite… Sans réseau, les photos attendent sur le téléphone et partent toutes seules.`},{titre:`Les pastilles sur le plan`,texte:`À côté de chaque pièce : vert = ouverte, rouge = fermée, bleu = photos, gris = rien encore, orange = à voir (vanne de coupe ouverte pendant un essai).`},{sel:`#points [data-moterrain]`,titre:`Mode opératoire hydraulique`,texte:`Quand le bureau a préparé un essai, il s'affiche en haut : « Suivre sur le plan » montre chaque étape (vannes, remplissage, purges). Coche « ✓ Fait » au fur et à mesure.`,si:e=>!e||!e.feat||e.feat(`hydro`)},{titre:`Suivre une autre pièce`,texte:`Encadrement : dans la fiche d'une pièce, « 📍 Suivre ce point (photos, état) » l'ajoute à cette liste, filtre « Autres suivis ».`,si:Gc}],"chantier:catalogue":[{sel:`#tabbar [data-tab="__more"], #catalogue h2.vt`,titre:`Catalogue des pièces`,texte:`Les cotes des pièces de chaque fournisseur : Tracé s'en sert pour reconnaître les pièces du plan et les dessiner. Cet écran s'ouvre par « ⋯ Plus », au bout de la barre du bas.`},{sel:`#catalogue [data-cat]`,titre:`Un fournisseur à la fois`,texte:`Touche une puce pour changer de fournisseur ; « · ce chantier » marque celui du chantier ouvert.`},{sel:`#catalogue table.cat`,titre:`Les tableaux`,texte:`Tubes droits (DN, Ø acier, gaines, longueurs de barre), puis coudes, tés, réductions, vannes et manchons. Glisse un tableau large sur le côté pour tout voir.`},{titre:`Une cote fausse ?`,texte:`La source du catalogue est indiquée en haut. Une cote fausse donne un plan faux : signale-la au bureau, avec la référence du fournisseur.`}],concepteur:[{titre:`Tracé Concepteur`,texte:`On dessine ici le réseau (lignes, pièces) sur un plan de fond, puis on l'envoie dans le chantier. Pour le bureau et l'encadrement, plutôt sur ordinateur.`},{sel:`#mTrace`,titre:`✎ Tracer une ligne`,texte:`Clique les sommets de l'axe un à un, puis Entrée (ou « Terminer ») ; ou saisis longueur et angle, puis « Ajouter ». Les soudures se placent toutes seules.`},{sel:`#supplier`,titre:`Fournisseur, série, DN, barre`,texte:`À régler avant ou pendant le tracé : la ligne prend ces valeurs quand tu la valides. « prof. » = profondeur de pose par défaut, modifiable ligne par ligne.`},{sel:`#mSelect`,titre:`☝ Sélection`,texte:`Touche une ligne, une soudure ou une pièce pour sa fiche ; glisse un sommet pour retoucher. « ◐ Un seul côté » ne bouge qu'une conduite.`},{sel:`#mAdd`,titre:`Les pièces`,texte:`« ＋ Té / vanne / réduction / lyre / drapeau » : choisis la pièce et son DN, puis touche la ligne à l'endroit voulu.`},{sel:`#bUndo`,titre:`Annuler, rétablir`,texte:`↶ annule la dernière retouche (Ctrl+Z), ↷ la rétablit (Ctrl+Y), plans de fond compris.`},{sel:`label:has(> #bgAdd)`,titre:`＋ Plan (DXF, PDF, image)`,texte:`Ajoute un ou plusieurs plans de fond : DXF du bureau d'études, PDF (une page = un plan), image ou scan. Chaque plan se cale ensuite.`},{sel:`#bgTools #bgCal2, #bgTools #bgScale, aside .tabs [data-tab="fond"]`,titre:`Caler un plan`,texte:`« 📏 Échelle » : deux points de distance connue ; « 1/N » pour un PDF ; « ✥ Déplacer » ; « ⟲ 2 points » le cale d'un coup sur le tracé. Sur ordinateur : onglet Fond.`},{sel:`#bAer`,titre:`📍 Vue aérienne`,texte:`Tape une adresse : la photo IGN se met en fond, derrière les plans. Puis « ⌖ Caler sur la vue aérienne » : 1 point pour placer, 2 pour tourner aussi.`},{sel:`#t1Zones`,titre:`▦ Zones de chiffrage`,texte:`« ▭ Sélection » : entoure des lignes d'un rectangle, puis « Mettre dans la zone… ». « ▦ Zones » liste chaque zone avec son nom, ses lignes et ses ml.`},{sel:`#tbVers`,titre:`🕑 Versions`,texte:`Dans une étude (Commerce), « 🕑 Versions » montre ce qui a été ajouté, modifié ou supprimé à chaque version ; touche une version pour voir ses changements.`},{sel:`#bSave`,titre:`💾 Enregistrer dans Tracé`,texte:`Donne le nom du chantier, ou mets à jour l'existant (soudures déjà faites gardées). Le réseau part dans le chantier, soudures numérotées, et au serveur si tu es connecté.`}]},Jc=e=>{try{return!!document.querySelector(e)}catch{return!1}},Yc=e=>{try{return String(e&&e.where&&e.where()||``)}catch{return``}},Xc=(e,t)=>Yc(e)===t,Zc=(e,t)=>{let n=Yc(e);return n===t||n.startsWith(t+`:`)},Qc=(e,t)=>!e||!e.can||!!e.can(t),$c=(e,t)=>!e||!e.feat||!!e.feat(t),el=()=>{try{let e=window.TRACE;return!!(e&&e.acces&&e.acces.isAdmin&&e.acces.isAdmin())}catch{return!1}},tl=e=>{try{let e=window.TRACE,t=e&&e.acces&&e.acces.current&&e.acces.current();if(t&&e.acces.rights)return!!e.acces.rights(Object.assign({},t,{admin:!1}))[`pointage.self`]}catch{}return Qc(e,`pointage.self`)},nl=(e,t,n)=>r=>(e.includes(`:`)?Xc(r,e):Zc(r,e))?Jc(t):!n||!!n(r),rl=(e,t)=>n=>Xc(n,`equipe`)?Jc(e):!t||!!t(n),il=e=>`#eq-app .eq-subs [data-v="`+e+`"]`,al=e=>el()||Qc(e,`qse.manage`),ol={"compagnon:docs":`Documents`,"compagnon:planning":`Planning`,"compagnon:chantiers":`Chantiers`,"compagnon:prod":`Productions`,"compagnon:frais":`Notes de frais`,"compagnon:heures":`Heures`,"compagnon:habs":`Passeport`,"compagnon:avatar":`Avatar`,"compagnon:dem":`Mes demandes · commande`,"compagnon:mag":`Mes demandes · dépôt`,"compagnon:vlaisse":`Véhicule laissé`,"compagnon:vx":`Véhicule`,"equipe:annu":`Annuaire`,"equipe:docs":`Documents d'entreprise`,"equipe:info":`Communication interne`,"equipe:x:acc":`Accueil RH`,"equipe:x:dob":`Documents administratifs`,"equipe:x:pack":`Pack SCR`},sl={accueil:[{titre:`Bienvenue dans Tracé`,texte:`Aujourd'hui, c'est ta page d'accueil : ta journée, ce qui t'attend, tes modules. Elle s'adapte à ton poste et à tes droits.`},{sel:`#tbHomeMod`,titre:`Tracé + le module`,texte:`Touche « Tracé ▾ » pour changer de module, revoir le tutoriel de l'écran ou les voir tous (📚). Le logo te ramène ici.`},{sel:`#eq-app .ac-hero`,titre:`Ta journée`,texte:`Ton chantier du jour, la météo, ton équipe et l'objectif posé par ton chef (la semaine en chiffres pour l'encadrement). Un bouton t'y emmène.`},{sel:`#eq-app .ac-two section.ptc`,titre:`Pointer ta journée`,texte:`« ▶ Commencer la journée » en arrivant, puis pause midi et fin de journée : un toucher à chaque fois. Ton chef valide ensuite.`,si:nl(`accueil`,`#eq-app .ac-two section.ptc`,tl)},{sel:`#eq-app .ac-notif, #eq-app .ac-two .ac-empty`,titre:`À faire`,texte:`Ce qui attend un geste de toi : document à signer, accueil chantier, tâche… Touche la ligne pour le faire ; bord rouge = urgent ou en retard.`},{sel:`#eq-app .ac-kgrid`,titre:`À savoir`,texte:`L'info sans geste à faire : planning, objectifs, demandes… Touche une tuile pour le détail.`},{sel:`#eq-app .ac-spaces`,titre:`Tes espaces`,texte:`Un module par tuile, selon ton poste. Un chiffre sur une tuile : des choses t'y attendent.`},{sel:`#eq-app [data-act="accnew"]`,titre:`Déclarer un accident`,texte:`Accident, presque-accident ou soin bénin : touche ce bouton tout de suite, même incomplet. La RH est prévenue et complète.`},{sel:`#homeAva`,titre:`Ta pastille`,texte:`Touche ton avatar, en haut à droite : ton compte, ton nom affiché, ton mot de passe, la déconnexion.`}],compagnon:[{sel:`#eq-app .eq-subs`,titre:`Compagnon, ton espace`,texte:`Tout ce qui te concerne : pointage, heures, documents, matériel. Glisse la barre pour voir tes rubriques ; « ? » relance le tutoriel.`},{sel:`#eq-app section.ptc, `+il(`moi`),titre:`Accueil et pointage`,texte:`L'Accueil, c'est ta journée : chantier, demain, échéances, ta fiche. Pointe ici : « ▶ Commencer la journée », la pause, la fin.`,si:nl(`compagnon`,il(`heures`),tl)},{sel:il(`moi`),titre:`Accueil : ta journée`,texte:`Ton chantier du jour, demain, tes notes de frais, tes échéances et ta fiche : tout d'un coup d'œil.`,si:e=>Zc(e,`compagnon`)?!Jc(il(`heures`)):!tl(e)},{sel:il(`docs`)+`, #eq-app .eq-subs`,titre:`Documents`,texte:`Règlement, notes de service, flash info : à lire jusqu'en bas, puis à signer au doigt sous 7 jours. La pastille rouge compte ce qui reste.`},{sel:il(`planning`)+`, #eq-app .eq-subs`,titre:`Planning`,texte:`Ta semaine jour par jour : ton chantier, avec qui, tes objectifs. « Semaine prochaine » pour savoir où tu vas lundi.`,si:nl(`compagnon`,il(`planning`),e=>$c(e,`planning`))},{sel:il(`heures`)+`, `+il(`prod`)+`, #eq-app .eq-subs`,titre:`Heures et Productions`,texte:`Heures : tes journées pointées, ce qui est validé, ta navette du mois. Productions : tes soudures et manchons comptés sur le plan.`,si:nl(`compagnon`,il(`heures`)+`, `+il(`prod`),tl)},{sel:il(`frais`)+`, #eq-app .eq-subs`,titre:`Notes de frais`,texte:`Une dépense avancée pour le chantier : le montant, le ticket en photo, c'est envoyé. Ton conducteur valide, le bureau rembourse.`,si:nl(`compagnon`,il(`frais`),e=>$c(e,`frais`))},{sel:il(`habs`)+`, #eq-app .eq-subs`,titre:`Passeport et Avatar`,texte:`Passeport : tes habilitations, à jour ou à renouveler. Avatar : ton personnage dans l'appli, il porte tes récompenses.`},{sel:il(`mag`)+`, `+il(`dem`)+`, #eq-app .eq-subs`,titre:`Mes demandes`,texte:`Besoin de matériel pour ton chantier ? « ＋ Nouvelle demande », puis tu suis l'état : avec un magasin, tu la retires au dépôt ; sinon l'encadrement la commande et la fait livrer.`,si:nl(`compagnon`,il(`mag`)+`, `+il(`dem`),e=>$c(e,`magasin`)||$c(e,`demandes`))},{sel:il(`vlaisse`)+`, #eq-app .eq-subs`,titre:`Véhicule laissé`,texte:`Un véhicule t'attend sur un chantier ou au dépôt : lis son état des lieux, puis signe pour le prendre.`,si:e=>Zc(e,`compagnon`)&&Jc(il(`vlaisse`))},{sel:il(`chantiers`)+`, #eq-app .eq-subs`,titre:`Chantiers`,texte:`Les chantiers dont tu es chef ou conducteur : avancement, stock, engins.`,si:e=>Zc(e,`compagnon`)&&Jc(il(`chantiers`))}],"compagnon:docs":[{sel:`#eq-app .ac-row.todo, #eq-app h2.vt`,titre:`À lire et signer`,texte:`Les documents qui te concernent : règlement intérieur, notes de service, flash info. Le plus urgent en haut, à signer sous 7 jours.`},{sel:`#eq-app [data-act="docopen"]`,titre:`Ouvrir un document`,texte:`Touche-le : il s'ouvre en grand (« ⤢ Plein écran » si besoin). Déroule-le jusqu'en bas, ou jusqu'à la dernière page du PDF.`},{titre:`Signer au doigt`,texte:`En bas, « ✓ J'ai lu en entier — je signe » se débloque. Signe dans le cadre avec le doigt, puis « Valider ma signature ».`},{titre:`Les couleurs`,texte:`Bord rouge : à lire et signer, avec la date limite (en rouge si elle est dépassée) ; ✓ vert : signé, avec sa date.`},{titre:`Nouvelle version`,texte:`Un document qui change revient « nouvelle version, à lire et signer ». Ton ancienne signature reste gardée.`},{titre:`Livrets et déjà signés`,texte:`Plus bas : tes livrets d'accueil, à relire chapitre par chapitre quand tu veux, et tout ce que tu as déjà signé.`},{titre:`Rien ne bloque`,texte:`Tu gardes l'accès à toute l'appli pendant ces 7 jours. Les RH voient qui a signé et relancent les retards.`}],"compagnon:planning":[{sel:`#eq-app .eq-semaine`,titre:`Ta semaine`,texte:`Un jour par case : ton chantier, la météo, 🎯 tes objectifs ; « repos » si rien n'est prévu. Touche un jour pour son détail.`},{sel:`#eq-app [data-act="plansem"]`,titre:`Cette semaine, la suivante`,texte:`« Semaine prochaine » pour savoir où tu vas lundi. Le week-end, c'est elle qui s'ouvre.`},{sel:`#eq-app .eq-plan-site, #eq-app .eq-cols`,titre:`Le détail du jour`,texte:`Horaires et point de rassemblement, tes objectifs, les responsables du chantier et tes compagnons : 📞 pour appeler.`},{sel:`#eq-app .eq-plan-site [data-act="opensite"]`,titre:`Ouvrir le chantier`,texte:`En bas du jour, « Ouvrir le chantier » t'emmène sur son plan. 🗺 à côté d'un objectif le montre sur le plan.`,si:nl(`compagnon:planning`,`#eq-app .eq-plan-site`)},{sel:`#eq-app [data-act="xgo"][data-v="agenda"]`,titre:`Composer ma semaine`,texte:`Encadrement : ton planning n'est pas imposé. Ajoute visites, réunions et rendez-vous ; export Outlook possible.`,si:nl(`compagnon:planning`,`#eq-app [data-act="xgo"][data-v="agenda"]`,e=>Qc(e,`planning.edit`))},{titre:`Qui fait le planning`,texte:`Ton conducteur place les équipes. Dès que c'est fait, ton Accueil affiche aussi où tu vas demain.`}],"compagnon:prod":[{sel:`#eq-app .eq-filtres`,titre:`Choisis la période`,texte:`Semaine, Mois ou 12 semaines. ◀ ▶ ou la liste juste en dessous pour aller à une semaine précise.`},{sel:`#eq-app .eq-tiles, #eq-app .eq-scroll .card`,titre:`Ton total`,texte:`Ce que tu as fait sur la période : soudures, manchons… et le détail par DN juste en dessous.`},{sel:`#eq-app .eq-sem-h`,titre:`Semaine par semaine`,texte:`Touche une semaine pour la déplier jour par jour : ton chantier et ta production de chaque jour.`},{titre:`D'où viennent les chiffres`,texte:`Chaque soudure ou manchon pointé sur le plan à ton nom compte ici. En cas d'erreur, vois avec ton chef de chantier.`},{titre:`Ta récompense`,texte:`Ta production fait monter ton palier : il se voit sur ton avatar (carte « Tes récompenses » de l'Accueil, rubrique Avatar).`}],"compagnon:frais":[{sel:`#eq-app .ac-stats`,titre:`Tes notes de frais`,texte:`Le total de tes notes de frais et combien attendent d'être validées.`},{sel:`#eq-app [data-act="cmd"][data-v="dbnew|"]`,titre:`➕ Note de frais`,texte:`Une dépense avancée pour le chantier : carburant, péage, hôtel, repas… Touche le bouton dès que tu as payé.`},{titre:`Remplir la note`,texte:`Date, montant TTC, nature, chantier, payé avec (carte SCR, tes deniers, caisse du chantier). Puis « Enregistrer la note de frais ».`},{titre:`Le ticket, tout de suite`,texte:`« 📷 Prendre en photo » ou « 📎 Importer » (photo, PDF). Ticket donné au chef : écris « ticket remis au chef » dans Lien.`},{titre:`Qui valide`,texte:`Ton conducteur ou le bureau valide, puis le bureau rembourse. Tant qu'elle est « Saisi », tu peux la retirer (🗑).`},{titre:`Les états`,texte:`Saisi (jaune) → Validé (vert) → Remboursé (violet). Refusé (rouge) : le nom de qui a refusé est sur la ligne.`},{titre:`Hors réseau`,texte:`Sans réseau, la photo du ticket reste dans la note et part avec elle au retour du réseau.`}],"compagnon:heures":[{sel:`#eq-app section.ptc`,titre:`Ton pointage du jour`,texte:`Comme sur l'Accueil : « ▶ Commencer la journée », « Pause midi », « ▶ Reprise après la pause », « ■ Fin de journée ».`},{sel:`#eq-app section.ptc`,titre:`Les couleurs du pointage`,texte:`Gris : pas commencée ; vert : au travail ; orange : en pause ; bleu : en route vers un autre chantier ; noir : journée finie.`},{sel:`#eq-app .pi-pts`,titre:`Tes derniers pointages`,texte:`Chaque jour passe par 3 étapes : déclaré › chef › conducteur. Fin oubliée : « 🕓 Indiquer l'heure de fin », ton chef la voit.`,si:nl(`compagnon:heures`,`#eq-app .pi-pts`)},{sel:`#eq-app .eq-filtres`,titre:`Tes heures par période`,texte:`Semaine, Mois ou 12 semaines : heures travaillées, jours pointés, pauses. Touche une semaine pour le jour par jour.`},{sel:`#eq-app .mynav`,titre:`Ma navette`,texte:`Tes variables du mois : heures, heures sup à 125 % et 150 %, déplacements. « ⬇ Ma navette (Excel) » pour la garder.`},{titre:`Une erreur ?`,texte:`Fin touchée par erreur : « ↩ Annuler la fin » tant que personne n'a validé. Après, ton chef corrige, avec le motif.`},{titre:`Hors réseau`,texte:`Sans réseau, ton pointage est gardé sur le téléphone et part dès que le réseau revient. Ta position n'est notée qu'au début et à la fin.`}],"compagnon:habs":[{sel:`#eq-app .eq-scroll .eq-filtres`,titre:`Ton passeport d'un coup d'œil`,texte:`Tes formations et habilitations comptées par état : à jour, à renouveler (90 j), expiré, manquant.`},{sel:`#eq-app .eq-scroll .eq-list`,titre:`Chaque habilitation`,texte:`Son nom, son numéro, jusqu'à quand elle est valable. S'il y a une pièce jointe, touche la ligne pour l'ouvrir.`},{titre:`Les couleurs`,texte:`Vert : à jour ; orange : à renouveler sous 90 jours ; rouge : expirée ; gris : manquante pour ton poste.`},{titre:`Qui le tient à jour`,texte:`Les RH saisissent tes habilitations : une date fausse, une pièce à ajouter, préviens-les.`},{titre:`Qui voit tes alertes`,texte:`Ton chef et les RH voient aussi tes échéances : ils programment les recyclages avant qu'elles n'expirent.`}],"compagnon:mag":[{sel:`#eq-app [data-v="mag|new"]`,titre:`＋ Nouvelle demande`,texte:`Du matériel du dépôt ? Touche « ＋ Nouvelle demande ».`},{titre:`Choisis les articles`,texte:`Ta liste de métier en premier, ou 🔍 cherche dans tout le dépôt. + et − pour la quantité, puis « Suivant › ».`},{titre:`Pour quoi ?`,texte:`🏗 Chantier, 🚐 Véhicule ou 📦 Dépôt, ⚡ urgent si besoin, une note. Puis « 📤 Envoyer la demande ».`},{sel:`#eq-app .mag-row, #eq-app .mag-vide`,titre:`Suivre ta demande`,texte:`Envoyée (bleu) → En préparation (jaune) → Prête au dépôt (vert) : tu es prévenu, passe la retirer. Touche-la pour le détail.`},{titre:`Annuler, reliquat`,texte:`« Annuler la demande » tant que la préparation n'a pas commencé. Prête en partie : le reste suit, tu seras prévenu.`},{sel:`#eq-app [data-v="mag|fiches|"]`,titre:`🧰 Fiches type`,texte:`Le matériel prévu pour chaque poste : à regarder avant de demander.`},{sel:`#eq-app .mag-rf`,titre:`Hors réseau`,texte:`Sans réseau, ta demande reste sur le téléphone et part toute seule au retour. ↻ recharge l'état depuis le serveur.`}],"compagnon:dem":[{sel:`#eq-app .dm-head`,titre:`Mes demandes`,texte:`Du matériel pour un chantier, commandé par ton conducteur ou le bureau (pas par le dépôt). Tu demandes, tu suis chaque étape.`},{sel:`#eq-app [data-v="dem|new|"]`,titre:`＋ Nouvelle demande`,texte:`1/2 : ce qu'il te faut. Ta liste de métier (+ et −), ou écris l'article et la quantité, puis « ＋ Ajouter à ma demande ».`},{titre:`2/2 : pour quel chantier`,texte:`Le chantier (les tiens en premier), ⚡ urgent si besoin, une photo, une note. Puis « 📤 Envoyer la demande ».`},{sel:`#eq-app .dm-row, #eq-app .dm-vide`,titre:`Suivre l'état`,texte:`Envoyée (bleu) → Commandée (jaune, avec la date prévue) → Livrée (vert). Livrée en partie (violet) : le reste suit.`},{titre:`Refusée, annulée`,texte:`Refusée (rouge) : le motif est écrit. Tu peux annuler ta demande tant qu'elle n'est pas commandée.`},{titre:`Tu es prévenu`,texte:`À chaque changement, « nouveau » s'affiche sur la demande et une pastille sur la rubrique.`},{sel:`#eq-app [data-v="dem|file|"]`,titre:`📋 Demandes à traiter`,texte:`Encadrement : les demandes de tes équipes. « 🛒 Commandé », puis « 📦 Livré / remis », ou « Refuser la demande » avec un motif.`,si:e=>Xc(e,`compagnon:dem`)&&Jc(`#eq-app [data-v="dem|file|"]`)},{titre:`Hors réseau`,texte:`Sans réseau, la demande reste sur le téléphone (« ⏳ pas encore partie ») et part toute seule au retour du réseau.`}],"compagnon:avatar":[{sel:`#eq-av-prev`,titre:`Ton avatar`,texte:`C'est toi dans l'appli : Accueil, planning, annuaire. « Au travail » et « Hors travail » montrent tes deux tenues.`},{sel:`#eq-av-side .card`,titre:`Poste`,texte:`Ton poste fixe ta tenue de travail : il est attribué par l'administrateur.`},{titre:`Visage`,texte:`Silhouette, teint, cheveux, coiffure, barbe… Touche une vignette : l'aperçu change tout de suite.`},{titre:`Tenue hors travail`,texte:`Haut, bas, chaussures, couleurs, accessoire : ta tenue perso, montrée en dehors de tes heures pointées.`},{titre:`Récompenses`,texte:`Elles se gagnent sur le terrain (production, sécurité, qualité, ancienneté) et se voient sur ton avatar.`},{sel:`#eq-app [data-act="avhasard"]`,titre:`Au hasard, réinitialiser`,texte:`« 🎲 Au hasard » tire un avatar, « Réinitialiser » revient au départ. Tout est enregistré au fur et à mesure.`}],"compagnon:chantiers":[{sel:`#eq-app .eq-sems .card`,titre:`Tes chantiers`,texte:`Un chantier par carte : ville, météo, qui est dessus aujourd'hui, le chef de chantier.`},{sel:`#eq-app .eq-prog`,titre:`L'avancement`,texte:`Soudures faites sur le total, en %. La barre avance avec les soudures pointées sur le plan.`},{titre:`Stock et engins`,texte:`Les articles suivis (orange : sous le seuil, à commander) et les engins, loués ou en propre, avec la fin de location.`},{sel:`#eq-app .eq-sems [data-act="opensite"]`,titre:`Ouvrir le stock`,texte:`« Ouvrir le stock » t'emmène dans l'onglet Stock du chantier : livraisons, zones, prélèvements.`}],"compagnon:vlaisse":[{sel:`#eq-app .veh2-card`,titre:`Un véhicule à prendre`,texte:`Laissé sur un chantier ou au dépôt, pour toi ou « à qui le prendra » : qui l'a laissé, où, quand, ses kilomètres.`},{sel:`#eq-app .veh2-card .veh-big`,titre:`Le prendre`,texte:`Touche le bouton : tu lis l'état des lieux laissé (photos, kilomètres, remarques). S'il n'y en a pas, tu fais le tien, étape par étape.`},{titre:`Exact ou contesté`,texte:`Si c'est exact, signe : le véhicule est à toi. Sinon, conteste avec un mot ; les responsables tranchent.`},{titre:`Qui valide ?`,texte:`Signer l'état des lieux laissé suffit, sans responsable. Ton propre état des lieux, lui, est relu et validé par un responsable.`}],"compagnon:vx":[{sel:`#eq-app .veh-wiz h2.vt, #eq-app .veh-bar, #eq-app .veh-wiz`,titre:`Une étape par écran`,texte:`L'état des lieux du véhicule que tu prends ou que tu laisses : le numéro (1/9…) et la barre montrent où tu en es.`},{sel:`#veh-next`,titre:`Continuer ›`,texte:`Remplis l'étape, puis touche « Continuer › ». « Abandonner » arrête l'état des lieux.`},{sel:`#eq-app [data-v^="veh|qui|"]`,titre:`Qui est là ?`,texte:`Le responsable est avec toi : il relit et valide tout de suite. Personne avec toi : tu fais tout et tu signes, un responsable valide ensuite.`},{titre:`Kilomètres et niveaux`,texte:`Le kilométrage, le carburant et les niveaux, puis les points d'état et les documents à bord.`},{titre:`Les photos`,texte:`Les photos imposées, puis chaque impact. Elles protègent la personne qui laisse le véhicule comme celle qui le prend.`},{titre:`Inventaire et cartes`,texte:`L'inventaire est pré-coché « présent » : ne touche que ce qui manque. Puis les cartes et dispositifs à bord.`},{titre:`Signer`,texte:`Relis le récapitulatif et signe au doigt. Un état des lieux laissé par quelqu'un d'autre : signe qu'il est exact, ou conteste.`},{titre:`Rien ne se perd`,texte:`Hors réseau, tout reste sur ce téléphone et part à la reconnexion ; une saisie interrompue se reprend depuis « À faire ».`}],equipe:[{titre:`Équipe`,texte:`L'entreprise : les personnes, les documents à signer, les infos. Tout le monde y a accès ; quelques lignes sont réservées aux RH, au bureau et à l'administrateur.`},{sel:`#eq-q`,titre:`L'équipe de ton chantier`,texte:`Intérimaire : tu vois les personnes de ton chantier. Touche une personne pour sa fiche et l'appeler.`,si:e=>Xc(e,`equipe`)&&Jc(`#eq-q`)&&!Jc(`#eq-app [data-act="xgo"][data-v="annu"]`)},{sel:`#eq-app [data-act="xgo"][data-v="annu"]`,titre:`Annuaire`,texte:`Toute l'entreprise par poste : fiche, téléphone, e-mail. Touche une personne pour l'appeler.`,si:rl(`#eq-app [data-act="xgo"][data-v="annu"]`)},{sel:`#eq-app [data-act="xgo"][data-v="docs"]`,titre:`Documents d'entreprise`,texte:`Règlement intérieur, notes de service, flash info sécurité, documents d'accueil des nouveaux : qui les a signés.`,si:rl(`#eq-app [data-act="xgo"][data-v="docs"]`)},{sel:`#eq-app [data-act="xgo"][data-v="info"]`,titre:`Communication interne`,texte:`Les infos publiées à tout le monde : actualités, résultats, événements. À lire, sans signature.`,si:rl(`#eq-app [data-act="xgo"][data-v="info"]`)},{sel:`#eq-app [data-act="xgo"][data-v="x:dob:ent"]`,titre:`Documents administratifs`,texte:`Assurances, Kbis, URSSAF, RIB, qualifications : déposés une fois, joints aux offres, avec une alerte avant échéance.`,si:rl(`#eq-app [data-act="xgo"][data-v="x:dob:ent"]`,e=>al(e)||Qc(e,`affaires.view`)||Qc(e,`dossier.edit`))},{sel:`#eq-app [data-act="xgo"][data-v="x:pack:imp"]`,titre:`Pack SCR`,texte:`Administrateur : le fichier privé de l'entreprise (catalogue du magasin, documents d'accueil, véhicules…), importé une fois.`,si:rl(`#eq-app [data-act="xgo"][data-v="x:pack:imp"]`,el)},{sel:`#eq-app [data-act="tabgo"][data-v="admin"]`,titre:`Administration`,texte:`Administrateur : comptes et accès, postes, qui peut quoi, options et modules. C'est l'écran Réglages.`,si:rl(`#eq-app [data-act="tabgo"][data-v="admin"]`,el)}],"equipe:annu":[{sel:`#eq-q`,titre:`Chercher quelqu'un`,texte:`Tape un nom ou un poste : la liste se filtre au fur et à mesure.`},{sel:`#eq-app .eq-filtres:has([data-act="ffam"]), #eq-app [data-act="ffam"]`,titre:`Par famille`,texte:`Toutes, Direction, Encadrement, Terrain, Support : touche une famille pour ne garder qu'elle.`},{sel:`#eq-app [data-chg="fSite"]`,titre:`Par chantier`,texte:`Choisis un chantier dans la liste : tu vois qui y travaille aujourd'hui.`},{sel:`#eq-app .eq-filtres:has([data-act="entvue"]), #eq-app [data-act="entvue"]`,titre:`Tenue de travail ou hors travail`,texte:`Les avatars en tenue de chantier ou en tenue perso : pratique pour mettre un visage sur un nom.`},{sel:`#eq-app .eq-pers`,titre:`La fiche et l'appel`,texte:`Touche une personne : sa fiche s'ouvre en bas — poste, chantier du jour, chef. « 📞 Appeler » ou « ✉️ E-mail » en un toucher.`},{titre:`Ce qui reste privé`,texte:`Domicile, contrat, compteurs d'heures : seuls les RH et l'encadrement concerné les voient. Ta fiche à toi est dans Compagnon (« Ta fiche »).`},{titre:`Ancienneté et médailles`,texte:`RH et direction : les paliers d'ancienneté des 6 prochains mois et les médailles du travail à vérifier, en haut de la liste.`,si:e=>Qc(e,`rh.voir`)}],"equipe:docs":[{sel:`#eq-app [data-act="xgo"][data-v="x:acc:admin"]`,titre:`📗 Accueil RH`,texte:`Le livret d'accueil, les documents d'accueil des nouveaux, le passeport de prévention : qui a signé, qui est en retard.`,si:e=>al(e)||Qc(e,`dossier.edit`)},{sel:`#eq-app [data-act="docadm"]`,titre:`Les documents`,texte:`Règlement intérieur, notes de service, flash info : pour chacun, qui doit signer et combien l'ont fait.`},{sel:`#eq-app [data-act="docadm"]`,titre:`Qui a signé ?`,texte:`Touche un document : chaque personne, ✓ avec la date ou « à signer ». « 🖨 Feuille des signatures » pour l'imprimer.`},{sel:`#eq-app [data-act="docnew"][data-v="note"]`,titre:`➕ Note de service`,texte:`Un PDF à dérouler en entier, ou un texte. Choisis qui doit la signer, puis « Publier — à lire et signer ».`,si:al},{sel:`#eq-app [data-act="docnew"][data-v="flash"]`,titre:`⚡ Flash info sécurité`,texte:`Toujours un PDF ; par défaut pour tous les postes exploitation et les intérimaires. Il arrive aussitôt « à lire et signer ».`,si:al},{sel:`#eq-app [data-act="doclate"], #eq-app .okbox`,titre:`À relancer`,texte:`Qui n'a pas signé, les retards d'abord. « 🖨 Liste des retardataires » pour les relancer sur le chantier.`,si:al},{titre:`Cibler, archiver`,texte:`Dans un document : « 👥 Qui doit signer ? » pour changer qui est concerné, « Archiver » quand il n'est plus à signer.`,si:al},{titre:`Et tes signatures ?`,texte:`Tes propres documents à signer sont dans Compagnon → Documents, avec leur date limite (7 jours).`}],"equipe:info":[{sel:`#eq-app .ac-row[data-act="docopen"], #eq-app .ac-empty`,titre:`Les infos de l'entreprise`,texte:`Actualités, résultats, événements, arrivées : la plus récente en haut, avec qui l'a publiée et quand.`},{sel:`#eq-app .ac-row[data-act="docopen"], #eq-app .ac-empty`,titre:`Lire une info`,texte:`Touche une info pour l'ouvrir en grand, avec son PDF s'il y en a un.`},{titre:`À lire, pas à signer`,texte:`Une info se lit, elle ne se signe pas. Ce qui doit être signé (note de service, flash info) passe par Documents d'entreprise.`},{sel:`#eq-app [data-act="infonew"]`,titre:`📣 Publier une info`,texte:`Un titre, le texte (un paragraphe par ligne), un PDF si besoin, puis « Publier » : tout le monde la voit.`,si:nl(`equipe:info`,`#eq-app [data-act="infonew"]`,al)}],"equipe:x:acc":[{sel:`#eq-app .eq-kpis`,titre:`Accueil RH en chiffres`,texte:`Documents d'accueil, lisibles, PDF à joindre, signatures en retard : un chiffre rouge est à traiter.`},{sel:`#eq-app [data-v="acc|pick|pack"]`,titre:`1. Importer le pack`,texte:`Administrateur : le fichier privé de l'entreprise (documents, livrets, passeport). Le réimporter met à jour, sans doublon.`,si:nl(`equipe:x:acc`,`#eq-app [data-v="acc|pick|pack"]`,el)},{sel:`#eq-app [data-v="acc|pick|pdfs"]`,titre:`2. Joindre les PDF`,texte:`Plusieurs PDF d'un coup : chacun va au document qui porte son nom, et part aussitôt « à lire et signer ».`,si:nl(`equipe:x:acc`,`#eq-app [data-v="acc|pick|pdfs"]`,el)},{titre:`La carte de bienvenue`,texte:`Un nouveau compte voit en tête de son accueil « Bienvenue », ses documents à signer sous 7 jours et « Commencer ». Rien ne bloque son accès.`},{sel:`#eq-app .acc-drow, #eq-app .ac-empty`,titre:`Les documents d'accueil`,texte:`Pour chacun : texte ou PDF, qui doit signer, combien l'ont fait. Touche-le pour la liste des signatures.`},{titre:`Retards et passeport`,texte:`« En retard » liste qui n'a pas signé à temps. Plus bas : le passeport de prévention, formation par formation.`}],"equipe:x:dob":[{sel:`#eq-app .eq-kpis`,titre:`Les pièces en chiffres`,texte:`Combien sont valides, à renouveler (30 jours ou moins), expirées ou encore à déposer.`},{sel:`#eq-app .dob-erow`,titre:`Une pièce par ligne`,texte:`Attestations RC et décennale, Kbis, URSSAF, attestation fiscale, RIB, qualifications : leur validité et leur état.`},{sel:`#eq-app .dob-erow [data-v^="dob|edit|"]`,titre:`📎 Déposer`,texte:`Choisis le fichier et sa date « Valide jusqu'au » (assureur et police pour une assurance), puis « Enregistrer ».`,si:nl(`equipe:x:dob`,`#eq-app .dob-erow [data-v^="dob|edit|"]`,e=>el()||Qc(e,`affaires.edit`))},{titre:`Les couleurs`,texte:`Vert : valide ; orange : expire sous 30 jours (une alerte arrive dans « À faire ») ; rouge : expiré, « 📎 Remplacer » passe en premier.`},{titre:`Joints aux offres`,texte:`Déposés une fois, ils sont repris dans les offres. Une même attestation peut couvrir RC et décennale : un seul document.`},{sel:`#eq-app [data-v="dob|new|"]`,titre:`＋ Autre document`,texte:`Un RIB de plus, une carte CIBTP, la liste des salariés étrangers… : ajoute-le à la liste.`,si:nl(`equipe:x:dob`,`#eq-app [data-v="dob|new|"]`,e=>el()||Qc(e,`affaires.edit`))}],"equipe:x:pack":[{sel:`#eq-app h2.vt + .card, #eq-app h2.vt`,titre:`Pourquoi un pack`,texte:`Le site de l'appli est public : rien de confidentiel dans son code. Les données privées de l'entreprise arrivent par ce fichier.`},{sel:`#eq-app label.btn:has([data-xin="pack|file"]), #eq-app label.btn.primary`,titre:`1 · Choisir le fichier`,texte:`« 📂 Choisir le pack (.json) » : le fichier privé, gardé sur ton ordinateur.`},{titre:`2 · Ce qui sera importé`,texte:`Les parties trouvées (magasin, accueil, véhicules, mémoire technique…) : décoche ce que tu ne veux pas, puis « ⬆ Importer ».`},{titre:`Le résultat`,texte:`Une ligne par partie, verte si c'est passé. Réimporter met à jour sans doublon : signatures et stock gardent leur historique.`},{titre:`Hors réseau`,texte:`Les écritures partent au serveur ; sans réseau, elles attendent sur cet appareil et partent à son retour.`}],reglages:[{titre:`Réglages`,texte:`L'écran de l'administrateur : qui a accès à Tracé, avec quels droits, quelles options et quels modules.`},{sel:`#homeBody .admNav [data-av="people"]`,titre:`👥 Personnes`,texte:`Chaque compte : poste, type, chantiers 🏗, droits 🔑, Socle ou 🧪 Labo, actif ou non. ★ = administrateur.`},{sel:`#admNew, #homeBody .admNav [data-av="people"]`,titre:`➕ Créer un accès`,texte:`Prénom, nom, e-mail, poste, type, puis « Créer l'accès ». 1re connexion : donne le « 🔐 Code de 1re connexion » de sa carte ; la personne choisit son mot de passe.`},{sel:`#homeBody .admNav [data-av="postes"]`,titre:`🧩 Postes`,texte:`Les droits d'un poste valent pour toutes ses personnes (sauf ajustement 🔑). Coche, décoche : c'est enregistré tout de suite.`},{sel:`#homeBody .admNav [data-av="who"]`,titre:`🔎 Qui peut quoi ?`,texte:`Choisis un droit : tu vois qui l'a et pourquoi (poste, ajustement personnel, administrateur).`},{sel:`#homeBody .admNav [data-av="options"]`,titre:`🧪 Options`,texte:`Les options rangées par module : Socle (tout le monde) ou 🧪 Labo (les testeurs). Désigne les testeurs, toi compris.`},{sel:`#homeBody .admPalBan, #homeBody .admNav [data-av="options"]`,titre:`⏻ Les paliers`,texte:`Éteints : tout le monde voit tout. Allumés : chacun ne voit que son palier — passe-toi en 🧪 Labo avant d'allumer.`},{sel:`#homeBody .admNav [data-av="entreprise"]`,titre:`🏢 Entreprise et modules`,texte:`Le logo et le nom en haut à droite, chez tout le monde. Plus bas, les modules pris : un module décoché disparaît partout.`},{sel:`#homeBody .admNav [data-av="sandbox"]`,titre:`🧪 Bac à sable`,texte:`Un chantier et des personnages de démo pour tester sans rien envoyer au serveur. « Retirer » efface tout d'un coup.`}]},cl=e=>String(e).replace(/ ([:;?!»])/g,`\xA0$1`).replace(/« /g,`«\xA0`);Object.values(sl).forEach(e=>e.forEach(e=>{e.titre=cl(e.titre),e.texte=cl(e.texte)}));var ll=()=>typeof document<`u`?document:null,ul=e=>{try{let t=ll();return!!(t&&t.querySelector(e))}catch{return!0}},dl=(e,t)=>{try{return!!(e&&e.where&&e.where()===t)}catch{return!1}},fl=(e,t)=>!e||!e.can||!!e.can(t),pl=(e,t)=>!!(e&&e.can&&!e.can(t)),ml=(e,t)=>!e||!e.feat||!!e.feat(t),hl=(e,t,n)=>r=>dl(r,e)?ul(t):!n||!!n(r),F=e=>`#eq-app [data-act="xgo"][data-v="${e}"]`,gl=e=>fl(e,`planning.edit`)||fl(e,`affaires.edit`)||fl(e,`mag.manage`),_l={"pilotage:plan":`Planning de la semaine`,"pilotage:orga":`Planning des équipes`,"pilotage:obj":`Objectifs des équipes`,"pilotage:agenda":`Ma semaine`,"pilot
