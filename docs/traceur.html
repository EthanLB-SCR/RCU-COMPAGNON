gasin`))},{sel:`#eq-app [data-act="x"][data-v="veh|gomouv|"]`,titre:`Véhicules : mouvements`,texte:`Qui a quel véhicule, états des lieux et signatures attendus, contestations : le fil des déclarations.`,si:hl(`pilotage`,`#eq-app [data-v="veh|gomouv|"]`,e=>ml(e,`parc`)&&fl(e,`flotte.manage`))},{sel:F(`x:dem:file`),titre:`Demandes de matériel`,texte:`Les demandes des équipes pour leurs chantiers : « Commandé », puis « Livré / remis ». Elles suivent l'état sur leur téléphone.`,si:hl(`pilotage`,F(`x:dem:file`),e=>ml(e,`demandes`)&&gl(e))},{sel:F(`qhs`),titre:`Quart d'heure sécurité`,texte:`Déclenche un sujet du jour sur un chantier ou sur tous : chacun le fait et le signe sur son téléphone.`,si:hl(`pilotage`,F(`qhs`),e=>fl(e,`qse.manage`))},{sel:F(`controles`),titre:`Contrôles chantier`,texte:`Qui contrôle, à quelle fréquence, où ça traîne, les NC ouvertes. Objectif : un contrôle par chantier actif toutes les 2 semaines.`,si:hl(`pilotage`,F(`controles`),e=>fl(e,`qse.manage`))},{sel:F(`accident`),titre:`Déclarer un accident`,texte:`Accident, presque-accident ou soin bénin : qui, où, quand, circonstances, photos. La RH est prévenue.`,si:hl(`pilotage`,F(`accident`),e=>ml(e,`accident`))},{sel:F(`habsEq`),titre:`Habilitations de l'équipe`,texte:`Les échéances de l'équipe triées par urgence : expirées, à renouveler bientôt, manquantes.`,si:hl(`pilotage`,F(`habsEq`))}],"pilotage:plan":[{sel:`#eq-app .pi-sum`,titre:`Où en est la semaine`,texte:`Combien de personnes sont placées toute la semaine, et les jours encore à pourvoir (en rouge). Les jours fériés sont signalés.`},{sel:`#eq-app .eq-wknav`,titre:`Change de semaine`,texte:`Touche ‹ ou ›, ou glisse le bandeau des jours ; les points sous un jour comptent les personnes placées. Le menu des secteurs filtre l'écran.`},{sel:`#eq-app [data-act="pi"][data-v="open|"]`,titre:`＋ Placer, en 3 touchers`,texte:`1 qui, 2 sur quel chantier, 3 quels jours (ses jours libres sont cochés), l'équipe si tu veux, puis « Placer ». La personne voit « Demain : chantier » dans Compagnon.`},{sel:`#eq-app [data-act="pi"][data-v="copy|"]`,titre:`Copier la semaine dernière`,texte:`Reprend la semaine passée des personnes pas encore placées : mêmes chantiers, mêmes équipes, fériés sautés.`},{sel:`#eq-app .pi-bar [data-act="xgo"][data-v="orga"]`,titre:`⚙ Plus d'options`,texte:`Le planning détaillé : secteurs, équipes A à J, glisser-déposer, nouvelle personne, fiche du chantier, météo.`},{sel:`#eq-app .pi-tray`,titre:`À placer`,texte:`Les personnes qui ont encore des jours libres, les plus libres d'abord. Touche une personne (ou 👥 une équipe de la semaine passée), puis le chantier.`},{sel:`#eq-app .pi-site:not(details *) [data-act="pi"][data-v^="edit|"], #eq-app .pi-site:not(details *) [data-act="pi"][data-v^="here|"]`,titre:`Modifier une personne`,texte:`Touche sa ligne sur la carte du chantier : change ses jours ou son équipe, ou « Retirer de ce chantier ». « ＋ Placer quelqu'un ici » part du chantier.`},{sel:`#eq-app .pi-leg`,titre:`Les repères`,texte:`● sur ce chantier · « Abc » sur un autre chantier · ⚠ deux chantiers le même jour · F férié · — hors contrat.`}],"pilotage:orga":[{sel:`#eq-app .pi-bar [data-act="xgo"][data-v="plan"]`,titre:`Le planning détaillé`,texte:`Pour les placements fins : secteurs, équipes A à J, glisser-déposer, fiche du chantier. « ↩ Planning simplifié » revient à l'écran en 3 touchers.`,si:e=>fl(e,`planning.edit`)&&ml(e,`planning_simple`)},{titre:`Planning des équipes`,texte:`Place les équipes semaine par semaine : secteurs, équipes A à J, glisser-déposer, fiche du chantier.`,si:e=>fl(e,`planning.edit`)&&!ml(e,`planning_simple`)},{sel:`#eq-app .eq-wknav`,titre:`Semaine et secteur`,texte:`‹ › ou glisse le bandeau pour changer de semaine. Choisis le secteur : la jauge dit combien sont placés toute la semaine.`,si:e=>fl(e,`planning.edit`)},{sel:`#eq-app [data-act="plcopy"]`,titre:`Reprendre la semaine passée`,texte:`Recopie la semaine d'avant en un toucher, puis ajuste. « Avec l'encadrement » ajoute les chefs et les conducteurs à placer.`,si:e=>fl(e,`planning.edit`)},{sel:`#eq-app [data-act="meteo"]`,titre:`☀ Météo`,texte:`Recharge la météo des chantiers : elle s'affiche jour par jour sur chaque carte et habille les avatars de l'équipe.`,si:e=>fl(e,`planning.edit`)},{sel:`#eq-app #pl-tray, #eq-app .eq-pltray`,titre:`À placer`,texte:`Cherche par nom, filtre par métier (Soudeurs, Manchonneurs…). « ＋ Nouvelle personne (intérimaire, embauche) » : elle se place tout de suite.`,si:e=>fl(e,`planning.edit`)},{sel:`#eq-app .eq-plsite:not(details *)`,titre:`Placer sur un chantier`,texte:`Touche une personne puis le chantier (ou glisse-la dessus), choisis l'équipe, « Placer … ici ». Touche une personne placée pour régler ses jours.`,si:e=>fl(e,`planning.edit`)},{sel:`#eq-app .eq-plsite:not(details *) .eq-plfd > summary`,titre:`⚙ La fiche du chantier`,texte:`Sous le nom : secteur, chef, conducteur, horaires et point de rassemblement. Ils servent à l'accueil chantier et aux pointages.`,si:e=>fl(e,`planning.edit`)},{titre:`Ce que voient les équipes`,texte:`Chacun n'ouvre dans l'appli que les chantiers de sa semaine et de la précédente. Le chef de chantier voit son planning dans Pilotage.`,si:e=>fl(e,`planning.edit`)},{sel:`#eq-app [data-act="plansem"]`,titre:`Ta semaine`,texte:`« Cette semaine » ou « Semaine prochaine » : ton planning, tel que ton conducteur l'a fait.`,si:e=>pl(e,`planning.edit`)},{sel:`#eq-app .eq-semaine`,titre:`Jour par jour`,texte:`Chaque jour : la météo et ta tenue. Touche un jour pour voir son détail dessous.`,si:e=>pl(e,`planning.edit`)},{sel:`#eq-app .eq-cols.eq-2`,titre:`Ton chantier, ton équipe`,texte:`Le chantier du jour, qui est avec toi, le chef et le conducteur ; à côté, tes chantiers de la semaine.`,si:e=>pl(e,`planning.edit`)},{titre:`Un changement ?`,texte:`Le planning se fait par le conducteur : signale-lui un oubli ou un changement. Ton équipe retrouve le sien dans Compagnon → Planning.`,si:e=>pl(e,`planning.edit`)}],"pilotage:obj":[{sel:`#eq-app .eq-nav`,titre:`Choisis la semaine`,texte:`Semaine passée, cette semaine, semaine prochaine, ou ◀ ▶. Un objectif se prépare à l'avance : la semaine prochaine est souvent la bonne.`},{sel:`#eq-app [data-act="objday"].active, #eq-app [data-act="objday"]`,titre:`Puis le jour`,texte:`Touche un jour : le chiffre à côté compte ses objectifs. Chaque chantier montre l'équipe placée ce jour-là.`},{sel:`#eq-app .eq-objsite`,titre:`Un chantier, ses équipes`,texte:`Les équipes du planning (A, B…) avec leurs personnes, les objectifs déjà posés et les heures estimées face aux heures d'équipe.`},{sel:`#eq-app [data-act="objadd"]`,titre:`➕ Objectif`,texte:`Type, heures estimées, mission, jours (plusieurs jours cochés = la semaine planifiée) et pour qui. Puis « Poser l'objectif ».`},{sel:`#eq-app [data-act="objplan"], #eq-app [data-act="objadd"]`,titre:`📐 Poser sur le plan`,texte:`Touche des soudures une à une, ou la conduite au début puis à la fin du tronçon : l'équipe le voit en surbrillance 🎯 sur son plan.`},{sel:`#eq-app [data-act="objdone"], #eq-app .eq-objrow, #eq-app .eq-objnone`,titre:`Faite ou pas`,texte:`Sur la mission : ✓ faite, ↩ pas faite, ✕ retirer ; 🗺 la montre sur le plan.`},{titre:`Ce que voit l'équipe`,texte:`L'équipe voit l'objectif sur son accueil et en surbrillance 🎯 sur le plan du chantier. Ce n'est pas un plafond : c'est un repère partagé.`}],"pilotage:agenda":[{sel:`#eq-app [data-chg="agWho"]`,titre:`La semaine de ton équipe`,texte:`Choisis quelqu'un qui dépend de toi pour voir sa semaine, en lecture seule.`,si:()=>ul(`#eq-app [data-chg="agWho"]`)},{sel:`#eq-app .eq-wknav`,titre:`Ta semaine`,texte:`‹ › ou glisse pour changer de semaine ; touche un jour pour y aller. Les points comptent tes rendez-vous et tes chantiers.`},{sel:`#eq-app [data-act="aglink"], #eq-app [data-act="agsync"]`,titre:`Relié à Outlook`,texte:`Colle le lien ICS de ton calendrier Outlook publié : ta semaine se remplit toute seule. « ⟳ Synchroniser maintenant » pour forcer.`},{sel:`#eq-app [data-act="agics"]`,titre:`Vers Outlook`,texte:`« ⬇ Exporter la semaine » crée un fichier .ics pour Outlook, Google Agenda ou l'iPhone ; « → Outlook » sur une ligne pour un seul rendez-vous.`},{sel:`#eq-app .eq-agday [data-act="agnew"]`,titre:`＋ Ajouter`,texte:`＋ sur un jour : visite de chantier, réunion, rendez-vous… avec le chantier, les heures et une note. « Ajouter » et c'est dans ta semaine.`},{sel:`#eq-app .eq-agday`,titre:`Tes chantiers du jour`,texte:`Chaque jour rappelle tes chantiers du planning (📍). Sur un rendez-vous lié à un chantier, › ouvre son bureau.`}],"pilotage:valid":[{sel:`#eq-app [data-act="valmode"]`,titre:`Par jour ou par personne`,texte:`« Par jour » : toute l'équipe d'un jour. « Par personne » : la semaine d'une personne, à valider d'un coup.`},{sel:`#eq-app [data-act="valjour"].active, #eq-app [data-act="valpers"].active, #eq-app [data-act="valjour"]`,titre:`Choisis le jour`,texte:`Le chiffre sur un jour : pointages à valider ; en rouge : quelqu'un de placé n'a rien pointé. Le lundi, le vendredi d'avant est proposé.`},{sel:`#eq-app [data-act="toutvalider"]`,titre:`✅ Tout valider`,texte:`Valide d'un coup les journées complètes et cohérentes. Fin manquante, pas de pause, plus de 12 h : ces lignes se traitent à part.`},{sel:`#eq-app .eq-vrow`,titre:`Une journée`,texte:`Début → fin, pause, objectif et production du jour, et l'état. « ⚠ aucune fiche de soudure ce jour-là » : vérifie avant de valider.`},{sel:`#eq-app [data-act="corr"]`,titre:`✏️ Corriger`,texte:`Quoi corriger (début, pause, reprise, fin), l'heure et le motif : la plus probable est proposée. La personne voit « Pointage corrigé » et par qui.`},{sel:`#eq-app [data-act="pi"][data-v^="saisie|"]`,titre:`Pas de pointage`,texte:`Quelqu'un de placé n'a rien pointé : « ✏️ Saisir ses heures » avec un motif. La journée est enregistrée et validée à ton niveau.`,si:()=>ul(`#eq-app [data-act="pi"][data-v^="saisie|"]`)},{titre:`Qui valide quoi`,texte:`Le chef de chantier valide d'abord, puis le conducteur : les heures deviennent définitives pour la paie. La personne suit chaque étape dans Compagnon → Heures.`}],"pilotage:prodEq":[{sel:`#eq-app .eq-wknav`,titre:`Choisis la semaine`,texte:`‹ › ou glisse le bandeau des jours. Les points sous un jour : les personnes placées sur tes chantiers.`},{sel:`#eq-app .pi-pm`,titre:`Semaine ou jour`,texte:`« Semaine » additionne les jours passés ; « Jour » en montre un seul, à choisir dans la rangée.`,si:e=>ml(e,`prod_tableau`)},{sel:`#eq-app [data-act="pi"][data-v="print|"]`,titre:`🖨 Imprimer (A4)`,texte:`Une feuille A4 par chantier et par équipe, avec le détail par personne, à afficher ou à envoyer.`,si:e=>ml(e,`prod_tableau`)},{sel:`#eq-app .pi-scope`,titre:`Chantiers comptés`,texte:`✓ compté, ✗ pas chargé sur cet appareil : ouvre-le une fois (« Ouvrir … »), puis reviens ici pour qu'il compte.`,si:e=>ml(e,`prod_tableau`)},{sel:`#eq-app .pi-tab`,titre:`Le tableau par équipe`,texte:`Par chantier et par équipe : soudures, manchons, ml, heures pointées. La barre compare à l'objectif posé 🎯, sinon à la meilleure équipe.`,si:e=>ml(e,`prod_tableau`)},{sel:`#eq-app .eq-peteam`,titre:`Détail par personne`,texte:`Heures, production et soudures par heure de chacun. Le tuyauteur ne s'additionne pas : c'est la production de son soudeur.`},{titre:`D'où viennent les chiffres`,texte:`Production : les fiches de soudure signées au nom de chacun, le jour où la personne est placée sur le chantier. Heures : les pointages.`}],"pilotage:rapport":[{sel:`#eq-app [data-act="rpweek"]`,titre:`Choisis la semaine`,texte:`S-2, Semaine dernière ou Cette semaine : les heures telles qu'elles partent en paie, rien d'autre.`},{sel:`#eq-app .ac-stats`,titre:`Où en sont les heures`,texte:`Pointées, définitives (conducteur), validées chef en attente, à valider ; en rouge, les jours planifiés sans pointage.`},{sel:`#eq-app table.af-tab`,titre:`Une ligne par personne`,texte:`Jours, heures pointées, définitives, chef, à valider, pauses et cas de grand déplacement (GD) de la semaine.`},{sel:`#eq-app [data-act="rpcsv"][data-v="paie"]`,titre:`⬇ Variables de paie`,texte:`Le fichier CSV jour par jour pour la RH : heures, statut, qui a validé, objectifs, production, grand déplacement.`},{sel:`#eq-app [data-act="rpcsv"][data-v="semaine"]`,titre:`⬇ Rapport de la semaine`,texte:`Le récapitulatif par personne, en CSV, à ouvrir dans Excel.`},{titre:`Avant d'envoyer`,texte:`Tout doit être « définitif » : sinon, relance la validation dans Pointages à valider. Une pause non pointée n'est jamais déduite.`}],"pilotage:gd":[{sel:`#eq-app [data-act="gdmode"]`,titre:`Par semaine ou par personne`,texte:`« 🗓 Par semaine » : toute l'équipe. « 👤 Par personne · mois » : le calendrier d'une personne, nuitées et repas jour par jour.`},{sel:`#eq-app [data-gdaddr] > summary, #eq-app .okbox`,titre:`Les adresses`,texte:`Le cas se calcule depuis l'adresse de chacun. « 📍 Adresses à vérifier » : sans adresse localisée, pas de calcul.`},{sel:`#eq-app .eq-wknav`,titre:`Choisis la semaine`,texte:`‹ › ou glisse le bandeau. Le cycle se lit sur les semaines d'avant du planning.`},{sel:`#eq-app .ac-stats`,titre:`La semaine en chiffres`,texte:`Planifiés, en grand déplacement, nuitées, repas, indemnités de trajet et semaines déjà accordées.`},{sel:`#eq-app [data-act="gdaccall"], #eq-app [data-act="gdacc"], #eq-app [data-act="gdpers"]`,titre:`✓ Accorder`,texte:`Accorder fige la semaine (chantiers, cas, nuitées, repas, indemnités) : c'est l'historique de paie, même si le planning change ensuite.`},{sel:`#eq-app [data-act="gdx"], #eq-app [data-act="gdpers"]`,titre:`Détente et exception`,texte:`La détente tombe seule selon le cycle (cas 3 : une semaine sur 2, cas 4 : une sur 4). 🏠 ou ✗ seulement si la réalité diffère.`},{sel:`#eq-app [data-act="gdpers"]`,titre:`Le mois d'une personne`,texte:`Touche un nom : son mois jour par jour, accordé (vert) ou calculé à accorder (orange). Un jour se corrige à la main.`},{titre:`Les règles`,texte:`Les cas 1 à 4 du livret d'accueil et les tableaux jour par jour sont en bas de l'écran. Le livret déposé ici est aussi dans Compagnon → Heures.`}],"pilotage:cpt":[{sel:`#eq-app .eq-kpis`,titre:`Les compteurs en bref`,texte:`Qui a un compteur, le total d'heures dedans, les compteurs pleins, les heures à reporter et les cas forcés.`},{sel:`#eq-app .cpt-imp > summary`,titre:`⬆ Importer le compteur existant`,texte:`Colle le tableau de ton classeur (ou dépose le fichier), vérifie l'aperçu, importe : les soldes deviennent le point de départ.`,si:e=>fl(e,`rh.edit`)},{sel:`#eq-app .cpt-tab`,titre:`Une ligne par personne`,texte:`Contrat, compteur (solde, plafond et jauge), heures à reporter, déplacement : cas forcé ou selon la distance.`},{sel:`#eq-app .cpt-tab [data-act="fiche"], #eq-app .cpt-tab tr[data-pid]`,titre:`Fiche`,texte:`Au bout de la ligne : contrat, plafond, repos, posé par l'entreprise, prime, replacer, cas forcé. Les RH modifient ; gérant et direction lisent.`},{sel:`#eq-app [data-act="cptxls"]`,titre:`⬇ Tableau Excel`,texte:`Les soldes arrêtés à la fin de la navette du mois, prêts pour la paie.`},{titre:`Comment ça compte`,texte:`Chaque semaine finie, les heures sup entrent majorées jusqu'au plafond ; le surplus est payé sur la navette.`}],"pilotage:annul":[{titre:`Pourquoi ces demandes`,texte:`Chacun annule ses propres erreurs, dans la limite de ses crédits de la semaine. Au-delà, sa demande arrive ici.`},{sel:`#eq-app [data-act="opensite"][data-v$="|conv"], #eq-app .ac-empty`,titre:`Une demande`,texte:`Qui demande, quelle soudure, sur quel chantier et pourquoi. Touche-la : la conversation du chantier s'ouvre.`},{titre:`Tu tranches`,texte:`Dans la conversation : « ✓ Valider » (étape annulée ou soudure retirée), « ＋ Redonner 1 crédit », ou refuser avec un motif. Tout est journalisé.`},{titre:`Sur cet appareil`,texte:`La liste lit les chantiers ouverts sur cet appareil : un chantier jamais ouvert ici n'y apparaît pas.`}],"pilotage:x:mag":[{sel:`#eq-app .mag-kp`,titre:`Les commandes de l'équipe`,texte:`Prêtes au dépôt, en attente, en préparation, reliquats à venir : ce que ton équipe a demandé au magasin.`},{sel:`#eq-app .mag-row, #eq-app .ac-empty`,titre:`Par personne`,texte:`Les demandes en cours de chacun, les plus anciennes d'abord. Touche une demande pour voir ses articles.`},{titre:`Qui fait quoi`,texte:`Lecture seule : le magasin prépare et remet, la personne suit l'état dans Compagnon → Magasin. Toi, tu sais qui doit passer au dépôt.`}],"pilotage:x:dem":[{sel:`#eq-app .dm-kp`,titre:`Ce qui attend`,texte:`À traiter, urgentes, commandées (et en retard), livrées en partie. Les demandes arrivent des téléphones : Compagnon → Mes demandes.`},{sel:`#eq-app [data-xin="dem|fsite"]`,titre:`Un chantier`,texte:`Filtre la liste sur un seul chantier.`,si:()=>ul(`#eq-app [data-xin="dem|fsite"]`)},{sel:`#eq-app .dm-row`,titre:`Ouvrir une demande`,texte:`Qui, quel chantier, les articles et les quantités, la note et les photos. ⚡ urgent : à traiter en premier.`},{sel:`#eq-app [data-act="x"][data-v^="dem|cmd|"], #eq-app .dm-row`,titre:`🛒 Commandé`,texte:`Indique le fournisseur et la livraison prévue ; tu peux préparer un bon de commande pré-rempli (Affaire → Bons de commande).`},{sel:`#eq-app [data-act="x"][data-v^="dem|liv|"], #eq-app .dm-row`,titre:`📦 Livré / remis`,texte:`La date, à qui, et ce qui est remis : en partie si tout n'est pas là, le reste suit. « Refuser » demande un motif.`},{sel:`#eq-app .dm-fold`,titre:`Les demandes finies`,texte:`Livrées, refusées, annulées : rangées en bas, touche pour les revoir.`,si:()=>ul(`#eq-app .dm-fold`)},{titre:`Ce que voit l'équipe`,texte:`Chaque état (commandé, livré, refusé) arrive sur le téléphone de la personne. Aucun stock ici : tu commandes, tu fais livrer.`}],"pilotage:secu":[{sel:`#eq-app .eq-kpis`,titre:`Sécurité`,texte:`Quarts d'heure du jour, contrôles en retard, NC ouvertes, accidents à traiter : ce qui demande ton attention.`},{sel:F(`qhs`),titre:`Quart d'heure sécurité`,texte:`Déclenche un sujet du jour : chacun le fait et le signe sur son téléphone.`,si:hl(`pilotage:secu`,F(`qhs`),e=>fl(e,`qse.manage`))},{sel:F(`controles`),titre:`Contrôles chantier`,texte:`Qui contrôle, à quelle fréquence, où ça traîne : un contrôle par chantier actif toutes les 2 semaines.`,si:hl(`pilotage:secu`,F(`controles`),e=>fl(e,`qse.manage`))},{sel:F(`accident`),titre:`Déclarer un accident`,texte:`Accident, presque-accident ou soin bénin, avec photos : la RH est prévenue.`,si:hl(`pilotage:secu`,F(`accident`),e=>ml(e,`accident`))},{sel:F(`habsEq`),titre:`Habilitations de l'équipe`,texte:`Les échéances triées par urgence, pour programmer les recyclages à temps.`,si:hl(`pilotage:secu`,F(`habsEq`))},{titre:`Aussi dans le chantier`,texte:`Contrôles, quarts d'heure et accidents se font aussi sur place, dans l'onglet QSE du chantier. La même section est dans Pilotage.`}],"pilotage:qhs":[{titre:`Un quart d'heure sécurité`,texte:`Un sujet à dérouler en entier, un quiz vrai / faux, « je m'engage » signé au doigt, puis le retour et la signature de l'animateur.`},{sel:`#eq-app [data-act="qhsnew"]`,titre:`⛑️ Déclencher`,texte:`Choisis le sujet (les 12 quarts d'heure SCR), le jour et où : tes chantiers ou tous. Un mot pour l'équipe si tu veux.`},{titre:`Ce que voit l'équipe`,texte:`Toutes les personnes placées sur le chantier ce jour-là, chefs compris, le trouvent sur leur accueil et dans l'onglet QSE, et le font sur leur téléphone.`},{titre:`Clore la séance`,texte:`Dans l'onglet QSE du chantier : « ✍️ Retour & signature animateur ». Une personne sans compte (intérim) : « 👤 Faire participer quelqu'un sans compte ».`},{sel:`#eq-app table.rc, #eq-app .ac-empty`,titre:`Le suivi`,texte:`Les 40 derniers : date, sujet, où, qui l'a déclenché et le nombre de participations.`}],"pilotage:controles":[{titre:`Contrôles chantier`,texte:`Objectif : un contrôle par chantier actif toutes les 2 semaines. Le contrôle se fait sur place, dans l'onglet QSE du chantier.`},{sel:`#eq-app table.rc, #eq-app .ac-empty`,titre:`Par encadrant, par chantier`,texte:`Par encadrant : contrôles sur 4 et 12 semaines, NC relevées. Par chantier actif : les jours depuis le dernier contrôle, en rouge au-delà de 14.`},{sel:`#eq-app [data-act="ctopen"]`,titre:`Derniers contrôles`,texte:`✗ NC encore ouvertes, ✓ toutes levées. Touche un contrôle pour ouvrir son rapport.`,si:()=>ul(`#eq-app [data-act="ctopen"]`)},{titre:`Chantier actif`,texte:`Un chantier est actif quand du monde y est placé cette semaine (ou qu'il a déjà été contrôlé). Les présents sont repris du planning.`}],"pilotage:accident":[{sel:`#eq-app [data-act="accnew"]`,titre:`⚠ Déclarer`,texte:`Tout de suite, même incomplet : la RH complète. Un presque-accident se déclare aussi, c'est ce qui évite le suivant.`},{titre:`Le formulaire`,texte:`Quoi (accident, presque-accident, soin, trajet), date et heure, chantier et lieu, qui, ce qui s'est passé, lésion, soins, témoins, arrêt.`},{titre:`📷 Les photos`,texte:`Le lieu et le matériel, jamais la personne. Puis « Déclarer — la RH est prévenue ».`},{sel:`#eq-app .card .ac-h, #eq-app .ac-empty`,titre:`Le suivi`,texte:`Chaque déclaration : « à traiter » (bord rouge) ou ✓ traitée, avec qui l'a déclarée et quand.`},{sel:`#eq-app [data-act="acctraite"]`,titre:`✓ Traité`,texte:`La RH ou la QSE marque « Traité » quand la déclaration CPAM et le dossier sont faits.`,si:e=>fl(e,`qse.manage`)&&ul(`#eq-app [data-act="acctraite"]`)},{titre:`Depuis le chantier`,texte:`Sur le terrain, chacun peut déclarer depuis l'onglet QSE du chantier : le formulaire s'ouvre directement.`}],"pilotage:habsEq":[{sel:`#eq-app [data-act="habf"]`,titre:`Filtre par urgence`,texte:`À traiter, Expirées, Moins de 90 j, Absentes, Toutes : le chiffre dit combien.`},{sel:`#eq-app button.eq-trow`,titre:`Une habilitation`,texte:`Personne, habilitation (n°, 📎 pièce, 📷 photo), échéance et état : expirée en rouge, bientôt en orange. Touche la ligne : sa fiche s'ouvre.`},{titre:`Ce que voit chacun`,texte:`Chacun retrouve ses propres habilitations et leurs échéances dans Compagnon → Passeport.`}],affaire:[{titre:`Affaire`,texte:`Le suivi financier des chantiers : bons de commande, notes de frais, comptes. Pour le conducteur, le bureau et la direction.`},{sel:F(`cmd`),titre:`Bons de commande`,texte:`Les commandes fournisseurs : fournisseur, objet, affaire, type de dépense, lignes, et un bon imprimable.`,si:hl(`affaire`,F(`cmd`))},{sel:F(`frais`),titre:`Notes de frais à valider`,texte:`Les dépenses avancées par les équipes : valider, refuser, puis « remboursé ». Chacun saisit les siennes dans Compagnon.`,si:hl(`affaire`,F(`frais`),e=>ml(e,`frais`))},{sel:F(`comptes`),titre:`Comptes chantier`,texte:`Tous les chantiers d'un coup d'œil : chiffré, facturé, heures, dépenses et résultat indicatif.`,si:hl(`affaire`,F(`comptes`))},{sel:F(`x:cc:`),titre:`Compte d'un chantier`,texte:`Un chantier en détail : heures par poste, bons, dépenses, totaux. Imprimable, sans compta.`,si:hl(`affaire`,F(`x:cc:`),e=>ml(e,`comptechantier`))}],"affaire:cmd":[{sel:`#eq-app [data-act="cmd"][data-v="tab|cmd"]`,titre:`Trois volets`,texte:`Bons de commande, Notes de frais, Comptes chantier : touche une puce pour passer de l'un à l'autre.`},{sel:`#eq-app [data-act="cmd"][data-v="new|"]`,titre:`➕ Bon de commande`,texte:`Crée un bon en brouillon, numéroté tout seul, et l'ouvre pour le remplir.`},{sel:`#eq-app [data-cmdf="fournisseur"], #eq-app [data-act="cmd"][data-v^="open|"]`,titre:`Remplir le bon`,texte:`Dans le bon (touche-le pour l'ouvrir) : fournisseur, objet, n° d'affaire ou chantier au minimum. Le type de dépense le raccroche au chiffrage ; une location a un début et une fin.`},{sel:`#eq-app [data-cmdf="etat"], #eq-app [data-act="cmd"][data-v^="etat|"]`,titre:`L'état du bon`,texte:`Brouillon → Envoyée → Reçue → Facturée, ou Annulée : le menu « État » du bon. Dans la liste, les puces d'état filtrent les bons.`},{sel:`#eq-app [data-act="cmd"][data-v="ladd|"], #eq-app [data-act="cmd"][data-v^="open|"]`,titre:`Les lignes`,texte:`Dans le bon : désignation, quantité, unité, prix unitaire HT ; le total se calcule. « ➕ Ligne » pour en ajouter une.`},{sel:`#eq-app [data-act="cmd"][data-v="print|"], #eq-app [data-act="cmd"][data-v^="open|"]`,titre:`🖨 Bon de commande`,texte:`Dans le bon : le bon en A4 pour le fournisseur. Livraison à l'adresse du chantier, avec bon de livraison.`},{titre:`Où ça compte`,texte:`Les bons envoyés, reçus et facturés entrent dans le compte du chantier ; un brouillon ne compte pas.`}],"affaire:frais":[{sel:`#eq-app [data-act="cmd"][data-v="tab|db"]`,titre:`Trois volets`,texte:`Bons de commande, Notes de frais, Comptes chantier : touche une puce pour passer de l'un à l'autre.`},{sel:`#eq-app [data-act="cmd"][data-v^="etat|"]`,titre:`Filtre par état`,texte:`Saisi (à valider), Validé, Refusé, Remboursé : le chiffre dit combien.`},{sel:`#eq-app .ac-stats`,titre:`En bref`,texte:`Le total affiché et le nombre de notes à valider.`},{sel:`#eq-app [data-act="cmd"][data-v="dbnew|"]`,titre:`➕ Note de frais`,texte:`Pour saisir une dépense toi-même : date, montant TTC, nature, chantier, moyen de paiement, ticket en photo.`},{sel:`#eq-app [data-act="cmd"][data-v^="dbok|"], #eq-app .eq-list .eq-row`,titre:`Valider ou refuser`,texte:`Regarde le ticket en vignette (photo ou PDF), puis ✓ valider ou ✕ refuser. « sans ticket » en orange : demande-le.`},{sel:`#eq-app [data-act="cmd"][data-v^="dbremb|"], #eq-app .eq-list .eq-row`,titre:`Remboursé`,texte:`Une fois la note payée, touche « remboursé » : la personne le voit dans Compagnon → Notes de frais.`},{titre:`D'où elles viennent`,texte:`Chacun saisit ses notes dans Compagnon, ticket pris en photo. Validées, elles entrent dans le compte du chantier, en HT.`}],"affaire:comptes":[{sel:`#eq-app [data-act="cmd"][data-v="tab|comptes"]`,titre:`Trois volets`,texte:`Bons de commande, Notes de frais, Comptes chantier : touche une puce pour passer de l'un à l'autre.`},{sel:`#eq-app .ac-stats`,titre:`Le total`,texte:`Chiffré, facturé, heures po <div class="app">

  <header>
    <span class="tbTrSite tbTrHdr" id="siteBadge2"></span><!-- 31/10 : au téléphone, le chantier / l'étude en cours = 1re ligne de la barre d'outils (pas de 2e ligne de bandeau : le dessin garde sa hauteur) -->

    <label class="muted">série <select class="f" id="serie"><option>1</option><option>2</option><option>3</option></select></label>
    <label class="muted">DN <select class="f" id="dn"></select></label>
    <label class="muted">barre <select class="f" id="bar"></select> m</label>
    <!-- 14/10 (édition du tracé) : DN et barre restent modifiables pendant le tracé (la ligne prend la valeur à la validation) ; profondeur de pose par défaut — variable des règles de dilatation à venir (surcharge par ligne dans sa fiche) -->
    <label class="muted" title="profondeur de pose par défaut (m), enregistrée avec le chantier ; se surcharge ligne par ligne dans la fiche de la ligne — servira aux règles de dilatation à venir">prof. <input class="f" id="prof" type="number" step="0.1" min="0" style="width:58px"> m</label>
    <span class="sep"></span>
    <button class="btn" id="mTrace">✎ Tracer une ligne</button>
    <button class="btn" id="mSelect">☝ Sélection</button>
    <button class="btn" id="mAdd">＋ Té / vanne / réduction / lyre / drapeau</button>
    <button class="btn" id="mOne" title="ne bouger qu'une conduite en glissant une soudure ou une pièce (ou Alt enfoncé)">◐ Un seul côté</button>
    <button class="btn" id="bUndo" title="annuler la dernière retouche (Ctrl+Z) — une action à la fois">↶</button>
    <button class="btn" id="bRedo" title="rétablir ce qui vient d'être annulé (Ctrl+Y ou Ctrl+Maj+Z)">↷</button>
    <span class="sep"></span>
    <span class="muted" style="font-size:11.5px">fond :</span>
    <!-- 14/10 (multi-plans) : plusieurs plans de fond (DXF du BE et/ou images : scan, capture), ajoutés en une fois, chacun calé dans l'onglet Fond -->
    <!-- 14/10 soir (T2) : « ＋ Plan » lit aussi le PDF (une page = un plan) ; le DWG est montré pour expliquer quoi en faire ; 📍 vue aérienne IGN par adresse, sous les plans -->
    <label class="btn" title="ajouter un ou plusieurs plans de fond : DXF (plan du BE, géomètre), PDF (une page = un plan) ou image (PNG, JPG, scan, capture d'écran) — chaque plan se cale ensuite (onglet Fond : échelle 1/N ou 2 points, déplacement, rotation, vue aérienne)">＋ Plan (DXF, PDF, image)<input type="file" id="bgAdd" accept=".dxf,.pdf,image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.dwg" multiple style="display:none"></label>
    <button class="btn" id="bAer" title="vue aérienne (IGN) en fond, par adresse, derrière les plans ; calage des lignes et des plans dessus">📍 Vue aérienne</button>
    <span id="bgTools" style="display:none;align-items:center;gap:6px">
      <button class="btn sm" id="bgScale" title="plan actif : clique deux points du plan dont tu connais la distance, puis entre-la">📏 Échelle</button>
      <button class="btn sm" id="bgEch" title="échelle d'un plan PDF ou image : 1/N (taille réelle de la page, ou dpi de l'image)">1/N</button>
      <button class="btn sm" id="bgMove" title="plan actif : glisse-le pour le déplacer">✥ Déplacer</button>
      <button class="btn sm" id="bgCal2" title="plan actif : 2 points sur le plan, puis les 2 mêmes endroits sur le tracé déjà calé → échelle, rotation et position d'un coup">⟲ 2 points</button>
      <label class="muted" style="font-size:11.5px">opacité <input type="range" id="bgOp" min="10" max="100" value="50" style="width:70px;vertical-align:middle"></label>
      <label class="muted" style="font-size:11.5px"><input type="checkbox" id="bgShow" checked> afficher</label>
      <button class="btn sm" id="bgLayers" title="options du plan DXF actif : calques du réseau, étendue, détail">⚙</button>
      <button class="btn sm" id="bgInfo" title="rapport de fidélité du plan DXF actif : ce qui est dessiné, ce qui manque (images externes, objets propriétaires…)">ⓘ</button>
      <button class="btn sm" id="bgFit" title="cadrer tous les plans de fond (et le réseau)">⤢ Tout voir</button>
      <button class="btn sm" id="bgClear" title="retirer le plan actif">✕</button>
    </span>
    <button class="btn" id="bClear">Tout effacer</button>
    <span class="sep"></span>
    <button class="btn on" id="bSave" title="remet le réseau à l'appli Tracé (chantier, soudures numérotées) et l'envoie au serveur si tu es connecté">💾 Enregistrer dans Tracé</button>
    <button class="btn" id="bOpenApp" title="ouvre l'appli">↗ Tracé</button>
    <button class="btn" id="bTuto" title="revoir le guide du traceur" aria-label="revoir le guide du traceur" style="min-width:36px;font-weight:700;color:#5E46B8">?</button>
    
    <button class="btn sm" id="bExport" title="fichier JSON de secours">⤓ JSON</button>
    <label class="btn sm">⤒ JSON<input type="file" id="impFile" accept=".json" style="display:none"></label>
  </header>
  <main id="main">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="bg"></g><g id="grid"></g><g id="net"></g><g id="draft"></g></g></svg>
    <div class="hint" id="hint" style="display:none"></div>
    <button class="btn" id="offscreen" style="display:none;position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.25)">↩ Réseau hors écran — revenir</button>
    <div class="zoominfo" id="zoominfo">1 m ≈ 10 px</div>
    <div class="disp" id="disp"></div>
    <div class="zoomctl"><button id="zEye" title="choisir ce qui s'affiche (étiquettes, n°, manchons, fond…)">👁</button><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="tout voir">⌂</button></div>
    <div class="legend"><span><i style="background:#c8382f"></i>aller</span><span><i style="background:#2a5fb4"></i>retour</span><span>○ soudure</span><span><i style="background:#f0c76a"></i>sélection</span><span><i style="background:#d03b3b"></i>règle violée</span><span style="color:#b8560f">FC = fausse coupe (tubes coupés en biais)</span><span class="muted">molette : zoom · glisser : déplacer (à la souris, glisser dans le vide = rectangle de sélection) · Maj : angles par 15° · 👁 : choisir ce qui s'affiche</span></div>
  </main>
  <aside>
    <div class="tabs"><button data-tab="sel" class="on">Sélection</button><button data-tab="lignes">Lignes</button><button data-tab="soud">Soudures</button><button data-tab="nomen">Nomenclature</button><button data-tab="notes">Notes</button><button data-tab="fond" title="plans de fond : liste, calage de chaque plan">Fond</button><button data-tab="regles">Règles</button></div>
    <div class="panel" id="panel"></div>
  </aside>
  <footer id="foot"></footer>
</div>
<div class="modal" id="modal"><div id="modalBody"></div></div>
</body>
