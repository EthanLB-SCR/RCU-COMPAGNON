<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF1F5;font-family:Barlow,"Segoe UI",system-ui,sans-serif;color:#1E2A44}
.page{max-width:1240px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{padding:6px 12px;border-radius:8px;background:#1E2A44;font-weight:800;font-size:22px;color:#fff}
.logo b{color:#FF7A66}

.sub{font-size:15px;color:#4D586B;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:10px}
button{font-family:inherit;color:#1E2A44;cursor:pointer}

.pill{padding:8px 20px;border-radius:10px;background:#1E2A44;color:#fff;font-weight:600;font-size:17px;text-align:center}
.famille{font-size:14px;color:#4D586B;text-align:center;margin-top:4px}
.box{width:100%;padding:16px;border-radius:12px;background:#F4F6F9;display:flex;flex-direction:column;gap:10px}

.tri i{flex:1}

.demo input[type=range]{width:100%;accent-color:#F26A1B;height:28px}

<body>
<div class="page">
<header>
<div class="brand"><div class="logo">S<b>C</b>R</div><div><h1>Mon avatar</h1><div class="sub">Mon compte · Profil</div></div></div>
<div class="actions">
<button type="button" class="act" id="hasard">Au hasard</button>
<button type="button" class="act" id="reinit">Réinitialiser</button>
<button type="button" class="act primary" id="copier">Copier la configuration</button>
</div>
</header>
<div class="cols">
<section class="card preview" id="preview"></section>
<div class="side">
<section class="card sec demo">
<div class="head"><h2>Simulation</h2><div class="sub">Ces valeurs viendront de l'appli : pointage, météo, compteurs de tâches</div></div>
<div class="grp"><div class="lab">Météo du jour</div><div class="row" id="meteo"></div></div>
<div class="two">
<label>Compteur de production : <span id="vReal"></span><input type="range" id="real" min="0" max="12000" step="50" value="25000"></label>
<label>Années sans accident : <span id="vJours"></span><input type="range" id="jours" min="0" max="12" step="1" value="2"></label>
<label>Qualité : <span id="vQual"></span><input type="range" id="qual" min="0" max="2000" step="5" value="400"></label>
<label>Qualité, radios conformes (soudeur) : <span id="vRadio"></span><input type="range" id="radio" min="80" max="100" step="1" value="96"></label>
<label>Série de cadence : <span id="vCad"></span><input type="range" id="cad" min="0" max="40" step="1" value="3"></label>
</div>
<div class="two">
<label>Ancienneté : <span id="vAnc"></span><input type="range" id="anc" min="0" max="30" step="1" value="7"></label>
</div>
</div>
</section>
<div id="side" style="display:flex;flex-direction:column;gap:16px"></div>
</div>
</div>
</div>
<script>
/*
 * Kit avatar SCR - a integrer dans l'appli.
 *
 * avatarModele(profil, contexte) -> tout ce qu'un ecran doit afficher (cfg de l'avatar, listes d'options, paliers, textes)
 * avatarConfig(profil, contexte) -> cfg de l'avatar a dessiner maintenant
 * avatarSVG(cfg, taille)         -> chaine SVG du personnage en pied (ratio 240 x 420)
 * avatarMedaillon(cfg, diametre, fond, cadre) -> photo de profil ronde
 * AVATAR_CATALOGUE               -> postes, options, paliers, seuils (id + libelle)
 *
 * PROFIL = ce que l'appli stocke par utilisateur (voir EditorLogic.profilInitial) :
 *   poste, genre, peau, cheveux, couleur, barbe, lunettes, casque (null = defaut du poste | true | false),
 *   bouche ('rien' | 'cigarette' | 'chewing' = bulle de chewing-gum),
 *   haut, hautCouleur, bas, basCouleur, chaussures, chaussuresCouleur, accessoire, bandana
 *        -> tenue AU TRAVAIL. Une piece = un TYPE (hautTypes, basTypes, chaussuresTypes) + une TEINTE (teintes).
 *           null = tenue du poste / teinte par defaut. Ignores sur les postes terrain (EPI impose), sauf bandana.
 *   pHaut, pHautCouleur, pBas, pBasCouleur, pChaussures, pChaussuresCouleur, pAccessoire, pCoiffe, pBandana
 *        -> tenue HORS TRAVAIL (libre pour tous)
 *   bandana / pBandana : id de AVATAR_CATALOGUE.bandanas (unis, pois, techno, pays = 3 couleurs). Pour couvrir
 *        tous les pays : ajouter une ligne par pays, ou brancher une bibliotheque de drapeaux SVG comme motif.
 *   palier (palier d'outil equipe, null = le plus haut debloque), palierGants (idem pour les gants),
 *   medaille (true / false : porter ou non sa medaille d'anciennete), fond (fond du medaillon)
 *
 * CONTEXTE = ce que l'appli calcule a l'affichage, jamais saisi par le salarie :
 *   vue: 'travail' | 'perso'      -> selon le pointage / les horaires : EPI en heures de travail, tenue perso sinon
 *   meteo: 'chaud' | 'frais' | 'froid' | 'pluie' -> couche de la tenue terrain :
 *          chaud = t-shirt HV manches longues, frais = sweat HV, froid = veste HV, pluie = tenue de pluie verte haut + bas.
 *          Sous forte pluie : chasuble orange par-dessus la veste de pluie. T-shirt et tenue de pluie sans bandes reflechissantes.
 *          Le soudeur garde toujours sa veste en cuir (risque de feu) : sous forte pluie, seul le pantalon de pluie s'ajoute. Bas de travail unique : jean technique marine.
 *          Casque impose en tenue de travail pour les postes terrain ; au choix pour l'encadrement et le bureau.
 *   realisations: compteur de production du poste (pouces soudes, pouces manchonnes, heures d'engin) -> paliers Bronze / Argent / Or / Diamant,
 *          seuils par poste dans AVATAR_CATALOGUE.postes[].seuils : outil recolore (porte-electrode, meuleuse, chalumeau, talkie) + cadre du medaillon.
 *   jours: jours sans accident -> une etoile sur le casque par annee pleine (365 jours), 10 etoiles au maximum.
 *   qualite: jours de qualite d'affilee (voir postes[].qualite) -> couleur des gants.
 *          Manchonneur, jours DH OK : Bronze 6 mois (182 j) / Argent 1 an (365 j) / Or 2 ans (730 j) / Diamant 3 ans (1 095 j), en jours calendaires.
 *          Tuyauteur, jours "fils sur le dessus" : Bronze 2 mois (61 j) / Argent 4 mois (122 j) / Or 7 mois (213 j) / Diamant 1 an (365 j).
 *            Regles a coder : la chaine casse des qu'un fil est pose sur le cote a plus de 45 degres (45 exclu : pile 45 ne casse pas).
 *            Seuls les assemblages tube sur tube comptent ; les assemblages piece sur tube sont ignores.
 *            Perimetre : uniquement les tubes soudes par le soudeur auquel le tuyauteur est rattache (meme rattachement que ses pouces),
 *            et uniquement quand le tube pose est NEUF, c'est-a-dire pas encore soude a son autre extremite
 *            (un tube deja soude de l'autre bout ne peut plus etre tourne : il ne compte pas, ni en bien ni en mal).
 *          Pour le soudeur, la qualite se mesure par les radios (voir radio), pas par ce compteur.
 *   Soudeur : pas de casque sur la tete en tenue de travail, masque de soudage releve a la place, casque pose a ses pieds
 *          (les etoiles de securite restent sur ce casque). Sous forte pluie il garde son cuir, seul le pantalon de pluie s'ajoute.
 *   realisations (soudeur) : pouces soudes declares -> couleur du porte-electrode.
 *          Seuils : Bronze 11 000 / Argent 22 500 / Or 34 000 / Diamant 56 000, soit 1, 2, 3 et 5 ans d'activite
 *          a 60 pouces par jour, semaines de 4 jours, 47 semaines travaillees par an (188 jours, 11 280 pouces par an).
 *   realisations (manchonneur, tuyauteur) : meme unite et meme bareme que le soudeur, le pouce.
 *          - Manchonneur : il pointe ce qu'il a manchonne ; chaque manchon compte pour les pouces du DN de la soudure manchonnee.
 *          - Tuyauteur : il n'a pas de pointage propre ; il recoit les pouces soudes par le soudeur avec qui il fait equipe.
 *            L'appli doit donc enregistrer la composition des equipes (quel tuyauteur travaille avec quel soudeur, jour par jour)
 *            et crediter le tuyauteur des pouces de son soudeur sur les jours travailles ensemble.
 *            S'il travaille avec deux soudeurs, on CUMULE les pouces des deux.
 *   radio (soudeur) : c'est l'indicateur QUALITE du soudeur. % de radios conformes sur les 50 dernieres soudures tirees -> teinte du masque de soudage
 *          (Bronze 90 / Argent 95 / Or 98 / Diamant 100). C'est un taux : le masque peut redescendre.
 *   cadence (soudeur) : record de semaines d'affilee au-dessus de la cadence moyenne (semaines de 4 jours, moyenne a la semaine)
 *          -> une etincelle au bout de l'electrode par semaine du record : 40 dessinees au maximum (trois couronnes de 12, puis 4 en diagonale) ;
 *             le compteur n'a pas de plafond. Couleur : Bronze des 1 semaine, Argent 3, Or 4, Diamant 8. C'est un record : il reste acquis.
 *   cadence (manchonneur) : meme compteur et memes paliers -> une flamme au bout du flambard, qui s'epaissit chaque semaine
 *          du record jusqu'a 12, puis une braise ou une etincelle s'ajoute chaque semaine jusqu'a 40, avec un halo a 13, 25 et 37
 *          et deux flammeches laterales a 25 et 31. Couleur selon le palier (bleue au Diamant). Voir postes[].cadence.
 *   Tuyauteur : casque sur la tete, et une cagoule de soudure noire posee a ses pieds (postes[].cagouleSol).
 *   cadence (tuyauteur) : une semaine compte quand le CUMUL des pouces de ses soudeurs (un ou deux) depasse la cadence moyenne
 *          d'UN soudeur (meme moyenne de reference que pour le soudeur, a la semaine de 4 jours)
 *          -> une gerbe d'etincelles sort du disque de la meuleuse : une etincelle par semaine du record, 40 dessinees au maximum.
 *   Chauffeur d'engin : meme veste HV que les autres, un talkie-walkie glisse dans la poche de cuisse du pantalon (plus en main).
 *          realisations = heures d'engin -> couleur du talkie. Seuils 1 900 / 3 800 / 5 600 / 9 400, soit 1, 2, 3 et 5 ans
 *          a 10 heures d'engin par jour, semaines de 4 jours, 47 semaines travaillees par an (188 jours, 1 880 heures par an).
 *          qualite = jours sans sinistre -> gants : Bronze 1 an (365 j) / Argent 2 ans (730 j) / Or 3 ans (1 095 j) / Diamant 5 ans (1 825 j).
 *          Pas de recompense de cadence pour le chauffeur (les calques d'ondes du talkie existent mais ne sont pas utilises).
 *   Plus aucun effet brillant autour des outils ni des gants : seule la couleur indique le palier.
 *   Recompenses de production reservees aux operateurs (soudeur, tuyauteur, manchonneur, chauffeur d'engin) :
 *          rien pour le chef de chantier (postes[].sansRecompense), l'encadrement et le bureau, hors medaille d'anciennete.
 *   anciennete: annees pleines depuis la date d'entree -> medaille d'anciennete, pour tous les postes, portee au choix du salarie.
 *          Le disque affiche le nombre d'annees. Niveaux : 1 an bronze, 3 argent, 5 or, 7 barrette, 10 rayons, 12 rayons et barrette, 15 lauriers, 20 diamant couronne.
 *          Portee par defaut (medaille: true), le salarie peut l'enlever.
 *   Seuils et unites sont dans AVATAR_CATALOGUE (paliers, etoiles, postes[].unite) : a ajuster.
 *
 * Logo : texte "SCR" provisoire, a remplacer par le vrai logo vectoriel.
 */
class DCLogic { setState() {} }
class AvatarLogic extends DCLogic {
  resolve(c) {
    var SKIN = { p1: '#FBD9BF', p2: '#F1C39F', p3: '#DDA57A', p4: '#B9794E', p5: '#8D5637', p6: '#5E3A26' };
    var HAIR = { noir: '#1E1B1A', brun: '#4A3020', chatain: '#7A4E2B', blond: '#D8B25A', roux: '#B5532A', gris: '#9A9A9A', blanc: '#E5E3DE' };
    var TOPS = {
      hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['hv'] },
      hvbi: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['hv', 'bi'] },
      soudeur: { fill: '#CDAA7D', line: '#9C7A4E', cut: 'long', ov: ['soudeur'] },
      gilet: { fill: '#23262D', line: '#111318', cut: 'long', ov: ['gilet'] },
      softshell: { fill: '#1E2A44', cut: 'long', ov: ['soft'], teint: true },
      chemise_blanche: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'long', ov: ['chemise'] },
      chemise_bleue: { fill: '#C3D7F0', line: '#8FA9CF', cut: 'long', ov: ['chemise'] },
      chemisier_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'long', ov: ['chemisier'] },
      chemisier_rose: { fill: '#F2C6C0', line: '#CC958E', cut: 'long', ov: ['chemisier'] },
      blazer_marine: { fill: '#1E2A44', line: '#121A2E', cut: 'long', ov: ['blazer'] },
      tshirt_hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['tee'] },
      sweat_hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['sweat'] },
      pluie: { fill: '#2E7D55', line: '#1B5639', cut: 'long', ov: ['pluie', 'chasuble'] },
      tshirt: { fill: '#23262D', cut: 'short', ov: ['tee'], teint: true },
      polo: { fill: '#1E2A44', cut: 'short', ov: ['polo'], teint: true },
      chemise: { fill: '#FFFFFF', cut: 'long', ov: ['chemise'], teint: true },
      chemisier: { fill: '#FFFFFF', cut: 'long', ov: ['chemisier'], teint: true },
      sweat: { fill: '#8E96A3', cut: 'long', ov: ['sweat'], teint: true },
      hoodie: { fill: '#8E96A3', cut: 'long', ov: ['hoodie'], teint: true },
      blazer: { fill: '#1E2A44', cut: 'long', ov: ['blazer'], teint: true },
      hoodie_gris: { fill: '#8E96A3', line: '#636D7C', cut: 'long', ov: ['hoodie'] },
      hoodie_noir: { fill: '#23262D', line: '#111318', cut: 'long', ov: ['hoodie'] },
      polo_marine: { fill: '#1E2A44', line: '#121A2E', cut: 'short', ov: ['polo'] },
      polo_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'short', ov: ['polo'] },
      tshirt_noir: { fill: '#23262D', line: '#111318', cut: 'short', ov: ['tee'] },
      tshirt_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'short', ov: ['tee'] }
    };
    var BAS = {
      pantalon: { fill: '#1E2A44', teint: true },
      short: { fill: '#CDB391', shape: 'bermuda', teint: true },
      pantalon_78: { fill: '#1E2A44', shape: 'pant78', teint: true },
      jupe: { fill: '#1E2A44', shape: 'jupe', teint: true },
      pluie_bas: { fill: '#2E7D55', line: '#1B5639' },
      travail: { fill: '#1E2A44', line: '#121A2E', ov: 'cargo' },
      travail_noir: { fill: '#34363C', line: '#1D1E22', ov: 'cargo' },
      marine: { fill: '#1E2A44', line: '#121A2E' },
      chino: { fill: '#CDB391', line: '#A38A68' },
      jean: { fill: '#4F77A8', ov: 'jean', teint: true }
    };
    var SHOES = {
      ville: { fill: '#6B3A22', sole: '#2A1710', teint: true },
      escarpins: { fill: '#23262D', sole: '#000000', shape: 'shoeFin', teint: true },
      ballerines: { fill: '#C4816F', sole: '#000000', shape: 'shoeFin', teint: true },
      secu: { fill: '#B07A45', sole: '#3A2A1C', teint: true },
      cuir: { fill: '#6B3A22', line: '#4A2614', sole: '#2A1710' },
      baskets: { fill: '#FFFFFF', sole: '#AEB7C4', teint: true },
      noires: { fill: '#23262D', line: '#111318', sole: '#000000' }
    };
    var GLOVES = {
      travail: { fill: '#C9A46A', line: '#9C7A44', flag: 'gants' },
      soudeur: { fill: '#B9B2A4', line: '#8C8576', flag: 'gantsLongs' }
    };
    var HAIRF = {
      chauve: [], degarni: ['h_degarni'], court: ['h_court'], brosse: ['h_brosse'], meche: ['h_meche'], milong: ['h_milong'],
      long: ['b_long', 'h_long'], chignon: ['h_raie', 'v_chignon'], queue: ['b_queue', 'h_raie'], boucle: ['h_court', 'v_boucle']
    };
    var f = {};
    function fonce(hex, k) {
      var n = parseInt(String(hex).slice(1), 16);
      var r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function teinte(base, couleur, sombre) {
      if (!base.teint || !couleur) return base.line ? base : Object.assign({}, base, { line: fonce(base.fill, 0.72) });
      return Object.assign({}, base, { fill: couleur, line: fonce(couleur, 0.72), sole: sombre ? fonce(couleur, 0.45) : base.sole });
    }
    var top = teinte(TOPS[c.haut] || TOPS.hv, c.hautCouleur);
    var bas = teinte(BAS[c.bas] || BAS.travail, c.basCouleur);
    var shoeBase = SHOES[c.chaussures] || SHOES.secu;
    var shoe = teinte(shoeBase, c.chaussuresCouleur, c.chaussures !== 'baskets');
    var glove = GLOVES[c.gants];
    var casque = c.casque === true || c.casque === 'true';
    f[top.cut] = true;
    top.ov.forEach(function (k) { f[k] = true; });
    if (bas.ov) f[bas.ov] = true;
    f[bas.shape || 'pant'] = true;
    f[shoe.shape || 'shoeStd'] = true;

  /* Profil + contexte (vue, meteo, realisations, jours, qualite, radio, cadence, anciennete) -> tout ce que l'ecran affiche. Aucune dependance a l'interface. */

    var radio = Number(s.radio) || 0;
    var cadence = Number(s.cadence) || 0;
    var iRadio = 0;
    K.paliersRadio.forEach(function (p, i) { if (radio >= p.seuil) iRadio = i; });
    var nChevrons = Math.max(0, Math.round(cadence));
    var iCad = -1;
    K.paliersCadence.forEach(function (p, i) { if (cadence >= p.seuil) iCad = i; });

    PAL.forEach(function (p, i) { if (real >= p.seuil) deb = i; });
    var eq = deb;
    PAL.forEach(function (p, i) { if (p.id === s.palier && i <= deb) eq = i; });
    var palier = PAL[eq];
    var PALQ = K.paliersQualite.map(function (p, i) { return P.seuilsQualite ? Object.assign({}, p, { seuil: P.seuilsQualite[i], duree: (P.dureesQualite || [])[i] }) : p; });
    var debQ = 0;
    PALQ.forEach(function (p, i) { if (qualite >= p.seuil) debQ = i; });
    var eqQ = debQ;
    PALQ.forEach(function (p, i) { if (p.id === s.palierGants && i <= debQ) eqQ = i; });
    var etoiles = Math.min(K.etoilesMax, Math.floor(jours / K.etoileJours));

    /* Une pièce au choix = un type + une teinte. Retourne la sélection courante. */
    function piece(types, typeChoisi, teinteChoisie, typePoste, teintePoste, typeDefaut) {

      var def = trouve(types, type);

    var tH, tB, tC, tenuePoste;

      var hautJour = P.haut, basJour = P.bas;

    function opts(list, cle, cleCfg, mini) {

        var c2 = Object.assign({}, cfg, mini || {});
        c2[cleCfg] = o.id;

        patch[cle] = o.id;

    }

    var buste = { casque: false, coiffe: 'aucune', gants: 'aucun', accessoire: 'aucun' };

function avatarModele(profil, contexte) {
  const logique = new EditorLogic();
  return logique.modele(Object.assign(logique.profilInitial(), { vue: 'travail', meteo: 'froid', realisations: 0, jours: 0, qualite: 0, radio: 0, cadence: 0, anciennete: 0 }, profil, contexte));
}
function avatarConfig(profil, contexte) { return avatarModele(profil, contexte).cfg; }

function avatarSVG(cfg, taille) {
  const c = Object.assign({}, AVATAR_DEFAUT, cfg);
  const v = new AvatarLogic().resolve(c);
  const t = taille || 240;
  const corps = AVATAR_CALQUES.filter(l => !l.si || v.f[l.si]).map(l => l.svg.replace(/\{\{(\w+)\}\}/g, (m, k) => v[k])).join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 420" width="' + t + '" height="' + Math.round(t * 1.75) + '" style="overflow:visible">' + corps + '</svg>';
}

function avatarMedaillon(cfg, diametre, fond, cadre) {
  const d = diametre || 96, t = d * 1.875;
  const anneau = cadre ? ';box-shadow:0 0 0 3px #fff,0 0 0 6px ' + cadre : '';
  return '<span style="display:inline-block;flex:none;position:relative;width:' + d + 'px;height:' + d + 'px;border-radius:50%;overflow:hidden;background:' + (fond || '#E3E8EF') + anneau + '">'
    + '<span style="position:absolute;left:' + (-0.4375 * d) + 'px;top:' + (-0.156 * d) + 'px">' + avatarSVG(cfg, t) + '</span></span>';
}

<script>
const LOGIQUE = new EditorLogic();
let S = Object.assign(LOGIQUE.profilInitial(), { meteo: 'froid', realisations: 25000, jours: 730, qualite: 400, radio: 96, cadence: 3, anciennete: 7 });
let ACTIONS = [];

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function action(patch) { ACTIONS.push(patch); return ACTIONS.length - 1; }
function crop(cfg, w, h, taille, left, top, radius) {
  return '<span class="crop" style="width:' + w + 'px;height:' + h + 'px;border-radius:' + radius + '"><span style="left:' + left + 'px;top:' + top + 'px">' + avatarSVG(cfg, taille) + '</span></span>';
}
function groupe(titre, html) { return html ? '<div class="grp"><div class="lab">' + esc(titre) + '</div><div class="row">' + html + '</div></div>' : ''; }
function chips(list) {
  return list.map(o => '<button type="button" class="opt chip" data-a="' + action(o.patch) + '" aria-pressed="' + o.sel + '">' + esc(o.label) + '</button>').join('');
}
function pastilles(list) {
  return list.map(o => '<button type="button" class="opt sw" data-a="' + action(o.patch) + '" aria-label="' + esc(o.label) + '" title="' + esc(o.label) + '" aria-pressed="' + o.sel + '"><i style="background:' + o.hex + '"></i></button>').join('');
}
const CADRAGES = {
  tete: [64, 64, 130, -33, -9, '50%'], barbe: [64, 64, 130, -33, -14, '50%'], buste: [72, 80, 120, -24, -48, '10px'],
  jambes: [60, 84, 100, -20, -88, '10px'], pieds: [72, 44, 150, -39, -206, '10px'], hanches: [84, 100, 100, -8, -24, '10px'], coiffure: [58, 58, 118, -30, -8, '50%'], casque: [64, 64, 130, -33, -4, '50%']
};
function vignettes(list, cadrage, large) {
  const c = CADRAGES[cadrage];
  return list.map(o => '<button type="button" class="opt th' + (large === 'xl' ? ' xl' : large === 's' ? ' s' : large ? ' large' : '') + '" data-a="' + action(o.patch) + '" aria-pressed="' + o.sel + '">' + crop(o.cfg, c[0], c[1], c[2], c[3], c[4], c[5]) + '<span>' + esc(o.label) + '</span></button>').join('');
}

function rendu() {
  ACTIONS = [];
  let m = LOGIQUE.modele(S);
  if (S.realisations > m.realMax) { S.realisations = m.realMax; m = LOGIQUE.modele(S); }
  const g = m.groupes;
  const barre = document.getElementById('real');
  if (+barre.max !== m.realMax) { barre.max = m.realMax; barre.step = m.realMax > 20000 ? 250 : 50; }
  document.getElementById('vReal').textContent = S.realisations + ' ' + m.poste.unite;
  document.getElementById('vRadio').textContent = S.radio + ' %';
  document.getElementById('vCad').textContent = S.cadence + ' semaine' + (S.cadence > 1 ? 's' : '') + ' d\'affilée';
  document.getElementById('vJours').textContent = Math.floor(S.jours / 365) + ' an' + (S.jours >= 730 ? 's' : '') + ' · ' + m.etoiles + ' étoile' + (m.etoiles > 1 ? 's' : '');
  document.getElementById('meteo').innerHTML = chips(g.meteos);
  document.getElementById('vAnc').textContent = S.anciennete + ' an' + (S.anciennete > 1 ? 's' : '');
  document.getElementById('vQual').textContent = S.qualite + ' ' + (m.poste.qualite || 'jours (non utilisé ici : la qualité du soudeur, ce sont les radios)');

  document.getElementById('preview').innerHTML =
    '<div class="row" style="justify-content:center">' + chips(g.vues) + '</div>' +
    '<div class="stage"><div class="disc" style="background:' + m.fond + '"></div><div class="shadow"></div><div class="fig">' + avatarSVG(m.cfg, 280) + '</div></div>' +
    '<div><div class="pill">' + esc(m.poste.label) + '</div><div class="famille">' + esc(m.vueTexte) + '</div></div>' +
    '<div class="box"><div class="lab">Rendu dans l\'appli</div><div class="meds">' + avatarMedaillon(m.cfg, 96, m.fond, m.cadre) + avatarMedaillon(m.cfg, 48, m.fond) + avatarMedaillon(m.cfg, 32, m.fond) + '</div>' +
    '<div class="sub" style="font-size:14px">Photo de profil, listes d\'équipe et planning. Le cadre prend la couleur du palier atteint.</div></div>' +
    '<div class="box"><div class="lab">Données enregistrées</div><pre id="json">' + esc(JSON.stringify(donnees(), null, 2)) + '</pre></div>';

  let tenue = '';
  if (m.verrou) tenue += '<div class="box"><strong>Tenue de chantier et casque imposés, adaptés à la météo du jour</strong><div class="sub">' + esc(m.epi) + '</div></div>';
  if (m.tenueVisible) {
    tenue += groupe('Haut', vignettes(g.hauts, 'buste', true)) + groupe('Teinte du haut', pastilles(g.hautTeintes)) + groupe('Bas', vignettes(g.bas, 'jambes', true)) + groupe('Teinte du bas', pastilles(g.basTeintes)) +
      groupe('Chaussures', vignettes(g.chaussures, 'pieds', true)) + groupe('Teinte des chaussures', pastilles(g.chaussuresTeintes)) + groupe('Accessoire', vignettes(g.accessoires, 'hanches', 'xl'));
  }
  tenue += groupe('Casque', vignettes(g.casques, 'casque', true)) + groupe('Sur la tête', vignettes(g.coiffes, 'tete', true));
  tenue += '<div class="grp"><div class="lab">Bandana · accessoire en option</div><div class="row">' + chips(g.bandanaBascule) + '</div></div>';
  if (m.aBandana) tenue += '<div class="grp"><div class="sub">' + esc(m.bandanaTexte) + '</div><div class="row">' + g.bandanas.map(o => '<button type="button" class="opt tri" data-a="' + action(o.patch) + '" aria-label="' + esc(o.label) + '" title="' + esc(o.label) + '" aria-pressed="' + o.sel + '"><span><i style="background:' + o.c1 + '"></i><i style="background:' + o.c2 + '"></i><i style="background:' + o.c3 + '"></i></span></button>').join('') + '</div><label class="pays">Aux couleurs d\'un pays <select id="pays"><option value="">Choisir un pays</option>' + g.bandanaPays.map(o => '<option value="' + o.id + '"' + (o.sel ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select></label></div>';

  const medaille = '<div class="grp"><div class="lab">Médaille d\'ancienneté · au choix</div><div class="sub">' + esc(m.medailleTexte) + '</div><div class="row">' +
    g.medailleBascule.map(o => '<button type="button" class="opt chip" data-a="' + action(o.patch) + '" aria-pressed="' + o.sel + '"' + (o.bloque ? ' disabled' : '') + '>' + esc(o.label) + '</button>').join('') + '</div><div class="row">' +
    g.medailleNiveaux.map(o => '<div class="niv" aria-current="' + o.sel + '">' + crop(o.cfg, 76, 76, 300, -81, -164, '10px') + '<span>' + esc(o.label) + '</span><small>' + esc(o.info) + '</small></div>').join('') + '</div></div>';
  const palierBoutons = list => list.map(o => '<button type="button" class="opt pal" data-a="' + action(o.patch) + '" aria-pressed="' + o.sel + '"' + (o.bloque ? ' disabled' : '') + '><i style="background:' + o.hex + '"></i><span>' + esc(o.label) + '<small>' + esc(o.info) + '</small></span></button>').join('');
  const gants = m.aGants ? '<div class="grp"><div class="lab">' + esc(m.gantsTitre) + '</div><div class="sub">' + esc(m.qualiteTexte) + '</div><div class="row">' + palierBoutons(g.paliersGants) + '</div></div>' : '';
  const paliers = g.paliers.map(o => '<button type="button" class="opt pal" data-a="' + action(o.patch) + '" aria-pressed="' + o.sel + '"' + (o.bloque ? ' disabled' : '') + '><i style="background:' + o.hex + '"></i><span>' + esc(o.label) + '<small>' + esc(o.info) + '</small></span></button>').join('');

  document.getElementById('side').innerHTML =
    '<section class="card sec"><div class="head"><h2>Poste</h2><div class="sub" style="font-size:14px">Attribué par l\'administrateur, il fixe la tenue de travail</div></div><div class="row">' + chips(g.postes) + '</div></section>' +
    '<section class="card sec"><h2>Visage</h2><div class="two">' + groupe('Silhouette', chips(g.genres)) + groupe('Teint', pastilles(g.peaux)) + groupe('Couleur cheveux et barbe', pastilles(g.couleurs)) + '</div>' +
    groupe('Coiffure', vignettes(g.coiffures, 'coiffure', 's')) + groupe('Barbe', vignettes(g.barbes, 'barbe', true)) + groupe('Lunettes', vignettes(g.lunettes, 'tete', true)) + groupe('En bouche', vignettes(g.bouches, 'barbe', true)) + '</section>' +
    '<section class="card sec"><div class="head"><h2>Tenue</h2><div class="row">' + chips(g.vues) + '</div></div>' + tenue + '</section>' +
    '<section class="card sec"><h2>Récompenses</h2>' + (m.aRecompenses ? '<div class="box"><strong>' + esc(m.progression) + '</strong><div class="sub">' + esc(m.prochain) + '</div><div class="sub">' + esc(m.etoilesTexte) + '</div></div>' +
    groupe(m.palierTitre, paliers) + gants +
    (m.aRadio ? '<div class="grp"><div class="lab">Masque de soudage · qualité, radios conformes</div><div class="sub">' + esc(m.radioTexte) + '</div><div class="row">' + palierBoutons(g.paliersRadio) + '</div></div>' : '') +
    (m.aCadence ? '<div class="grp"><div class="lab">' + esc(m.cadenceTitre) + '</div><div class="sub">' + esc(m.cadenceTexte) + '</div><div class="row">' + palierBoutons(g.paliersCadence) + '</div></div>' : '') +
    '' : '<div class="sub">Pas de récompenses de production sur ce poste.</div>') + medaille + groupe('Fond du médaillon', pastilles(g.fonds)) + '</section>';
}
function donnees() {
  const d = {};
  Object.keys(LOGIQUE.profilInitial()).forEach(k => { if (k !== 'vue') d[k] = S[k]; });
  return d;
}
function pioche(l) { return l[Math.floor(Math.random() * l.length)]; }

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if (!b || b.disabled) return;
  Object.assign(S, ACTIONS[+b.dataset.a]);
  rendu();
});
document.addEventListener('change', e => { if (e.target.id === 'pays' && e.target.value) { S[LOGIQUE.modele(S).bandanaCle] = e.target.value; rendu(); } });
document.getElementById('real').addEventListener('input', e => { S.realisations = +e.target.value; rendu(); });
document.getElementById('jours').addEventListener('input', e => { S.jours = +e.target.value * 365; rendu(); });
document.getElementById('anc').addEventListener('input', e => { S.anciennete = +e.target.value; rendu(); });
document.getElementById('qual').addEventListener('input', e => { S.qualite = +e.target.value; rendu(); });
document.getElementById('radio').addEventListener('input', e => { S.radio = +e.target.value; rendu(); });
document.getElementById('cad').addEventListener('input', e => { S.cadence = +e.target.value; rendu(); });
document.getElementById('hasard').onclick = () => {
  const g = LOGIQUE.modele(S).groupes;
  ['peaux', 'couleurs', 'coiffures', 'barbes', 'lunettes', 'fonds', 'hauts', 'bas', 'chaussures', 'coiffes'].forEach(k => { if (g[k].length) Object.assign(S, pioche(g[k]).patch); });
  const g2 = LOGIQUE.modele(S).groupes;
  ['hautTeintes', 'basTeintes', 'chaussuresTeintes'].forEach(k => { if (g2[k].length) Object.assign(S, pioche(g2[k]).patch); });
  rendu();
};
document.getElementById('reinit').onclick = () => { S = Object.assign(LOGIQUE.profilInitial(), { poste: S.poste, vue: S.vue, meteo: S.meteo, realisations: S.realisations, jours: S.jours, qualite: S.qualite, radio: S.radio, cadence: S.cadence, anciennete: S.anciennete }); rendu(); };
document.getElementById('copier').onclick = function () {
  const t = JSON.stringify(donnees(), null, 2), btn = this;
  const ok = () => { btn.textContent = 'Copié'; setTimeout(() => { btn.textContent = 'Copier la configuration'; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => {});
};
rendu();
</script>
</body>
</html>
