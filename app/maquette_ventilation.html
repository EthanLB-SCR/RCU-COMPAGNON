<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<title>TRACÉ — maquette : nouvelle ventilation</title>
<!--
  MAQUETTE « NOUVELLE VENTILATION » — TRACÉ / SCR — 11/10/2026
  Ethan : « on a tellement d'onglets… tout est dans Exploitation, ça n'a plus trop de sens ; les différentes interactions avec le plan d'ensemble ;
  en mode super design, il faut que ça claque ». Cliquable, données de démonstration (semaine 42), testable sur téléphone et sur PC (rail à gauche).
  Rien n'est branché : quand c'est validé, on porte dans l'appli (comme Mon espace et l'accueil général). Aucun module n'est supprimé : tout est RANGÉ autrement.

  LA RÈGLE : 4 territoires au lieu de 6 onglets + 17 lignes « Exploitation » + 12 onglets de chantier.
    🏠 Aujourd'hui   — mon cockpit : chantier du jour, météo, MES objectifs (🎯, DN), ce qui m'attend, ma semaine. Les notifications ne sont pas un onglet : c'est le cockpit.
    📍 Chantiers     — carte / liste → UN chantier = 3 facettes : PLAN (plein écran, un seul bouton « ＋ Poser » et un seul « 👁 Calques »)
                       · VIE DU CHANTIER (bureau, équipe, conversation, stock, QSE, dossier, DOE) · TECHNIQUE (soudures, DH, hydro, phasage, TS, récap, catalogue).
    👥 Équipes       — les gens et le temps (encadrement) : Planning · Objectifs · Heures · Sécurité · Gens.
    🏢 Entreprise    — support & direction : Pilotage · Affaires · Commandes & débours · Flotte · Documents · Traceur · Administration.
    👤 Moi           — l'avatar en haut à droite : heures, documents, habilitations, avatar, planning perso.
  Chaque métier ne voit que ses territoires : Karim (terrain) 3 · Paul (chef) 4 · Julie (conductrice) et Ethan (resp. exploitation) 5 · Nadia (RH) 4.
  Barre du haut (n'existe pas dans l'appli) : « voir comme » + « ⓘ la ventilation » (ancien → nouveau).
-->
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#15140f;--ink2:#605c54;--mute:#8e8a80;--line:#e7e4dc;--or:#e8501c;--or2:#fdebe3;--dark:#1b1a17;--dark2:#2a2824;
  --ok:#1f9d55;--ok2:#e6f5ec;--warn:#d98f06;--warn2:#fff4d6;--bad:#d6473a;--bad2:#fdeae7;--blue:#2a78d6;--blue2:#e8f0fb;--vio:#6b4bd6;--vio2:#efeafb;--teal:#128a8a;--teal2:#e3f3f3;--gray2:#ececea;
  --sh:0 1px 2px rgba(20,20,10,.04),0 8px 24px rgba(20,20,10,.07);--sh2:0 12px 40px rgba(20,20,10,.16);--r:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
b{font-weight:700}
svg{display:block}

/* ─ barre de la maquette ─ */
.mq{position:sticky;top:0;z-index:80;background:#111;color:#fff;font-size:12px;display:flex;align-items:center;gap:10px;padding:7px 14px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mq .tag{background:var(--or);color:#fff;font-weight:800;letter-spacing:.08em;font-size:10.5px;padding:3px 7px;border-radius:6px}
.mq label{opacity:.8;white-space:nowrap}
.mq select{flex:1;min-width:0;max-width:360px;background:#2a2824;color:#fff;border:1px solid #3d3a35;border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}
.mq .ib{margin-left:auto;background:#2a2824;border:1px solid #3d3a35;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}

/* ─ coque : rail (PC) / barre du bas (téléphone) ─ */
.shell{display:flex;min-height:calc(100vh - 34px)}
.rail{display:none}
.main{flex:1;min-width:0}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 96px}
.wrap.wide{max-width:1180px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(27,26,23,.96);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.18)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9c9890;font-size:10.5px;font-weight:700;min-width:62px;padding:6px 4px;border-radius:12px;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:#fff}
.tabs button.on::before{content:"";position:absolute;top:2px;width:26px;height:3px;border-radius:2px;background:var(--or)}
.tabs .n{position:absolute;top:2px;right:6px}
@media(min-width:1000px){
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:92px;flex:none;background:var(--dark);color:#fff;padding:16px 8px;position:sticky;top:34px;height:calc(100vh - 34px)}
  .rail .logo{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;letter-spacing:.14em;font-size:11px;padding:6px 0 18px;color:#fff}
  .rail .logo img{width:34px;height:26px;object-fit:contain}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:5px;color:#a5a19a;font-size:11px;font-weight:700;padding:10px 4px;border-radius:14px;position:relative;width:100%}
  .rail button>svg{width:24px;height:24px}
  .rail button.on{background:#2f2d29;color:#fff}
  .rail button.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--or)}
  .rail .n{position:absolute;top:6px;right:10px}
  .rail .me{margin-top:auto}
  .wrap{padding-bottom:40px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
}

/* ─ en-têtes ─ */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:13px}
.brand img{width:26px;height:20px;object-fit:contain}
.avbtn{border-radius:50%;line-height:0;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--or2)}
h1.hi{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;line-height:1.15}
.date{color:var(--ink2);font-size:13px;margin-top:2px}
.sh{display:flex;align-items:center;gap:10px;padding:12px 0 10px;position:sticky;top:34px;z-index:5;background:linear-gradient(var(--bg) 80%,rgba(243,242,238,0))}
.back{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.sh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .sub{display:block;font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:0}
.h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;gap:10px}
.h b{font-size:17px;font-weight:800}
.h span{font-size:12.5px;color:var(--mute)}
.h .lnk{font-size:12.5px;color:var(--or);font-weight:700}

/* ─ cartes ─ */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kick{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.s{font-size:13px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.or{background:var(--or);color:#fff;border-color:var(--or)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.ctas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ctas .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.or.on{background:var(--or);border-color:var(--or)}
.bar{height:6px;border-radius:3px;background:var(--gray2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar.or i{background:var(--or)}.bar.ok i{background:var(--ok)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tagx{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--gray2);color:var(--ink2);white-space:nowrap}
.tagx.or{background:var(--or2);color:#9a3410}.tagx.ok{background:var(--ok2);color:#15673a}.tagx.bad{background:var(--bad2);color:#9b2c22}.tagx.warn{background:var(--warn2);color:#7a5200}.tagx.blue{background:var(--blue2);color:#1c4f8c}.tagx.vio{background:var(--vio2);color:#3f2c8a}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);width:100%;min-height:68px}
.row .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:20px}
.row .ic svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .tx>b{display:block;font-size:15px}
.row .tx small{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.row .chev{color:var(--mute);flex:none}
.n{min-width:22px;height:22px;border-radius:999px;background:var(--or);color:#fff;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 7px;flex:none}
.n.dark{background:var(--ink)}.n.bad{background:var(--bad)}.n.ok{background:var(--ok)}.n.blue{background:var(--blue)}

/* ─ héros ─ */
.hero{border-radius:24px;padding:16px;display:flex;gap:14px;box-shadow:var(--sh);margin-top:14px;overflow:hidden;position:relative}
.hero .fig{flex:none;width:112px;align-self:flex-start}
.hero .figin{position:relative;display:block;width:112px}
.hero .fig svg{display:block;position:relative;z-index:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))}
.hero .fig .sol{position:absolute;left:14%;bottom:1px;width:72%;height:8px;border-radius:50%;background:rgba(0,0,0,.14)}
.hero .r{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hero .hsite{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.01em;background:rgba(255,255,255,.8);border-radius:14px;padding:10px 12px}
.hero .mt{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.78);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.2;align-self:flex-start}
.hero .mt .e{font-size:22px}
.hero .team{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.hero .avs{display:flex}.hero .avs>*{margin-left:-8px;box-shadow:0 0 0 2px #fff;border-radius:50%}.hero .avs>*:first-child{margin-left:0}
.obj{background:rgba(255,255,255,.85);border-radius:14px;padding:10px 12px;font-size:13.5px}
.obj b{display:block}
.dn{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dn span{background:var(--or2);color:#9a3410;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.dn span.vio{background:var(--vio2);color:#3f2c8a}

/* ─ priorités ─ */
.pri{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);width:100%;border-left:5px solid var(--line)}
.pri.bad{border-left-color:var(--bad)}.pri.or{border-left-color:var(--or)}.pri.warn{border-left-color:var(--warn)}.pri.ok{border-left-color:var(--ok)}.pri.info{border-left-color:var(--blue)}
.pri .ic{font-size:20px;width:34px;text-align:center;flex:none}
.pri .tx{flex:1;min-width:0}.pri .tx b{display:block;font-size:14.5px}.pri .tx small{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.pri .when{font-size:11.5px;color:var(--mute);white-space:nowrap}
.kt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kt button{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;min-height:64px}
.kt .e{font-size:22px}.kt b{display:block;font-size:14px}.kt small{display:block;color:var(--ink2);font-size:12px}

/* ─ semaine ─ */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{background:#fff;border-radius:14px;padding:8px 4px;box-shadow:var(--sh);text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.day.on{border-color:var(--ink)}
.day b{font-size:16px}
.day .m{font-size:18px}
.day .c{font-size:10.5px;color:var(--ink2);line-height:1.15}
.day .o{font-size:10.5px;background:var(--or2);color:#9a3410;border-radius:6px;padding:1px 5px;font-weight:700}

/* ─ tuiles d'espace ─ */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;min-height:120px;position:relative;overflow:hidden;width:100%}
.tile .e{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.tile b{font-size:15px;line-height:1.15}
.tile small{color:var(--ink2);font-size:12px;line-height:1.3}
.tile .n{position:absolute;top:12px;right:12px}
.tile.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile.big .tx{flex:1}

/* ─ chantiers ─ */
.site{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px;display:flex;gap:12px;align-items:center;width:100%}
.ring{width:54px;height:54px;flex:none;position:relative}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.site .tx{flex:1;min-width:0}
.site .tx b{display:block;font-size:15.5px}
.site .tx small{display:block;color:var(--ink2);font-size:12.5px}
.site .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ─ chantier : en-tête et facettes ─ */
.shead{background:var(--dark);color:#fff;border-radius:0 0 26px 26px;margin:0 -14px;padding:12px 16px 14px;position:sticky;top:34px;z-index:6;box-shadow:var(--sh2)}
.shead .l1{display:flex;align-items:center;gap:10px}
.shead .l1 .back{background:#2f2d29;box-shadow:none;color:#fff}
.shead .l1 h2{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .l1 .mt{font-size:13px;background:#2f2d29;border-radius:10px;padding:5px 9px;white-space:nowrap}
.shead .l2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:#cfcbc3}
.shead .l2 .bar{flex:1;background:#3b3934}.shead .l2 .bar i{background:var(--or)}
.seg{display:flex;background:#2f2d29;border-radius:14px;padding:4px;margin-top:10px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:11px;color:#bfbbb3;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* ─ plan ─ */
.planwrap{position:relative;margin:0 -14px;background:#20262b;height:calc(100vh - 34px - 150px - 66px);min-height:480px;overflow:hidden;border-radius:0 0 26px 26px}
@media(min-width:1000px){.planwrap{margin:0;border-radius:var(--r);height:calc(100vh - 34px - 190px)}}
.planwrap svg.plan{width:100%;height:100%;touch-action:none}
.layers{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.layers .chip{background:rgba(255,255,255,.92);border-color:transparent;min-height:32px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.layers .chip.on{background:var(--ink);color:#fff}
.fab{position:absolute;right:16px;bottom:18px;width:60px;height:60px;border-radius:20px;background:var(--or);color:#fff;font-size:30px;font-weight:800;display:grid;place-items:center;box-shadow:0 10px 28px rgba(232,80,28,.45);transition:transform .15s}
.fab:active{transform:scale(.94)}
.eye{position:absolute;right:16px;bottom:88px;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.zoom{position:absolute;left:12px;bottom:18px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.posebar{position:absolute;left:12px;right:12px;bottom:18px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--or)}
.posebar .pt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.posebar .pt .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:800}
.posebar .st{font-size:13px;color:var(--ink2)}
.posebar .steps{display:flex;gap:6px}
.posebar .steps i{flex:1;height:5px;border-radius:3px;background:var(--gray2)}
.posebar .steps i.on{background:var(--or)}
.posebar .acts{display:flex;gap:8px}
.posebar .acts .btn{flex:1;min-height:40px}
.legend{position:absolute;left:12px;top:56px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.objtag{position:absolute;left:12px;right:84px;bottom:18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.objtag button{flex:none;background:rgba(255,255,255,.95);border-radius:14px;padding:8px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--or)}
.objtag button.vio{border-left-color:var(--vio)}
.objtag b{font-size:13px}
.objtag small{color:var(--ink2)}
.plan2{display:grid;grid-template-columns:1fr 330px;gap:12px;align-items:start}
.side .card{margin-bottom:10px}

/* ─ feuilles (sheet) ─ */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:88vh;overflow:auto;box-shadow:var(--sh2);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:800}
.sheet .s{margin-bottom:10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:92px;border:2px solid transparent;width:100%}
.mode:active,.mode.on{border-color:var(--or)}
.mode .e{font-size:24px}
.mode b{font-size:14px}
.mode small{color:var(--ink2);font-size:12px;line-height:1.25}
.mode.dim{opacity:.45}
.f{display:block;width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:#fff;margin-top:6px}
label.f{border:0;padding:0;min-height:0;font-size:12px;color:var(--ink2);font-weight:700;margin-top:10px}

/* ─ objectifs (vue équipes) ─ */
.team{border-left:3px solid var(--blue);padding-left:8px;margin:12px 0 6px;font-size:12px;color:var(--mute);font-weight:700}
.team.B{border-color:var(--or)}.team.C{border-color:var(--ok)}
.people{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pp{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px;font-weight:700}
.orow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.orow .e{font-size:20px;width:28px;text-align:center;flex:none}
.orow .tx{flex:1;min-width:0}
.orow .tx>b{display:block;font-size:14.5px}
.orow .tx small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.orow .acts{display:flex;gap:4px;flex:none}
.orow .acts .btn{min-height:34px;padding:0 9px;font-size:13px}

/* ─ KPI ─ */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.kpi small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}.kpi.or b{color:var(--or)}

/* ─ divers ─ */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.map{position:relative;height:220px;border-radius:var(--r);overflow:hidden;background:#dfe7dd;box-shadow:var(--sh);margin-bottom:10px}
.map svg{width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#fff}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--or);box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.3)}
.pin span{background:rgba(27,26,23,.85);padding:2px 6px;border-radius:6px;white-space:nowrap}
.vmap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vmap .c{background:#fff;border-radius:14px;padding:10px;font-size:12.5px;box-shadow:var(--sh)}
.vmap .c b{display:block;font-size:13px;margin-bottom:4px}
.vmap .c .old{color:var(--mute);text-decoration:line-through}
.vmap .c .arr{color:var(--or);font-weight:800}
</style>

<script>
/* ════ KIT AVATAR SCR — DÉBUT : avatar-scr.js repris tel quel, ne rien modifier ici ════ */
/*
 * Kit avatar SCR - a integrer dans l'appli.
 *
 * avatarModele(profil, contexte) -> tout ce qu'un ecran doit afficher (cfg de l'avatar, listes d'options, paliers, textes)
 * avatarConfig(profil, contexte) -> cfg de l'avatar a dessiner maintenant
 * avatarSVG(cfg, taille)         -> chaine SVG du personnage en pied (ratio 240 x 420)
 * avatarMedaillon(cfg, diametre, fond, cadre) -> photo de profil ronde
 * AVATAR_CATALOGUE               -> postes, options, paliers, seuils (id + libelle)
 *
 * PROFIL = ce que l'appli stocke par utilisateur (voir EditorLogic.profilInitial) :
 *   poste, genre, peau, cheveux, couleur, barbe, lunettes, casque (null = defaut du poste | true | false),
 *   bouche ('rien' | 'cigarette' | 'chewing' = bulle de chewing-gum),
 *   haut, hautCouleur, bas, basCouleur, chaussures, chaussuresCouleur, accessoire, bandana
 *        -> tenue AU TRAVAIL. Une piece = un TYPE (hautTypes, basTypes, chaussuresTypes) + une TEINTE (teintes).
 *           null = tenue du poste / teinte par defaut. Ignores sur les postes terrain (EPI impose), sauf bandana.
 *   pHaut, pHautCouleur, pBas, pBasCouleur, pChaussures, pChaussuresCouleur, pAccessoire, pCoiffe, pBandana
 *        -> tenue HORS TRAVAIL (libre pour tous)
 *   bandana / pBandana : id de AVATAR_CATALOGUE.bandanas (unis, pois, techno, pays = 3 couleurs). Pour couvrir
 *        tous les pays : ajouter une ligne par pays, ou brancher une bibliotheque de drapeaux SVG comme motif.
 *   palier (palier d'outil equipe, null = le plus haut debloque), palierGants (idem pour les gants),
 *   medaille (true / false : porter ou non sa medaille d'anciennete), fond (fond du medaillon)
 *
 * CONTEXTE = ce que l'appli calcule a l'affichage, jamais saisi par le salarie :
 *   vue: 'travail' | 'perso'      -> selon le pointage / les horaires : EPI en heures de travail, tenue perso sinon
 *   meteo: 'chaud' | 'frais' | 'froid' | 'pluie' -> couche de la tenue terrain :
 *          chaud = t-shirt HV manches longues, frais = sweat HV, froid = veste HV, pluie = tenue de pluie verte haut + bas.
 *          Sous forte pluie : chasuble orange par-dessus la veste de pluie. T-shirt et tenue de pluie sans bandes reflechissantes.
 *          Le soudeur garde toujours sa veste en cuir (risque de feu) : sous forte pluie, seul le pantalon de pluie s'ajoute. Bas de travail unique : jean technique marine.
 *          Casque impose en tenue de travail pour les postes terrain ; au choix pour l'encadrement et le bureau.
 *   realisations: compteur de production du poste (pouces soudes, pouces manchonnes, heures d'engin) -> paliers Bronze / Argent / Or / Diamant,
 *          seuils par poste dans AVATAR_CATALOGUE.postes[].seuils : outil recolore (porte-electrode, meuleuse, chalumeau, talkie) + cadre du medaillon.
 *   jours: jours sans accident -> une etoile sur le casque par annee pleine (365 jours), 10 etoiles au maximum.
 *   qualite: jours de qualite d'affilee (voir postes[].qualite) -> couleur des gants.
 *          Manchonneur, jours DH OK : Bronze 6 mois (182 j) / Argent 1 an (365 j) / Or 2 ans (730 j) / Diamant 3 ans (1 095 j), en jours calendaires.
 *          Tuyauteur, jours "fils sur le dessus" : Bronze 2 mois (61 j) / Argent 4 mois (122 j) / Or 7 mois (213 j) / Diamant 1 an (365 j).
 *            Regles a coder : la chaine casse des qu'un fil est pose sur le cote a plus de 45 degres (45 exclu : pile 45 ne casse pas).
 *            Seuls les assemblages tube sur tube comptent ; les assemblages piece sur tube sont ignores.
 *            Perimetre : uniquement les tubes soudes par le soudeur auquel le tuyauteur est rattache (meme rattachement que ses pouces),
 *            et uniquement quand le tube pose est NEUF, c'est-a-dire pas encore soude a son autre extremite
 *            (un tube deja soude de l'autre bout ne peut plus etre tourne : il ne compte pas, ni en bien ni en mal).
 *          Pour le soudeur, la qualite se mesure par les radios (voir radio), pas par ce compteur.
 *   Soudeur : pas de casque sur la tete en tenue de travail, masque de soudage releve a la place, casque pose a ses pieds
 *          (les etoiles de securite restent sur ce casque). Sous forte pluie il garde son cuir, seul le pantalon de pluie s'ajoute.
 *   realisations (soudeur) : pouces soudes declares -> couleur du porte-electrode.
 *          Seuils : Bronze 11 000 / Argent 22 500 / Or 34 000 / Diamant 56 000, soit 1, 2, 3 et 5 ans d'activite
 *          a 60 pouces par jour, semaines de 4 jours, 47 semaines travaillees par an (188 jours, 11 280 pouces par an).
 *   realisations (manchonneur, tuyauteur) : meme unite et meme bareme que le soudeur, le pouce.
 *          - Manchonneur : il pointe ce qu'il a manchonne ; chaque manchon compte pour les pouces du DN de la soudure manchonnee.
 *          - Tuyauteur : il n'a pas de pointage propre ; il recoit les pouces soudes par le soudeur avec qui il fait equipe.
 *            L'appli doit donc enregistrer la composition des equipes (quel tuyauteur travaille avec quel soudeur, jour par jour)
 *            et crediter le tuyauteur des pouces de son soudeur sur les jours travailles ensemble.
 *            S'il travaille avec deux soudeurs, on CUMULE les pouces des deux.
 *   radio (soudeur) : c'est l'indicateur QUALITE du soudeur. % de radios conformes sur les 50 dernieres soudures tirees -> teinte du masque de soudage
 *          (Bronze 90 / Argent 95 / Or 98 / Diamant 100). C'est un taux : le masque peut redescendre.
 *   cadence (soudeur) : record de semaines d'affilee au-dessus de la cadence moyenne (semaines de 4 jours, moyenne a la semaine)
 *          -> une etincelle au bout de l'electrode par semaine du record : 40 dessinees au maximum (trois couronnes de 12, puis 4 en diagonale) ;
 *             le compteur n'a pas de plafond. Couleur : Bronze des 1 semaine, Argent 3, Or 4, Diamant 8. C'est un record : il reste acquis.
 *   cadence (manchonneur) : meme compteur et memes paliers -> une flamme au bout du flambard, qui s'epaissit chaque semaine
 *          du record jusqu'a 12, puis une braise ou une etincelle s'ajoute chaque semaine jusqu'a 40, avec un halo a 13, 25 et 37
 *          et deux flammeches laterales a 25 et 31. Couleur selon le palier (bleue au Diamant). Voir postes[].cadence.
 *   Tuyauteur : casque sur la tete, et une cagoule de soudure noire posee a ses pieds (postes[].cagouleSol).
 *   cadence (tuyauteur) : une semaine compte quand le CUMUL des pouces de ses soudeurs (un ou deux) depasse la cadence moyenne
 *          d'UN soudeur (meme moyenne de reference que pour le soudeur, a la semaine de 4 jours)
 *          -> une gerbe d'etincelles sort du disque de la meuleuse : une etincelle par semaine du record, 40 dessinees au maximum.
 *   Chauffeur d'engin : meme veste HV que les autres, un talkie-walkie glisse dans la poche de cuisse du pantalon (plus en main).
 *          realisations = heures d'engin -> couleur du talkie. Seuils 1 900 / 3 800 / 5 600 / 9 400, soit 1, 2, 3 et 5 ans
 *          a 10 heures d'engin par jour, semaines de 4 jours, 47 semaines travaillees par an (188 jours, 1 880 heures par an).
 *          qualite = jours sans sinistre -> gants : Bronze 1 an (365 j) / Argent 2 ans (730 j) / Or 3 ans (1 095 j) / Diamant 5 ans (1 825 j).
 *          Pas de recompense de cadence pour le chauffeur (les calques d'ondes du talkie existent mais ne sont pas utilises).
 *   Plus aucun effet brillant autour des outils ni des gants : seule la couleur indique le palier.
 *   Recompenses de production reservees aux operateurs (soudeur, tuyauteur, manchonneur, chauffeur d'engin) :
 *          rien pour le chef de chantier (postes[].sansRecompense), l'encadrement et le bureau, hors medaille d'anciennete.
 *   anciennete: annees pleines depuis la date d'entree -> medaille d'anciennete, pour tous les postes, portee au choix du salarie.
 *          Le disque affiche le nombre d'annees. Niveaux : 1 an bronze, 3 argent, 5 or, 7 barrette, 10 rayons, 12 rayons et barrette, 15 lauriers, 20 diamant couronne.
 *          Portee par defaut (medaille: true), le salarie peut l'enlever.
 *   Seuils et unites sont dans AVATAR_CATALOGUE (paliers, etoiles, postes[].unite) : a ajuster.
 *
 * Logo : texte "SCR" provisoire, a remplacer par le vrai logo vectoriel.
 */
class DCLogic { setState() {} }
class AvatarLogic extends DCLogic {
  resolve(c) {
    var SKIN = { p1: '#FBD9BF', p2: '#F1C39F', p3: '#DDA57A', p4: '#B9794E', p5: '#8D5637', p6: '#5E3A26' };
    var HAIR = { noir: '#1E1B1A', brun: '#4A3020', chatain: '#7A4E2B', blond: '#D8B25A', roux: '#B5532A', gris: '#9A9A9A', blanc: '#E5E3DE' };
    var TOPS = {
      hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['hv'] },
      hvbi: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['hv', 'bi'] },
      soudeur: { fill: '#CDAA7D', line: '#9C7A4E', cut: 'long', ov: ['soudeur'] },
      gilet: { fill: '#23262D', line: '#111318', cut: 'long', ov: ['gilet'] },
      softshell: { fill: '#1E2A44', cut: 'long', ov: ['soft'], teint: true },
      chemise_blanche: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'long', ov: ['chemise'] },
      chemise_bleue: { fill: '#C3D7F0', line: '#8FA9CF', cut: 'long', ov: ['chemise'] },
      chemisier_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'long', ov: ['chemisier'] },
      chemisier_rose: { fill: '#F2C6C0', line: '#CC958E', cut: 'long', ov: ['chemisier'] },
      blazer_marine: { fill: '#1E2A44', line: '#121A2E', cut: 'long', ov: ['blazer'] },
      tshirt_hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['tee'] },
      sweat_hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['sweat'] },
      pluie: { fill: '#2E7D55', line: '#1B5639', cut: 'long', ov: ['pluie', 'chasuble'] },
      tshirt: { fill: '#23262D', cut: 'short', ov: ['tee'], teint: true },
      polo: { fill: '#1E2A44', cut: 'short', ov: ['polo'], teint: true },
      chemise: { fill: '#FFFFFF', cut: 'long', ov: ['chemise'], teint: true },
      chemisier: { fill: '#FFFFFF', cut: 'long', ov: ['chemisier'], teint: true },
      sweat: { fill: '#8E96A3', cut: 'long', ov: ['sweat'], teint: true },
      hoodie: { fill: '#8E96A3', cut: 'long', ov: ['hoodie'], teint: true },
      blazer: { fill: '#1E2A44', cut: 'long', ov: ['blazer'], teint: true },
      hoodie_gris: { fill: '#8E96A3', line: '#636D7C', cut: 'long', ov: ['hoodie'] },
      hoodie_noir: { fill: '#23262D', line: '#111318', cut: 'long', ov: ['hoodie'] },
      polo_marine: { fill: '#1E2A44', line: '#121A2E', cut: 'short', ov: ['polo'] },
      polo_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'short', ov: ['polo'] },
      tshirt_noir: { fill: '#23262D', line: '#111318', cut: 'short', ov: ['tee'] },
      tshirt_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'short', ov: ['tee'] }
    };
    var BAS = {
      pantalon: { fill: '#1E2A44', teint: true },
      short: { fill: '#CDB391', shape: 'bermuda', teint: true },
      pantalon_78: { fill: '#1E2A44', shape: 'pant78', teint: true },
      jupe: { fill: '#1E2A44', shape: 'jupe', teint: true },
      pluie_bas: { fill: '#2E7D55', line: '#1B5639' },
      travail: { fill: '#1E2A44', line: '#121A2E', ov: 'cargo' },
      travail_noir: { fill: '#34363C', line: '#1D1E22', ov: 'cargo' },
      marine: { fill: '#1E2A44', line: '#121A2E' },
      chino: { fill: '#CDB391', line: '#A38A68' },
      jean: { fill: '#4F77A8', ov: 'jean', teint: true }
    };
    var SHOES = {
      ville: { fill: '#6B3A22', sole: '#2A1710', teint: true },
      escarpins: { fill: '#23262D', sole: '#000000', shape: 'shoeFin', teint: true },
      ballerines: { fill: '#C4816F', sole: '#000000', shape: 'shoeFin', teint: true },
      secu: { fill: '#B07A45', sole: '#3A2A1C', teint: true },
      cuir: { fill: '#6B3A22', line: '#4A2614', sole: '#2A1710' },
      baskets: { fill: '#FFFFFF', sole: '#AEB7C4', teint: true },
      noires: { fill: '#23262D', line: '#111318', sole: '#000000' }
    };
    var GLOVES = {
      travail: { fill: '#C9A46A', line: '#9C7A44', flag: 'gants' },
      soudeur: { fill: '#B9B2A4', line: '#8C8576', flag: 'gantsLongs' }
    };
    var HAIRF = {
      chauve: [], degarni: ['h_degarni'], court: ['h_court'], brosse: ['h_brosse'], meche: ['h_meche'], milong: ['h_milong'],
      long: ['b_long', 'h_long'], chignon: ['h_raie', 'v_chignon'], queue: ['b_queue', 'h_raie'], boucle: ['h_court', 'v_boucle']
    };
    var f = {};
    function fonce(hex, k) {
      var n = parseInt(String(hex).slice(1), 16);
      var r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function teinte(base, couleur, sombre) {
      if (!base.teint || !couleur) return base.line ? base : Object.assign({}, base, { line: fonce(base.fill, 0.72) });
      return Object.assign({}, base, { fill: couleur, line: fonce(couleur, 0.72), sole: sombre ? fonce(couleur, 0.45) : base.sole });
    }
    var top = teinte(TOPS[c.haut] || TOPS.hv, c.hautCouleur);
    var bas = teinte(BAS[c.bas] || BAS.travail, c.basCouleur);
    var shoeBase = SHOES[c.chaussures] || SHOES.secu;
    var shoe = teinte(shoeBase, c.chaussuresCouleur, c.chaussures !== 'baskets');
    var glove = GLOVES[c.gants];
    var casque = c.casque === true || c.casque === 'true';
    f[top.cut] = true;
    top.ov.forEach(function (k) { f[k] = true; });
    if (bas.ov) f[bas.ov] = true;
    f[bas.shape || 'pant'] = true;
    f[shoe.shape || 'shoeStd'] = true;
    var coiffe = !casque && (c.coiffe === 'casquette' || c.coiffe === 'bonnet') ? c.coiffe : null;
    if (coiffe) f[coiffe] = true;
    (HAIRF[c.cheveux] || []).forEach(function (k) {
      if ((casque || coiffe || c.masque) && k.indexOf('v_') === 0) return;
      f[k] = true;
    });
    f['barbe_' + c.barbe] = true;
    f['lun_' + c.lunettes] = true;
    f['acc_' + c.accessoire] = true;
    f['bouche_' + c.bouche] = true;
    f.casque = casque;
    var casqueSol = !casque && (c.casqueSol === true || c.casqueSol === 'true');
    if (casqueSol) f.casqueSol = true;
    if (c.cagouleSol === true || c.cagouleSol === 'true') f.cagouleSol = true;
    var nEt = Math.min(10, Number(c.etoiles) || 0);
    for (var iEt = 1; iEt <= nEt; iEt++) {
      if (casque) f['etoile' + iEt] = true;
      if (casqueSol) f['solEtoile' + iEt] = true;
    }
    var OUTIL = {
      meuleuse: { fill: '#178F8F', line: '#0F6B6B', light: '#3A404B', dark: '#0F6B6B' },
      torche: { fill: '#D4261C', line: '#8F1A12', light: '#E8584F', dark: '#2A2E36' },
      chalumeau: { fill: '#B5882C', line: '#8D96A3', light: '#C3CAD3', dark: '#8D96A3' },
      talkie: { fill: '#2A2E36', line: '#0F1115', light: '#4A515D', dark: '#0F1115' }
    };
    var METAL = {
      bronze: { fill: '#C4803F', line: '#8C5522', light: '#E3AE78', dark: '#8C5522' },
      argent: { fill: '#CDD2DA', line: '#858E9C', light: '#EEF1F5', dark: '#858E9C' },
      or: { fill: '#EBBB1F', line: '#A87C08', light: '#F9E28A', dark: '#A87C08' },
      diamant: { fill: '#9EE7F2', line: '#3FA3BA', light: '#E6FBFD', dark: '#3FA3BA' }
    };
    var gm = glove ? METAL[c.gantsPalier] : null;
    if (gm) {
      glove = { fill: gm.fill, line: gm.line, flag: glove.flag };
    }
    var bd = c.bandana && c.bandana.length >= 3 && !coiffe ? c.bandana : null;
    if (bd) {
      f.bandana = true;
      if (bd[3] === 'pois') f.band_pois = true;
      if (bd[3] === 'zig') f.band_zig = true;
    }
    var OR = { r1: '#1E2A44', r2: '#F26A1B', d: '#EBBB1F', l: '#8A6500', t: '#4A3600' };
    var NIV = [null,
      { r1: '#1E2A44', r2: '#1E2A44', d: '#C98A4B', l: '#6E3F12', t: '#3A1F06' },
      { r1: '#1E2A44', r2: '#FFFFFF', d: '#D9DEE5', l: '#5F6875', t: '#2A303A' },
      OR, OR, OR, OR,
      { r1: '#B3261E', r2: '#EBBB1F', d: '#EBBB1F', l: '#8A6500', t: '#4A3600' },
      { r1: '#1E2A44', r2: '#9EE7F2', d: '#A6ECF5', l: '#17667A', t: '#0E3F4C' }
    ];
    var ans = Math.floor(Number(c.medailleAns) || 0);
    var niv = Math.max(0, Math.min(8, Number(c.medailleNiveau) || 0));
    var mv = {};
    if (ans >= 1 && niv >= 1) {
      var nv = NIV[niv];
      f.medaille = true;
      if (niv >= 5) f.medRayons = true;
      if (niv === 4 || niv >= 6) f.medBarrette = true;
      if (niv >= 7) f.medLauriers = true;
      if (niv >= 8) f.medCouronne = true;
      mv = { medR1: nv.r1, medR2: nv.r2, medRL: '#0F1626', medD: nv.d, medL: nv.l, medT: nv.t, medN: String(ans) };

  /* Profil + contexte (vue, meteo, realisations, jours, qualite, radio, cadence, anciennete) -> tout ce que l'ecran affiche. Aucune dependance a l'interface. */

    var cadence = Number(s.cadence) || 0;

    K.paliersRadio.forEach(function (p, i) { if (radio >= p.seuil) iRadio = i; });

    var iCad = -1;
    K.paliersCadence.forEach(function (p, i) { if (cadence >= p.seuil) iCad = i; });

    PAL.forEach(function (p, i) { if (real >= p.seuil) deb = i; });

    PAL.forEach(function (p, i) { if (p.id === s.palier && i <= deb) eq = i; });
    var palier = PAL[eq];
    var PALQ = K.paliersQualite.map(function (p, i) { return P.seuilsQualite ? Object.assign({}, p, { seuil: P.seuilsQualite[i], duree: (P.dureesQualite || [])[i] }) : p; });
    var debQ = 0;

    var etoiles = Math.min(K.etoilesMax, Math.floor(jours / K.etoileJours));

    var tH, tB, tC, tenuePoste;

    /* Vignettes des types d'une pièce, puis pastilles de teintes pour le type sélectionné. */

        var c2 = Object.assign({}, cfg, buste);

      ],

function avatarConfig(profil, contexte) { return avatarModele(profil, contexte).cfg; }

function avatarSVG(cfg, taille) {
  const c = Object.assign({}, AVATAR_DEFAUT, cfg);
  const v = new AvatarLogic().resolve(c);
  const t = taille || 240;
  const corps = AVATAR_CALQUES.filter(l => !l.si || v.f[l.si]).map(l => l.svg.replace(/\{\{(\w+)\}\}/g, (m, k) => v[k])).join('');

}

function avatarMedaillon(cfg, diametre, fond, cadre) {

  return '<span style="display:inline-block;flex:none;position:relative;width:' + d + 'px;height:' + d + 'px;border-radius:50%;overflow:hidden;background:' + (fond || '#E3E8EF') + anneau + '">'

}

function at(m,off){let seg=PL.segs[PL.segs.length-1];for(const s of PL.segs){if(m<=s.acc+s.L){seg=s;break;}}const t=Math.max(0,Math.min(1,(m-seg.acc)/seg.L));const x=seg.a[0]+(seg.b[0]-seg.a[0])*t,y=seg.a[1]+(seg.b[1]-seg.a[1])*t;const nx=-(seg.b[1]-seg.a[1])/seg.L,ny=(seg.b[0]-seg.a[0])/seg.L;return [x+nx*(off||0),y+ny*(off||0)];}
const NW=34;const WELDS=Array.from({length:NW},(_,i)=>{const m=40+i*((PL.len-80)/(NW-1));return {i,m,id:'S-'+String(119+i).padStart(4,'0'),dn:i<16?150:100,st:i<9?'manch':i<21?'soud':i<23?'ctrl':'a',dh:i%6===2};});

function pathOf(off){return PL.segs.map((s,i)=>{const p0=at(s.acc,off),p1=at(s.acc+s.L,off);return (i?'L':'M')+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1);}).join(' ');}

let drag=null;document.addEventListener('pointerdown',e=>{const sv=e.target.closest('#plansvg');if(!sv||e.target.closest('[data-w]'))return;drag={x:e.clientX,y:e.clientY,pan:[...S.pan],moved:false,sv};});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(!drag.moved)return;const r=drag.sv.getBoundingClientRect();const k=(960/S.zoom)/r.width;S.pan=[drag.pan[0]+dx*k,drag.pan[1]+dy*k];drag.sv.setAttribute('viewBox',`${20-S.pan[0]} ${60-S.pan[1]} ${960/S.zoom} ${460/S.zoom}`);});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.moved||!S.pose||S.pose.mode!=='obj')return;
  /* tap sur la conduite (pas sur une soudure) : début puis fin, calés sur la soudure la plus proche */
  const r=d.sv.getBoundingClientRect();const vb=d.sv.viewBox.baseVal;const sc=Math.max(vb.width/r.width,vb.height/r.height);const ox=(r.width-vb.width/sc)/2,oy=(r.height-vb.height/sc)/2;const x=vb.x+(e.clientX-r.left-ox)*sc,y=vb.y+(e.clientY-r.top-oy)*sc;let best=null;WELDS.forEach(w=>{const q=at(w.m,0);const dd=Math.hypot(q[0]-x,q[1]-y);if(!best||dd<best.d)best={d:dd,i:w.i};});if(!best||best.d>40){toast('Touche la conduite (zoome si besoin)');return;}
  const p=S.pose;if(p.a==null){p.a=best.i;toast('Début · '+WELDS[best.i].id+' — touche la fin');}else{p.b=best.i;}render();});
