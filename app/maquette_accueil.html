<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a3636">
<title>TRACÉ — maquette : accueil général et espaces</title>
<!--
  MAQUETTE « ACCUEIL GÉNÉRAL + ESPACES » — TRACÉ / SCR — 09/10/2026 (soir)
  Ce que montre cette page (cliquable, données de démonstration, semaine 41) :
   1. L'ACCUEIL GÉNÉRAL personnel : avatar, « Aujourd'hui » (chantier du jour, météo, tenue, équipe), les PRIORITÉS de la personne, puis les ESPACES (icônes).
   2. Les ESPACES selon le métier : Mes chantiers · Exploitation (encadrement : planning, pointages, habilitations de l'équipe, commandes à venir, traceur)
      · RH & équipe (support) · Mon espace (perso) · Entreprise · Administrateur. Chaque espace a son menu ; la barre du bas garde Accueil / Chantiers / (Exploitation) / Mon espace.
   3. La règle d'or : les plus grosses priorités de chacun remontent sur l'accueil (pas enfermées dans Exploitation).
  Barre du haut (n'existe pas dans l'appli) : « voir comme » — passe d'un métier à l'autre pour comparer les accueils.
  Les avatars sont dessinés par le vrai kit (bloc KIT AVATAR SCR, tel quel). Rien n'est branché : quand c'est validé, on porte dans l'appli.
-->
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#15140f;--ink2:#605c54;--mute:#8e8a80;--line:#e7e4dc;--or:#e8501c;--or2:#fdebe3;--dark:#3a3636;
  --ok:#1f9d55;--ok2:#e6f5ec;--warn:#d98f06;--warn2:#fff4d6;--bad:#d6473a;--bad2:#fdeae7;--blue:#2a78d6;--blue2:#e8f0fb;--vio:#6b4bd6;--vio2:#efeafb;--teal:#128a8a;--teal2:#e3f3f3;--gray2:#ececea;
  --sh:0 1px 2px rgba(20,20,10,.04),0 8px 24px rgba(20,20,10,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
b{font-weight:700}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 92px}
@media(min-width:1000px){.wrap{max-width:980px}}

/* ─ barre de la maquette (n'existe pas dans l'appli) ─ */
.mq{position:sticky;top:0;z-index:60;background:var(--dark);color:#fff;font-size:12px;display:flex;align-items:center;gap:10px;padding:7px 14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mq .tag{background:var(--or);color:#fff;font-weight:800;letter-spacing:.08em;font-size:10.5px;padding:3px 7px;border-radius:6px}
.mq label{opacity:.8;white-space:nowrap}
.mq select{flex:1;min-width:0;background:#4a4545;color:#fff;border:1px solid #5d5858;border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}
.mq .hint{opacity:.6;display:none}
@media(min-width:700px){.mq .hint{display:inline}}

/* ─ en-têtes ─ */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:13px}
.brand img{width:26px;height:20px;object-fit:contain}
.avbtn{border-radius:50%;line-height:0}
h1.hi{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;line-height:1.15}
.date{color:var(--ink2);font-size:13px;margin-top:2px}
.sh{display:flex;align-items:center;gap:10px;padding:12px 0 10px;position:sticky;top:34px;z-index:5;background:linear-gradient(var(--bg) 80%,rgba(243,242,238,0))}
.back{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.sh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .sub{display:block;font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:0}
.h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;gap:10px}
.h b{font-size:17px;font-weight:800}
.h span{font-size:12.5px;color:var(--mute)}
.h .lnk{font-size:12.5px;color:var(--or);font-weight:600}

/* ─ cartes génériques ─ */
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kick{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.s{font-size:13px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.or{background:var(--or);color:#fff;border-color:var(--or)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.ctas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ctas .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--gray2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar.or i{background:var(--or)}.bar.ok i{background:var(--ok)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tagx{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--gray2);color:var(--ink2);white-space:nowrap}
.tagx.or{background:var(--or2);color:#9a3410}.tagx.ok{background:var(--ok2);color:#15673a}.tagx.bad{background:var(--bad2);color:#9b2c22}.tagx.warn{background:var(--warn2);color:#7a5200}.tagx.blue{background:var(--blue2);color:#1c4f8c}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);width:100%;min-height:68px}
.row .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.row .ic svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px}
.row .tx small{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.row .chev{color:var(--mute);flex:none}
.row.soon{opacity:.55}
.n{min-width:22px;height:22px;border-radius:999px;background:var(--or);color:#fff;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 7px;flex:none}
.n.dark{background:var(--ink)}.n.bad{background:var(--bad)}.n.ok{background:var(--ok)}

/* ─ héros ─ */
.hero{border-radius:22px;padding:16px;display:flex;gap:14px;box-shadow:var(--sh);margin-top:14px;overflow:hidden;position:relative}
.hero .fig{flex:none;width:112px;align-self:flex-start}
.hero .figin{position:relative;display:block;width:112px}
.hero .fig svg{display:block;position:relative;z-index:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))}
.hero .fig .sol{position:absolute;left:14%;bottom:1px;width:72%;height:8px;border-radius:50%;background:rgba(0,0,0,.14)}
.hero .r{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hero .hsite{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.01em;background:rgba(255,255,255,.78);border-radius:14px;padding:10px 12px}
.hero .mt{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.2;align-self:flex-start}
.hero .mt .e{font-size:24px;line-height:1}
.hero .mt b{display:block}
.team{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.team .avs{display:flex}
.team .avs>span{margin-left:-8px;box-shadow:0 0 0 2px #fff;border-radius:50%}
.team .avs>span:first-child{margin-left:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:rgba(255,255,255,.75);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:20px;line-height:1.1;letter-spacing:-.02em}
.stat small{font-size:11.5px;color:var(--ink2);line-height:1.2;display:block}
.stat.bad b{color:var(--bad)}.stat.ok b{color:var(--ok)}

/* ─ priorités ─ */
.prio{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:8px;box-shadow:var(--sh);width:100%}
.prio .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.prio .ic svg{width:21px;height:21px}
.prio .tx{flex:1;min-width:0}
.prio .tx b{display:block;font-size:14.5px;line-height:1.25}
.prio .tx small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.prio .chev{color:var(--mute);flex:none}
.sev-bad .ic{background:var(--bad2);color:var(--bad)}.sev-warn .ic{background:var(--warn2);color:var(--warn)}.sev-info .ic{background:var(--blue2);color:var(--blue)}.sev-ok .ic{background:var(--ok2);color:var(--ok)}.sev-or .ic{background:var(--or2);color:var(--or)}
.empty{background:var(--ok2);color:#15673a;border-radius:16px;padding:14px;font-weight:600}

/* ─ espaces (icônes) ─ */
.spaces{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:1000px){.spaces{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;background:#fff;border-radius:20px;padding:16px 8px 13px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:9px;min-height:112px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center}
.tile .ic svg{width:27px;height:27px}
.tile b{font-size:13px;line-height:1.2;letter-spacing:-.01em}
.tile .n{position:absolute;top:9px;right:9px}
.tile.off{opacity:.5}
.t-chant .ic{background:var(--blue2);color:var(--blue)}.t-expl .ic{background:var(--or2);color:var(--or)}.t-moi .ic{background:var(--ok2);color:var(--ok)}.t-ent .ic{background:var(--vio2);color:var(--vio)}.t-adm .ic{background:var(--gray2);color:#555}.t-trac .ic{background:var(--teal2);color:var(--teal)}.t-rh .ic{background:var(--warn2);color:var(--warn)}

/* ─ chantiers ─ */
.site{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);width:100%;position:relative}
.site .nm{display:flex;align-items:flex-start;gap:10px}
.site .nm b{flex:1;font-size:16px;line-height:1.2}
.site .meta{font-size:12.5px;color:var(--ink2);margin:4px 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.site .pct{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:5px}
.site.lock{opacity:.5;filter:grayscale(.6)}
.map{height:230px;border-radius:18px;background:#e9ece6;position:relative;overflow:hidden;box-shadow:var(--sh);margin-bottom:12px}
.map .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:28px 28px}
.map .lab{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--mute)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink)}
.pin i{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--or);display:block;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin.lock{opacity:.4}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs .chip{font-size:12.5px}
.ph{border:2px dashed var(--line);border-radius:18px;padding:26px 16px;text-align:center;color:var(--ink2);font-size:13.5px;background:rgba(255,255,255,.5)}
.ph b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ─ planning ─ */
.plprog{display:flex;align-items:center;gap:10px;font-size:13.5px}
.plprog b{font-size:18px;white-space:nowrap}
.plprog .bar{flex:1}
.pp{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-top:6px}
.pp.sel{border-color:var(--or);box-shadow:0 0 0 2px var(--or)}
.pp .tx{flex:1;min-width:0}
.pp .tx b{display:block;font-size:14px}
.pp .tx small{display:block;font-size:12px;color:var(--ink2)}
.dots{display:flex;gap:3px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--gray2);color:var(--mute);font-size:10px;font-style:normal;font-weight:800;display:inline-grid;place-items:center}
.dots i.on{background:var(--ink);color:#fff}
.pl{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1.5px solid transparent}
.pl.drop{border-style:dashed;border-color:var(--or)}
.pl .hd{display:flex;align-items:center;gap:10px}
.pl .hd b{flex:1;font-size:15.5px;line-height:1.2}
.pl .hd small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.plmeteo{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.plmeteo span{display:flex;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:3px 2px;white-space:nowrap}
.plmeteo b{color:var(--ink);font-weight:600}
.tray{position:sticky;top:92px;z-index:3}

/* ─ Mon espace ─ */
.me{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--sh);margin-top:4px}
.me .tx{flex:1;min-width:0}
.me .tx b{display:block;font-size:19px;letter-spacing:-.01em}
.me .tx small{display:block;color:var(--ink2);font-size:13px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--ink2);border:1px solid transparent}
.day.now{border-color:var(--ink);background:#fff}
.day b{display:block;font-size:15px;color:var(--ink)}
.day .e{display:block;font-size:20px;line-height:1.2;margin:3px 0}
.day small{display:block;font-size:10.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-of-type{border-top:0}
.hrow .tx{flex:1;min-width:0}
.hrow small{display:block;font-size:12px;color:var(--ink2)}
.kv{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv span:first-child{width:110px;flex:none;color:var(--ink2);font-size:12.5px;padding-top:1px}
.pt{display:flex;align-items:center;gap:12px}
.pt .big{font-size:22px;font-weight:800;letter-spacing:-.02em}

/* ─ Entreprise ─ */
.grp{margin-bottom:14px}
.grp h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.pers{width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;background:#fff;border-radius:14px;box-shadow:var(--sh);text-align:center;font-size:12.5px;line-height:1.2}
.pers b{font-size:13px}
.pers small{color:var(--ink2);font-size:11px}

/* ─ barre du bas ─ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:620px;margin:0 auto;display:flex}
@media(min-width:1000px){.tabbar .in{max-width:980px}}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{color:var(--or)}

/* ─ divers ─ */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;text-align:center}
.toast.show{opacity:1}
.sheetbg{position:fixed;inset:0;background:rgba(11,11,11,.35);z-index:80}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 14px 24px;z-index:81;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .hdl{width:40px;height:4px;border-radius:2px;background:#cfccc4;margin:4px auto 10px}
.foot{font-size:11.5px;color:var(--mute);margin:26px 0 0;text-align:center}
.two{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:1000px){.two{grid-template-columns:1fr 1fr;align-items:start}.two>.span{grid-column:1/3}}
.hero .r .kick{opacity:.8}
.note{background:var(--warn2);border-radius:14px;padding:10px 12px;font-size:12.5px;color:#6b4a00;margin-top:10px}

/* ─ pointage (sous « Aujourd'hui ») : un état, une couleur, un geste ─ */
.ptc{border-radius:18px;padding:14px;margin-top:10px;box-shadow:var(--sh);background:#fff;border-left:6px solid var(--mute)}
.ptc.pt-off{border-left-color:var(--mute)}.ptc.pt-on{border-left-color:var(--ok)}.ptc.pt-pause{border-left-color:var(--warn)}.ptc.pt-done{border-left-color:var(--ink)}
.ptl{display:flex;align-items:center;gap:8px}
.ptdot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.pt-on .ptdot{background:var(--ok);box-shadow:0 0 0 4px rgba(31,157,85,.18);animation:pulse 1.6s infinite}.pt-pause .ptdot{background:var(--warn)}.pt-done .ptdot{background:var(--ink)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,85,.35)}70%{box-shadow:0 0 0 7px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.ptbig{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.pt-on .ptbig{color:#15673a}.pt-pause .ptbig{color:#7a5200}
.ptc .ctas{margin-top:10px}
/* ─ Ma semaine : jours cliquables + scène du jour ─ */
.day{cursor:pointer;width:100%}
.day.today b::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--or);margin-left:3px;vertical-align:top}
.scene{border-radius:16px;padding:12px;margin-top:10px}
.sc-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.sc-tx{flex:1;min-width:0}
.sc-tx b{display:block;font-size:16px;line-height:1.2;margin:2px 0}
.scene .mt{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.2;flex:none}
.scene .mt .e{font-size:22px;line-height:1}
.scene .mt b{display:block}
.sc-sol{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 10px;margin-top:12px;padding-bottom:4px;border-bottom:4px solid rgba(0,0,0,.08)}
.sc-p{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px}
.sc-p>span{background:rgba(255,255,255,.8);border-radius:999px;padding:1px 9px;white-space:nowrap}
.sc-p.moi>span{background:var(--ink);color:#fff;font-weight:600}

/* ─ « À faire » (actions attendues : cartes blanches) / « À savoir » (infos : cartes légères) ─ */
.h .st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.h .st.ok{background:var(--ok2);color:#15673a}.h .st.or{background:var(--or2);color:#9a3410}
.prio.k{background:transparent;box-shadow:none;border:1px solid var(--line)}
.prio.k .tx b{font-weight:600}

.wait{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:#7a5200;background:var(--warn2);border-radius:6px;padding:2px 7px}

/* ─ « À faire » = notifications (icône, titre, heure) ; « À savoir » = raccourcis de consultation (tuiles) ─ */
.notif{border-left:4px solid transparent;padding-left:12px}
.sev-bad.notif{border-left-color:var(--bad)}.sev-warn.notif{border-left-color:var(--warn)}.sev-or.notif{border-left-color:var(--or)}.sev-info.notif{border-left-color:var(--blue)}

.notif .nd{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--or);border:2px solid #fff}
.notif .when{font-size:11px;color:var(--mute);white-space:nowrap;flex:none;align-self:flex-start;margin-top:2px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:1000px){.kgrid{grid-template-columns:1fr 1fr 1fr}}
.kt{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px;min-height:64px;width:100%}
.kt .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.kt .ic svg{width:17px;height:17px}
.kt .tx{min-width:0;flex:1}
.kt .tx b{display:block;font-size:13px;line-height:1.2}
.kt .tx small{display:block;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.25}
.kt .wait{margin-top:4px;font-size:10.5px;padding:1px 6px}
.kt.sev-bad .ic{background:var(--bad2);color:var(--bad)}.kt.sev-warn .ic{background:var(--warn2);color:var(--warn)}.kt.sev-info .ic{background:var(--blue2);color:var(--blue)}.kt.sev-ok .ic{background:var(--ok2);color:var(--ok)}.kt.sev-or .ic{background:var(--or2);color:var(--or)}

/* ─ validation : heures et production côte à côte ─ */
.vrow{flex-wrap:wrap}
.prodbox{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;background:var(--vio2);border-radius:10px;padding:6px 10px;flex:1 1 100%;order:3;font-size:12.5px}
.prodbox .kick{color:#4b3a9a}
.prodbox b{font-size:13.5px}

.vrow .btn{order:2;margin-left:auto}
.vrow .tx{flex:1 1 55%}
.prodbox small{flex-basis:100%}
.vrow.incoh{border-left:5px solid var(--bad)}
@media(min-width:700px){.prodbox{flex:0 0 40%;order:0;flex-direction:column;align-items:flex-start;gap:2px}.vrow .btn{order:0;margin-left:0}.vrow .tx{flex:1 1 30%}}

/* ─ planning : jours multi-chantiers ─ */
.dots i.other{background:#fff;border:2px solid var(--mute);color:var(--mute)}
.ppw{margin-top:6px}
.ppw .pp{margin-top:0}
.pledit{border:1px dashed var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px;margin-top:-2px;background:var(--bg)}
.plday{display:flex;align-items:center;gap:8px;padding:4px 0}
.plday-l{flex:none;width:56px;font-size:12px;color:var(--ink2)}
.plday-c{display:flex;gap:4px;flex-wrap:wrap}
.plday-c .chip{min-height:30px;padding:0 10px;font-size:12px}
.plmeteo span{position:relative}
.plmeteo em{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;min-width:16px;height:16px;display:inline-grid;place-items:center;padding:0 4px}
.plmeteo em:empty{display:none}

.dots i.free{background:var(--or2);color:var(--or);border:1.5px dashed var(--or)}

/* ─ tableau de bord du chantier ─ */
.kt.dk{min-height:72px}
.kt.sev-off .ic{background:var(--gray2);color:var(--mute)}
.kt.dk .tx b{display:flex;align-items:center;gap:6px}
.kt.dk .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ─ missions / objectifs du jour ─ */
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--or2);color:var(--or)}
.mrow .ic svg{width:17px;height:17px}
.mrow.fait .ic{background:var(--ok2);color:var(--ok)}.mrow.prevu .ic{background:var(--gray2);color:var(--mute)}
.mrow .tx{flex:1;min-width:0}
.mrow .tx>b{display:block;font-size:14px;line-height:1.25}
.mrow .tx small b{display:inline;font-size:inherit}
.mrow .tx small{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.mis{margin-top:10px}
.prev{background:var(--or2);border-radius:12px;padding:8px 10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px}
.prev .kick{flex-basis:100%;color:#9a3410}

/* ─ checklist : coche d'état ─ */
.chk{flex:none;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px;font-weight:800;align-self:center}
.chk.ok{background:var(--ok);color:#fff}.chk.warn{background:var(--warn);color:#fff}.chk.bad{background:var(--bad);color:#fff}.chk.off{background:var(--gray2);color:var(--mute)}
.kt.dk{align-items:center}
.kt.sev-ok{border-color:#cfe8d8}

<script>
/* ════ KIT AVATAR SCR — DÉBUT : avatar-scr.js repris tel quel, ne rien modifier ici ════ */
/*
 * Kit avatar SCR - a integrer dans l'appli.
 *
 * avatarModele(profil, contexte) -> tout ce qu'un ecran doit afficher (cfg de l'avatar, listes d'options, paliers, textes)
 * avatarConfig(profil, contexte) -> cfg de l'avatar a dessiner maintenant
 * avatarSVG(cfg, taille)         -> chaine SVG du personnage en pied (ratio 240 x 420)
 * avatarMedaillon(cfg, diametre, fond, cadre) -> photo de profil ronde
 * AVATAR_CATALOGUE               -> postes, options, paliers, seuils (id + libelle)
 *
 * PROFIL = ce que l'appli stocke par utilisateur (voir EditorLogic.profilInitial) :
 *   poste, genre, peau, cheveux, couleur, barbe, lunettes, casque (null = defaut du poste | true | false),
 *   bouche ('rien' | 'cigarette' | 'chewing' = bulle de chewing-gum),
 *   haut, hautCouleur, bas, basCouleur, chaussures, chaussuresCouleur, accessoire, bandana
 *        -> tenue AU TRAVAIL. Une piece = un TYPE (hautTypes, basTypes, chaussuresTypes) + une TEINTE (teintes).
 *           null = tenue du poste / teinte par defaut. Ignores sur les postes terrain (EPI impose), sauf bandana.
 *   pHaut, pHautCouleur, pBas, pBasCouleur, pChaussures, pChaussuresCouleur, pAccessoire, pCoiffe, pBandana
 *        -> tenue HORS TRAVAIL (libre pour tous)
 *   bandana / pBandana : id de AVATAR_CATALOGUE.bandanas (unis, pois, techno, pays = 3 couleurs). Pour couvrir
 *        tous les pays : ajouter une ligne par pays, ou brancher une bibliotheque de drapeaux SVG comme motif.
 *   palier (palier d'outil equipe, null = le plus haut debloque), palierGants (idem pour les gants),
 *   medaille (true / false : porter ou non sa medaille d'anciennete), fond (fond du medaillon)
 *
 * CONTEXTE = ce que l'appli calcule a l'affichage, jamais saisi par le salarie :
 *   vue: 'travail' | 'perso'      -> selon le pointage / les horaires : EPI en heures de travail, tenue perso sinon
 *   meteo: 'chaud' | 'frais' | 'froid' | 'pluie' -> couche de la tenue terrain :
 *          chaud = t-shirt HV manches longues, frais = sweat HV, froid = veste HV, pluie = tenue de pluie verte haut + bas.
 *          Sous forte pluie : chasuble orange par-dessus la veste de pluie. T-shirt et tenue de pluie sans bandes reflechissantes.
 *          Le soudeur garde toujours sa veste en cuir (risque de feu) : sous forte pluie, seul le pantalon de pluie s'ajoute. Bas de travail unique : jean technique marine.
 *          Casque impose en tenue de travail pour les postes terrain ; au choix pour l'encadrement et le bureau.
 *   realisations: compteur de production du poste (pouces soudes, pouces manchonnes, heures d'engin) -> paliers Bronze / Argent / Or / Diamant,
 *          seuils par poste dans AVATAR_CATALOGUE.postes[].seuils : outil recolore (porte-electrode, meuleuse, chalumeau, talkie) + cadre du medaillon.
 *   jours: jours sans accident -> une etoile sur le casque par annee pleine (365 jours), 10 etoiles au maximum.
 *   qualite: jours de qualite d'affilee (voir postes[].qualite) -> couleur des gants.
 *          Manchonneur, jours DH OK : Bronze 6 mois (182 j) / Argent 1 an (365 j) / Or 2 ans (730 j) / Diamant 3 ans (1 095 j), en jours calendaires.
 *          Tuyauteur, jours "fils sur le dessus" : Bronze 2 mois (61 j) / Argent 4 mois (122 j) / Or 7 mois (213 j) / Diamant 1 an (365 j).
 *            Regles a coder : la chaine casse des qu'un fil est pose sur le cote a plus de 45 degres (45 exclu : pile 45 ne casse pas).
 *            Seuls les assemblages tube sur tube comptent ; les assemblages piece sur tube sont ignores.
 *            Perimetre : uniquement les tubes soudes par le soudeur auquel le tuyauteur est rattache (meme rattachement que ses pouces),
 *            et uniquement quand le tube pose est NEUF, c'est-a-dire pas encore soude a son autre extremite
 *            (un tube deja soude de l'autre bout ne peut plus etre tourne : il ne compte pas, ni en bien ni en mal).
 *          Pour le soudeur, la qualite se mesure par les radios (voir radio), pas par ce compteur.
 *   Soudeur : pas de casque sur la tete en tenue de travail, masque de soudage releve a la place, casque pose a ses pieds
 *          (les etoiles de securite restent sur ce casque). Sous forte pluie il garde son cuir, seul le pantalon de pluie s'ajoute.
 *   realisations (soudeur) : pouces soudes declares -> couleur du porte-electrode.
 *          Seuils : Bronze 11 000 / Argent 22 500 / Or 34 000 / Diamant 56 000, soit 1, 2, 3 et 5 ans d'activite
 *          a 60 pouces par jour, semaines de 4 jours, 47 semaines travaillees par an (188 jours, 11 280 pouces par an).
 *   realisations (manchonneur, tuyauteur) : meme unite et meme bareme que le soudeur, le pouce.
 *          - Manchonneur : il pointe ce qu'il a manchonne ; chaque manchon compte pour les pouces du DN de la soudure manchonnee.
 *          - Tuyauteur : il n'a pas de pointage propre ; il recoit les pouces soudes par le soudeur avec qui il fait equipe.
 *            L'appli doit donc enregistrer la composition des equipes (quel tuyauteur travaille avec quel soudeur, jour par jour)
 *            et crediter le tuyauteur des pouces de son soudeur sur les jours travailles ensemble.
 *            S'il travaille avec deux soudeurs, on CUMULE les pouces des deux.
 *   radio (soudeur) : c'est l'indicateur QUALITE du soudeur. % de radios conformes sur les 50 dernieres soudures tirees -> teinte du masque de soudage
 *          (Bronze 90 / Argent 95 / Or 98 / Diamant 100). C'est un taux : le masque peut redescendre.
 *   cadence (soudeur) : record de semaines d'affilee au-dessus de la cadence moyenne (semaines de 4 jours, moyenne a la semaine)
 *          -> une etincelle au bout de l'electrode par semaine du record : 40 dessinees au maximum (trois couronnes de 12, puis 4 en diagonale) ;
 *             le compteur n'a pas de plafond. Couleur : Bronze des 1 semaine, Argent 3, Or 4, Diamant 8. C'est un record : il reste acquis.
 *   cadence (manchonneur) : meme compteur et memes paliers -> une flamme au bout du flambard, qui s'epaissit chaque semaine
 *          du record jusqu'a 12, puis une braise ou une etincelle s'ajoute chaque semaine jusqu'a 40, avec un halo a 13, 25 et 37
 *          et deux flammeches laterales a 25 et 31. Couleur selon le palier (bleue au Diamant). Voir postes[].cadence.
 *   Tuyauteur : casque sur la tete, et une cagoule de soudure noire posee a ses pieds (postes[].cagouleSol).
 *   cadence (tuyauteur) : une semaine compte quand le CUMUL des pouces de ses soudeurs (un ou deux) depasse la cadence moyenne
 *          d'UN soudeur (meme moyenne de reference que pour le soudeur, a la semaine de 4 jours)
 *          -> une gerbe d'etincelles sort du disque de la meuleuse : une etincelle par semaine du record, 40 dessinees au maximum.
 *   Chauffeur d'engin : meme veste HV que les autres, un talkie-walkie glisse dans la poche de cuisse du pantalon (plus en main).
 *          realisations = heures d'engin -> couleur du talkie. Seuils 1 900 / 3 800 / 5 600 / 9 400, soit 1, 2, 3 et 5 ans
 *          a 10 heures d'engin par jour, semaines de 4 jours, 47 semaines travaillees par an (188 jours, 1 880 heures par an).
 *          qualite = jours sans sinistre -> gants : Bronze 1 an (365 j) / Argent 2 ans (730 j) / Or 3 ans (1 095 j) / Diamant 5 ans (1 825 j).
 *          Pas de recompense de cadence pour le chauffeur (les calques d'ondes du talkie existent mais ne sont pas utilises).
 *   Plus aucun effet brillant autour des outils ni des gants : seule la couleur indique le palier.
 *   Recompenses de production reservees aux operateurs (soudeur, tuyauteur, manchonneur, chauffeur d'engin) :
 *          rien pour le chef de chantier (postes[].sansRecompense), l'encadrement et le bureau, hors medaille d'anciennete.
 *   anciennete: annees pleines depuis la date d'entree -> medaille d'anciennete, pour tous les postes, portee au choix du salarie.
 *          Le disque affiche le nombre d'annees. Niveaux : 1 an bronze, 3 argent, 5 or, 7 barrette, 10 rayons, 12 rayons et barrette, 15 lauriers, 20 diamant couronne.
 *          Portee par defaut (medaille: true), le salarie peut l'enlever.
 *   Seuils et unites sont dans AVATAR_CATALOGUE (paliers, etoiles, postes[].unite) : a ajuster.
 *
 * Logo : texte "SCR" provisoire, a remplacer par le vrai logo vectoriel.
 */
class DCLogic { setState() {} }
class AvatarLogic extends DCLogic {
  resolve(c) {
    var SKIN = { p1: '#FBD9BF', p2: '#F1C39F', p3: '#DDA57A', p4: '#B9794E', p5: '#8D5637', p6: '#5E3A26' };
    var HAIR = { noir: '#1E1B1A', brun: '#4A3020', chatain: '#7A4E2B', blond: '#D8B25A', roux: '#B5532A', gris: '#9A9A9A', blanc: '#E5E3DE' };
    var TOPS = {
      hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['hv'] },
      hvbi: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['hv', 'bi'] },
      soudeur: { fill: '#CDAA7D', line: '#9C7A4E', cut: 'long', ov: ['soudeur'] },
      gilet: { fill: '#23262D', line: '#111318', cut: 'long', ov: ['gilet'] },
      softshell: { fill: '#1E2A44', cut: 'long', ov: ['soft'], teint: true },
      chemise_blanche: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'long', ov: ['chemise'] },
      chemise_bleue: { fill: '#C3D7F0', line: '#8FA9CF', cut: 'long', ov: ['chemise'] },
      chemisier_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'long', ov: ['chemisier'] },
      chemisier_rose: { fill: '#F2C6C0', line: '#CC958E', cut: 'long', ov: ['chemisier'] },
      blazer_marine: { fill: '#1E2A44', line: '#121A2E', cut: 'long', ov: ['blazer'] },
      tshirt_hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['tee'] },
      sweat_hv: { fill: '#F26A1B', line: '#C9520E', cut: 'long', ov: ['sweat'] },
      pluie: { fill: '#2E7D55', line: '#1B5639', cut: 'long', ov: ['pluie', 'chasuble'] },
      tshirt: { fill: '#23262D', cut: 'short', ov: ['tee'], teint: true },
      polo: { fill: '#1E2A44', cut: 'short', ov: ['polo'], teint: true },
      chemise: { fill: '#FFFFFF', cut: 'long', ov: ['chemise'], teint: true },
      chemisier: { fill: '#FFFFFF', cut: 'long', ov: ['chemisier'], teint: true },
      sweat: { fill: '#8E96A3', cut: 'long', ov: ['sweat'], teint: true },
      hoodie: { fill: '#8E96A3', cut: 'long', ov: ['hoodie'], teint: true },
      blazer: { fill: '#1E2A44', cut: 'long', ov: ['blazer'], teint: true },
      hoodie_gris: { fill: '#8E96A3', line: '#636D7C', cut: 'long', ov: ['hoodie'] },
      hoodie_noir: { fill: '#23262D', line: '#111318', cut: 'long', ov: ['hoodie'] },
      polo_marine: { fill: '#1E2A44', line: '#121A2E', cut: 'short', ov: ['polo'] },
      polo_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'short', ov: ['polo'] },
      tshirt_noir: { fill: '#23262D', line: '#111318', cut: 'short', ov: ['tee'] },
      tshirt_blanc: { fill: '#FFFFFF', line: '#BCC4CF', cut: 'short', ov: ['tee'] }
    };
    var BAS = {
      pantalon: { fill: '#1E2A44', teint: true },
      short: { fill: '#CDB391', shape: 'bermuda', teint: true },
      pantalon_78: { fill: '#1E2A44', shape: 'pant78', teint: true },
      jupe: { fill: '#1E2A44', shape: 'jupe', teint: true },
      pluie_bas: { fill: '#2E7D55', line: '#1B5639' },
      travail: { fill: '#1E2A44', line: '#121A2E', ov: 'cargo' },
      travail_noir: { fill: '#34363C', line: '#1D1E22', ov: 'cargo' },
      marine: { fill: '#1E2A44', line: '#121A2E' },
      chino: { fill: '#CDB391', line: '#A38A68' },
      jean: { fill: '#4F77A8', ov: 'jean', teint: true }
    };
    var SHOES = {
      ville: { fill: '#6B3A22', sole: '#2A1710', teint: true },
      escarpins: { fill: '#23262D', sole: '#000000', shape: 'shoeFin', teint: true },
      ballerines: { fill: '#C4816F', sole: '#000000', shape: 'shoeFin', teint: true },
      secu: { fill: '#B07A45', sole: '#3A2A1C', teint: true },
      cuir: { fill: '#6B3A22', line: '#4A2614', sole: '#2A1710' },
      baskets: { fill: '#FFFFFF', sole: '#AEB7C4', teint: true },
      noires: { fill: '#23262D', line: '#111318', sole: '#000000' }
    };
    var GLOVES = {
      travail: { fill: '#C9A46A', line: '#9C7A44', flag: 'gants' },
      soudeur: { fill: '#B9B2A4', line: '#8C8576', flag: 'gantsLongs' }
    };
    var HAIRF = {
      chauve: [], degarni: ['h_degarni'], court: ['h_court'], brosse: ['h_brosse'], meche: ['h_meche'], milong: ['h_milong'],
      long: ['b_long', 'h_long'], chignon: ['h_raie', 'v_chignon'], queue: ['b_queue', 'h_raie'], boucle: ['h_court', 'v_boucle']
    };
    var f = {};
    function fonce(hex, k) {
      var n = parseInt(String(hex).slice(1), 16);
      var r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    function teinte(base, couleur, sombre) {
      if (!base.teint || !couleur) return base.line ? base : Object.assign({}, base, { line: fonce(base.fill, 0.72) });
      return Object.assign({}, base, { fill: couleur, line: fonce(couleur, 0.72), sole: sombre ? fonce(couleur, 0.45) : base.sole });
    }
    var top = teinte(TOPS[c.haut] || TOPS.hv, c.hautCouleur);

    var shoe = teinte(shoeBase, c.chaussuresCouleur, c.chaussures !== 'baskets');
    var glove = GLOVES[c.gants];
    var casque = c.casque === true || c.casque === 'true';
    f[top.cut] = true;
    top.ov.forEach(function (k) { f[k] = true; });
    if (bas.ov) f[bas.ov] = true;
    f[bas.shape || 'pant'] = true;
    f[shoe.shape || 'shoeStd'] = true;
    var coiffe = !casque && (c.coiffe === 'casquette' || c.coiffe === 'bonnet') ? c.coiffe : null;
    if (coiffe) f[coiffe] = true;
    (HAIRF[c.cheveux] || []).forEach(function (k) {
      if ((casque || coiffe || c.masque) && k.indexOf('v_') === 0) return;

    f['lun_' + c.lunettes] = true;
    f['acc_' + c.accessoire] = true;
    f['bouche_' + c.bouche] = true;
    f.casque = casque;
    var casqueSol = !casque && (c.casqueSol === true || c.casqueSol === 'true');
    if (casqueSol) f.casqueSol = true;
    if (c.cagouleSol === true || c.cagouleSol === 'true') f.cagouleSol = true;
    var nEt = Math.min(10, Number(c.etoiles) || 0);
    for (var iEt = 1; iEt <= nEt; iEt++) {
      if (casque) f['etoile' + iEt] = true;

  /* Profil + contexte (vue, meteo, realisations, jours, qualite, radio, cadence, anciennete) -> tout ce que l'ecran affiche. Aucune dependance a l'interface. */
  modele(s) {
    var K = this.catalogue();
    function trouve(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
    function nombre(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

    var P0 = trouve(K.postes, s.poste) || K.postes[0];

    var meteo = trouve(K.meteos, s.meteo) || K.meteos[2];
    var real = Number(s.realisations) || 0;
    var jours = Number(s.jours) || 0;
    var qualite = Number(s.qualite) || 0;
    var anciennete = Math.floor(Number(s.anciennete) || 0);
    var iAnc = -1;
    K.medaillesAnciennete.forEach(function (md, i) { if (anciennete >= md.seuil) iAnc = i; });
    var niveauAnc = iAnc >= 0 ? K.medaillesAnciennete[iAnc].niveau : 0;
    var medPortee = !!s.medaille && niveauAnc > 0;

    var terrain = !libre;
    /* Recompenses de production : postes terrain sauf ceux marques sansRecompense (chef de chantier). */
    var recomp = terrain && !P.sansRecompense;
    var PAL = K.paliers.map(function (p, i) { return P.seuils ? Object.assign({}, p, { seuil: P.seuils[i] }) : p; });
    var radio = Number(s.radio) || 0;
    var cadence = Number(s.cadence) || 0;
    var iRadio = 0;
    K.paliersRadio.forEach(function (p, i) { if (radio >= p.seuil) iRadio = i; });
    var nChevrons = Math.max(0, Math.round(cadence));
    var iCad = -1;
    K.paliersCadence.forEach(function (p, i) { if (cadence >= p.seuil) iCad = i; });
    var deb = 0;
    PAL.forEach(function (p, i) { if (real >= p.seuil) deb = i; });
    var eq = deb;
    PAL.forEach(function (p, i) { if (p.id === s.palier && i <= deb) eq = i; });
    var palier = PAL[eq];
    var PALQ = K.paliersQualite.map(function (p, i) { return P.seuilsQualite ? Object.assign({}, p, { seuil: P.seuilsQualite[i], duree: (P.dureesQualite || [])[i] }) : p; });
    var debQ = 0;
    PALQ.forEach(function (p, i) { if (qualite >= p.seuil) debQ = i; });
    var eqQ = debQ;
    PALQ.forEach(function (p, i) { if (p.id === s.palierGants && i <= debQ) eqQ = i; });
    var etoiles = Math.min(K.etoilesMax, Math.floor(jours / K.etoileJours));

    /* Une pièce au choix = un type + une teinte. Retourne la sélection courante. */
    function piece(types, typeChoisi, teinteChoisie, typePoste, teintePoste, typeDefaut) {
      var type = typeChoisi || typePoste || typeDefaut;
      var def = trouve(types, type);
      var teinteId = teinteChoisie || (type === typePoste && teintePoste ? teintePoste : def ? def.defaut : null);
      return { type: type, teinte: def ? teinteId : null, hex: def ? hex(teinteId) : null };
    }
    function bandeau(id) { var b = trouve(K.bandanas, id) || trouve(K.drapeaux, id); return b && b.c ? b.c.concat([b.motif || '']) : null; }

    var visage = { genre: s.genre, peau: s.peau, cheveux: s.cheveux, couleur: s.couleur, barbe: s.barbe, lunettes: s.lunettes, bouche: s.bouche || 'rien' };
    var tH, tB, tC, tenuePoste;
    if (libre) {
      tH = piece(K.hautTypes, s.haut, s.hautCouleur, P.haut, P.hautCouleur);
      tB = piece(K.basTypes, s.bas, s.basCouleur, P.bas, P.basCouleur);
      tC = piece(K.chaussuresTypes, s.chaussures, s.chaussuresCouleur, P.chaussures, P.chaussuresCouleur);
      tenuePoste = tH.type === P.haut;
    } else {
      tenuePoste = true;
      var hautJour = P.haut, basJour = P.bas;
      if (P.haut === 'soudeur') { hautJour = 'soudeur'; if (meteo.id === 'pluie') basJour = 'pluie_bas'; }

    }
    var cfgT = Object.assign({}, visage, {
      haut: tH.type, hautCouleur: tH.hex, bas: tB.type, basCouleur: tB.hex, chaussures: tC.type, chaussuresCouleur: tC.hex,

    });
    var aGants = !!P.qualite && cfgT.gants !== 'aucun';
    cfgT.gantsPalier = aGants ? PALQ[eqQ].id : 'standard';
    var pH = piece(K.hautTypes, s.pHaut, s.pHautCouleur, null, null, 'tshirt');

    var cfgP = Object.assign({}, visage, {
      haut: pH.type, hautCouleur: pH.hex, bas: pB.type, basCouleur: pB.hex, chaussures: pC.type, chaussuresCouleur: pC.hex,

    });
    var cfg = perso ? cfgP : cfgT;
    var cH = perso ? pH : tH, cB = perso ? pB : tB, cC = perso ? pC : tC;

    function opts(list, cle, cleCfg, mini) {
      return list.map(function (o) {
        var c2 = Object.assign({}, cfg, mini || {});
        c2[cleCfg] = o.id;
        var patch = {};
        patch[cle] = o.id;
        return { id: o.id, label: o.label, hex: o.hex, sel: cfg[cleCfg] === o.id, cfg: c2, patch: patch };
      });
    }
    var tete = { casque: false, coiffe: 'aucune', accessoire: 'aucun' };
    var buste = { casque: false, coiffe: 'aucune', gants: 'aucun', accessoire: 'aucun' };
    var tenueVisible = perso || libre;
    var prefixe = perso ? 'p' : '';
    function cleDe(nom) { return perso ? 'p' + nom.charAt(0).toUpperCase() + nom.slice(1) : nom; }

    /* Vignettes des types d'une pièce, puis pastilles de teintes pour le type sélectionné. */
    function types(nom, liste, courant, typePoste, teintePoste) {
      if (!tenueVisible) return [];
      var items = liste.slice();
      if (!perso && typePoste && !trouve(liste, typePoste)) items.unshift({ id: typePoste, label: (trouve(K.hautsPoste, typePoste) || {}).label || 'Tenue du poste' });
      return items.map(function (o) {
        var sel = o.id === courant.type;
        var teinteId = sel ? courant.teinte : (!perso && o.id === typePoste && teintePoste ? teintePoste : o.defaut);
        var c2 = Object.assign({}, cfg, buste);
        c2[nom] = o.id;
        c2[nom + 'Couleur'] = o.defaut ? hex(teinteId) : null;
        var patch = {};
        patch[cleDe(nom)] = o.id;
        patch[cleDe(nom) + 'Couleur'] = null;
        return { id: o.id, label: o.label, sel: sel, cfg: c2, patch: patch };
      });
    }
    function teintes(nom, courant) {
      if (!tenueVisible || !courant.teinte) return [];
      return K.teintes.map(function (t) {
        var patch = {};
        patch[cleDe(nom) + 'Couleur'] = t.id;

    var suivant = PAL[deb + 1];

        return { id: o.id, label: o.label, sel: o.id === P0.id, patch: { poste: o.id, casque: null, haut: null, hautCouleur: null, bas: null, basCouleur: null, chaussures: null, chaussuresCouleur: null, accessoire: null, palier: null, palierGants: null } };
      }),

function avatarSVG(cfg, taille) {

}

  const rowV=v=>`<div class="row vrow ${incoh(v)?'incoh':''}" style="cursor:default"><span>${medal(v.p,40)}</span><span class="tx"><b>${esc(nomC(P[v.p]))} · ${v.tot}</b><small>${v.h} · ${pauseTxt(v)}</small><small>${v.sites.map(x=>esc(SITES[x].ville)).join(' + ')}${v.sites.length>1?' · <b>2 chantiers</b>':''}${p.kind==='enc'?(v.chefOk?' · <span class="tagx ok">✓ chef</span>':' · <span class="tagx warn">pas encore vu par le chef</span>'):''}</small></span>${prodBox(v.d,v.p)}<button class="btn sm pri" data-act="valid" data-v="${v.id}">✓ Valider</button></div>`;

  const foot=VL.length>1?`<button class="btn full pri" style="margin-top:6px" data-act="validall">Tout valider (${VL.filter(v=>!incoh(v)).length})${nInc?' · laisse '+nInc+' à vérifier':''}</button>`:'';

  const need={'/missions':['chef','enc','dir'],'/heures':['dir'],'/paie':['rh','dir'],'/annul':['chef','enc','dir'],'/prod':['chef','enc','dir'],'/expl':['enc','dir','chef'],'/planning':['enc','dir'],'/planning-moi':['chef','terrain','interim'],'/valider':['enc','dir','rh','chef'],'/habs-equipe':['enc','dir','rh'],'/rh':['rh'],'/admin':['admin'],'/traceur':['enc','dir']};

  if(path==='/home')html=vHome();else if(path==='/chantiers')html=vChantiers();else if(path.startsWith('/chantier/')){const id=path.split('/')[2];html=((['enc','dir'].includes(p.kind)&&!anchor)||anchor==='dash')?vDash(id):vChantier(id,anchor);}else if(path.startsWith('/plan/'))html=vChantier(path.split('/')[2],anchor);
  else if(path==='/expl')html=vExpl();else if(path==='/planning')html=vPlanning();else if(path==='/planning-moi')html=vPlanningMoi();else if(path==='/prod')html=vProd();else if(path==='/annul')html=vAnnul();else if(path==='/missions')html=vMissions();else if(path==='/heures')html=vHeures();else if(path==='/paie')html=vPaie();else if(path.startsWith('/doc/'))html=vDoc(path.split('/')[2]);else if(path==='/valider')html=vValider();else if(path==='/habs-equipe')html=vHabsEquipe();
  else if(path==='/espace')html=vEspace();else if(path==='/entreprise')html=vEntreprise();else if(path==='/admin')html=vAdmin();else if(path==='/rh')html=vRH();else if(path==='/traceur')html=vTraceur();else html=vHome();
  document.getElementById('app').innerHTML=html+tabbar(path);
  document.getElementById('whoSel').value=who;
  if(anchor){const el=document.getElementById(anchor);if(el)setTimeout(()=>el.scrollIntoView({block:'start',behavior:'smooth'}),30);}else window.scrollTo(0,0);}
window.addEventListener('hashchange',render);
document.getElementById('whoSel').addEventListener('change',e=>{who=e.target.value;localStorage.setItem('maq:who',who);S.plSel=null;const {path}=route();location.hash='#/home';if(path==='/home')render();toast('Tu vois l\'appli comme '+nomC(P[who])+' — '+P[who].poste);});
document.addEventListener('click',e=>{
  const bk=e.target.closest('[data-back]');if(bk){location.hash='#'+bk.dataset.back;return;}
  const st=e.target.closest('[data-set]');if(st){const [k,v]=st.dataset.set.split('=');S[k]=isNaN(+v)?v:+v;if(k==='espWeek')S.espDay=undefined;render();return;}
  const act=e.target.closest('[data-act]');if(act){const v=act.dataset.v;switch(act.dataset.act){
    case 'ptstart':PT[who]={start:Date.now(),pauses:[],paused:false,end:null};toast('Journée commencée à '+hm(Date.now())+' · position relevée');render();return;
    case 'ptinter':toast('Départ inter-chantier pointé · arrivée à pointer sur place');return;
    case 'ptpause':{const x=PT[who];if(!x||x.end)return;x.pauses.push({a:Date.now(),b:null});x.paused=true;render();return;}
    case 'ptresume':{const x=PT[who];if(!x||!x.paused)return;x.pauses[x.pauses.length-1].b=Date.now();x.paused=false;toast('Reprise à '+hm(Date.now()));render();return;}
    case 'ptend':{const x=PT[who];if(!x||x.end)return;if(x.paused){x.pauses[x.pauses.length-1].b=Date.now();x.paused=false;}x.end=Date.now();toast('Journée finie · '+dur(ptWorked(x,Date.now()))+' · position relevée');render();return;}
    case 'sign':{const d=(DOCS[who]||[]).find(x=>x.id===v);if(d){d.signed=true;toast('Signé · '+hm(Date.now())+' — classé dans ton dossier');location.hash='#/home';}return;}
    case 'pointer':PT[who]=PT[who]||{start:Date.now(),pauses:[],paused:false,end:null};render();return;
    case 'plsel':S.plSel=S.plSel===v?null:v;render();return;
    case 'plput':{const wk=S.plWeek||42;PLAN[wk]=PLAN[wk]||{};const o=PLAN[wk][S.plSel]||{};const fd=freeDays(S.plSel,wk);fd.forEach(i=>{o[i]=[v];});PLAN[wk][S.plSel]=o;toast(P[S.plSel].prenom+' placé'+(P[S.plSel].av.genre==='femme'?'e':'')+' sur '+SITES[v].nom+(fd.length===5?' toute la semaine':' : '+fd.map(i=>JOURS[i]).join(', ')));S.plSel=null;S.plEdit=null;render();return;}
    case 'pledit':S.plEdit=S.plEdit===v?null:v;S.plSel=null;render();return;
    case 'plday':{const [k,i,x]=v.split('|');const wk=S.plWeek||42;PLAN[wk]=PLAN[wk]||{};const o=PLAN[wk][k]||(PLAN[wk][k]={});const a=o[+i]||[];o[+i]=a.includes(x)?a.filter(y=>y!==x):a.concat(x);render();return;}
    case 'plrm':{const [k,x]=v.split('|');const wk=S.plWeek||42;const o=daysOf(k,wk);Object.keys(o).forEach(i=>{o[i]=(o[i]||[]).filter(y=>y!==x);});if(!estPlace(k,wk))delete PLAN[wk][k];S.plEdit=null;S.plSel=null;render();return;}
    case 'valid':VALID=VALID.filter(x=>x.id!==+v);toast('Pointage validé');render();return;
    case 'validday':{const inc=v2=>!prodTxt((PROD_DAY[v2.d]||{})[v2.p])&&!noProdOk(v2.p);const p=me();const mine=p.kind==='chef'?Object.keys(SITES).filter(k=>SITES[k].chef===p.id):p.kind==='enc'?mySites(p):null;let n=0;VALID=VALID.filter(x=>{const take=x.d===v&&(!mine||mine.includes(x.site))&&!inc(x);if(take)n++;return !take;});toast(n+' pointages validés pour '+v);render();return;}
    case 'validall':{const inc=v2=>!prodTxt((PROD_DAY[v2.d]||{})[v2.p])&&!noProdOk(v2.p);const p=me();const mine=p.kind==='chef'?Object.keys(SITES).filter(k=>SITES[k].chef===p.id):p.kind==='enc'?mySites(p):null;let n=0,left=0;VALID=VALID.filter(x=>{const m=!mine||mine.includes(x.site);if(!m)return true;if(inc(x)){left++;return true;}n++;return false;});toast(n+' pointages validés'+(left?' · '+left+' laissés à vérifier (pas de production en face)':''));render();return;}
    case 'annulok':ANNUL=ANNUL.filter(a=>a.id!==v);toast('Annulation acceptée · soudure remise « à souder », journal mis à jour');render();return;
    case 'annulno':ANNUL=ANNUL.filter(a=>a.id!==v);toast('Demande refusée · le gars est prévenu');render();return;
    case 'mswho':{S.msWho=S.msWho||[];S.msWho=S.msWho.includes(v)?S.msWho.filter(x=>x!==v):S.msWho.concat(v);render();return;}
    case 'msok':{const [site,d]=v.split('|');const t=document.getElementById('ms-t').value,n=+document.getElementById('ms-n').value||0,dn=document.getElementById('ms-dn').value,l=document.getElementById('ms-l').value,h=+document.getElementById('ms-h').value||0;const who=S.msWho||[];
      const lab=(t==='soud'?n+' soudures DN'+dn.split('/')[0]:t==='manch'?n+' manchons DN'+dn:t==='dh'?n+' DH':MTYPES[t][0])+(l?' — '+l:'');MISSIONS[site]=MISSIONS[site]||{};(MISSIONS[site][d]=MISSIONS[site][d]||[]).push({id:'x'+Date.now(),t,l:lab,h,who,done:null,st:'prevu'});S.msAdd='';S.msWho=[];toast('Mission ajoutée · ≈ '+hTxt(h));render();return;}
    case 'msdel':{const [site,d,id]=v.split('|');MISSIONS[site][d]=(MISSIONS[site][d]||[]).filter(m=>m.id!==id);render();return;}
    case 'paie':toast('Export généré (maquette) · S40 · 23 salariés');return;
    case 'corrok':MISSING=MISSING.filter(m=>m.id!==v);S.corr=null;toast('Heures saisies et validées · motif enregistré, visible par le bureau');render();return;
    case 'avatar':toast('Ici : l\'écran « Mon avatar » existant (visage, tenue, médaille)');return;
    case 'fiche':{const k=v,p=P[k];document.getElementById('sheet').innerHTML=`<div class="sheetbg" data-close="1"></div><div class="sheet"><div class="hdl"></div><div class="me" style="margin:0 0 10px">${medal(k,72,{vue:'perso'})}<div class="tx"><b>${esc(p.prenom)} ${esc(p.nom)}</b><small>${esc(p.poste)}${p.secteur?' · secteur '+SECT[p.secteur]:''}</small><small>${planOf(k,41)?'Cette semaine : '+esc(SITES[planOf(k,41)].nom):'Pas sur un chantier cette semaine'}</small></div></div>
      <div class="card"><div class="kv"><span>Téléphone</span><span><a href="tel:0639980101" style="color:var(--or);font-weight:600">06 39 98 01 01</a></span></div><div class="kv"><span>E-mail</span><span>${esc(p.prenom.toLowerCase())}.${esc(p.nom.toLowerCase().replace(/\s/g,''))}@scr-soudure.fr</span></div><div class="kv"><span>Habilitations</span><span>${p.habs.map(h=>esc(h[0])).join(' · ')}</span></div></div><button class="btn full" data-close="1">Fermer</button></div>`;return;}
  }}
  if(e.target.closest('[data-close]')){document.getElementById('sheet').innerHTML='';return;}
  const go=e.target.closest('[data-go]');if(go){if(go.dataset.lock){toast('🔒 Ce chantier n\'est pas dans ton planning (semaine en cours ou précédente)');return;}if(go.dataset.soon){toast('Bientôt : bons de commande et débours');return;}const h=go.dataset.go;if(!h){toast('Écran à venir');return;}if(h.includes('#')){const [p2,a]=h.split('#');location.hash='#'+p2+'#'+a;}else location.hash='#'+h;if(('#'+h)===location.hash)render();}
});
/* glisser-déposer dans le planning (ordinateur) */
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(el){S.plSel=el.dataset.drag;e.dataTransfer.setData('text/plain',el.dataset.drag);}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault();});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const k=e.dataTransfer.getData('text/plain')||S.plSel;if(!k)return;const wk=S.plWeek||42;PLAN[wk]=PLAN[wk]||{};const o=PLAN[wk][k]||{};const fd=freeDays(k,wk);(fd.length?fd:[0,1,2,3,4]).forEach(i=>{o[i]=[z.dataset.drop];});PLAN[wk][k]=o;S.plSel=null;render();});
/* sélecteur « voir comme » */
{const sel=document.getElementById('whoSel');const fams=[['Terrain',['karim','sofiane','lucas','marc','mehdi','omar','yanis','tom']],['Chef de chantier',['paul']],['Encadrement',['julie','ethan']],['Support',['nadia']]];
  sel.innerHTML=fams.map(([f,ks])=>`<optgroup label="${f}">${ks.map(k=>`<option value="${k}">${esc(nomC(P[k]))} — ${esc(P[k].poste)}</option>`).join('')}</optgroup>`).join('');}
render();

</script>
