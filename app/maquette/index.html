<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracé Concepteur</title>
<!-- 30/10/2026 (charte « Tracé ») : icône de l'appli, favicon, icône iPhone, manifest — fichiers servis à côté de la page (public/ → racine et docs/) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="application-name" content="Tracé">
<meta name="apple-mobile-web-app-title" content="Tracé">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--page:#f9f9f7;--surface:#fcfcfb;--plane:#eeede8;--red:#c8382f;--blue:#2a5fb4;--ok:#0ca30c;--warn:#b8560f;--bad:#d03b3b}
  *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13.5px;color:var(--ink);background:var(--page)}
  button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
  .app{display:grid;grid-template-rows:auto auto 1fr auto; /* 30/10 : + bandeau « Tracé Concepteur » */grid-template-columns:1fr 380px;height:100vh}
  /* ── 30/10 (charte « Tracé ») : BANDEAU DU HAUT — fond blanc, filet Nuit 3 px ; 56 px au téléphone / 64 px en affichage large (PC) ; 2e ligne contexte 44 / 48 px.
     Même bloc dans maquette/index.html (traceur). .tbPc force la taille PC (aperçu de l'écran Entreprise). */
  :root{--nuit:#2B1B5A;--violet:#5E46B8}
  .tb{flex:none;background:#fff;position:relative;z-index:6}
  .tbBand{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;border-bottom:3px solid var(--nuit)}
  .tbLogo{flex:none;display:flex;align-items:center}.tbLogo svg{display:block}
  .tbMod{flex:0 1 auto;min-width:0;display:flex;align-items:baseline;gap:.26em;border:0;background:transparent;padding:6px 2px;margin:0;cursor:pointer;font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-size:clamp(18px,5.6vw,22px);line-height:1.05;color:var(--nuit);white-space:nowrap;overflow:hidden;border-radius:8px}
  .tbMod:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .tbName{font-weight:700}.tbModName{font-weight:500;color:var(--violet);overflow:hidden;text-overflow:ellipsis}
  .tbChev{display:none;font-size:.62em;color:var(--violet);align-self:center}
  .tbCo{margin-left:auto;flex:none;display:flex;align-items:center;justify-content:flex-end;max-width:112px;height:36px;overflow:hidden}
  .tbCoImg{display:block;max-width:112px;max-height:36px;width:auto;height:auto;object-fit:contain}
  .tbCoTxt{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:700;font-size:17px;color:var(--nuit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
  .tbCtx{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#F5F4FA;border-bottom:1px solid #E6E2EF}
  .tbCtx .brand{flex:1 1 auto;min-width:0}
  .tbPc .tbBand{height:64px;padding:0 24px;gap:12px}
  .tbPc .tbMod{font-size:26px}
  .tbPc .tbChev{display:inline}
  .tbPc .tbCo{max-width:132px;height:40px}
  .tbPc .tbCoImg{max-width:132px;max-height:40px}
  .tbPc .tbCoTxt{max-width:132px;font-size:19px}
  .tbPc .tbCtx{min-height:48px;padding:0 24px}
  .tb{grid-column:1/-1}.tb .tbMod{cursor:default}.tbTrSite{font-size:14px;font-weight:700;color:var(--nuit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .tbTrIn{display:none}.tbTrHdr{flex:1 1 100%;font-size:13px;line-height:18px} /* 31/10 : contexte (chantier / étude) DANS le bandeau sur PC, 1re ligne de la barre d'outils au téléphone — jamais de 2e ligne de bandeau dans le traceur : le dessin garde sa hauteur */
  @media (min-width:801px){.tb .tbTrIn{display:block;flex:1 1 auto;font-size:15px;font-weight:600;color:#4A4462;padding:2px 0 2px 14px;margin-left:4px;border-left:1px solid #E6E2EF}.tbTrHdr{display:none}}
  @media (min-width:801px){.tb .tbBand{height:64px;padding:0 24px;gap:12px}.tb .tbMod{font-size:26px}.tb .tbLogo svg{width:40px;height:40px}.tb .tbCo{max-width:132px;height:40px}.tb .tbCoImg{max-width:132px;max-height:40px}.tb .tbCoTxt{max-width:132px;font-size:19px}.tb .tbCtx{min-height:44px;padding:0 24px}}
  header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  header b{letter-spacing:.04em;margin-right:6px}header .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.danger{color:var(--bad)}.btn.sm{padding:3px 7px;font-size:12px}
  select.f,input.f{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--page)}input.f{width:70px}
  main{position:relative;overflow:hidden;background:var(--plane)}main svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
  main.trace svg{cursor:crosshair}main.add svg{cursor:copy}
  .hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .zoominfo{position:absolute;right:8px;top:8px;background:rgba(252,252,251,.92);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--ink2)}
  .zoomctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}.zoomctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(252,252,251,.96);font-size:16px}
  .zoomctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .disp{position:absolute;right:8px;bottom:164px;background:rgba(252,252,251,.97);border:1px solid var(--line);border-radius:10px;padding:8px 10px 7px;font-size:12.5px;display:none;flex-direction:column;gap:1px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:5;max-height:calc(100% - 180px);overflow:auto}
  .disp.show{display:flex}.disp b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:3px}.disp label{display:flex;align-items:center;gap:7px;padding:2px 0;white-space:nowrap;cursor:pointer}.disp label.off{color:var(--muted)}.disp input{width:15px;height:15px;margin:0}.disp .row{display:flex;gap:6px;margin-top:6px}
  .legend{position:absolute;left:8px;bottom:8px;background:rgba(252,252,251,.94);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:5px;border-radius:2px;margin-right:4px;vertical-align:middle}
  aside{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:none;padding:8px 4px;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent}.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
  .panel{flex:1;overflow:auto;padding:10px 12px;min-height:0}.panel h3{font-size:12px;margin:10px 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}.panel h3:first-child{margin-top:0}
  .card{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}.muted{color:var(--muted)}.kv span{display:inline-block;background:var(--plane);border-radius:6px;padding:2px 6px;margin:2px 3px 2px 0;font-size:12px}
  table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}th{color:var(--ink2);font-weight:600}tr.sel td{background:#fff5cc}tr:hover td{background:#f4f3ee;cursor:pointer}
  .note{padding:4px 6px;border-radius:6px;margin:3px 0;font-size:12px}.note.err{background:#fdecec;color:#8a1f1f}.note.warn{background:#fff3d6;color:#7a5200}.note.doubt{background:#e8f0fb;color:#1c3d6b}.note.interp,.note.info{background:var(--plane);color:var(--ink2)}
  textarea.f{width:100%;min-height:200px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px}
  footer{grid-column:1/3;padding:4px 10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface);display:flex;gap:14px;flex-wrap:wrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modal>div{background:var(--surface);border-radius:12px;padding:14px 16px;min-width:300px;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25)}.modal label{display:block;margin:8px 0 3px;font-size:12.5px;color:var(--ink2)}.modal .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
  .weld{cursor:pointer}.piece{cursor:pointer}
  .badge.pause{display:inline-block;background:#fff3d6;color:#7a5200;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;vertical-align:middle} /* 14/10 (édition du tracé) : ligne en pause */
  main.trace circle.pause,main.trace text.pause{cursor:pointer}
  @media (max-width:800px){.app{grid-template-columns:1fr}aside{display:none}}
  /* 31/10 (lot MO) : tuto au premier passage (src/tuto.js) — mêmes règles que l'appli */
  #tuto{position:fixed;inset:0;z-index:2500;-webkit-tap-highlight-color:transparent}#tuto.dim{background:rgba(20,12,50,.55)}
  #tuto .tutoHole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,12,50,.55);outline:3px solid #BFB2EE;pointer-events:none;transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}
  #tuto .tutoCard{position:fixed;background:#fff;border-radius:16px;padding:14px 14px 12px;box-shadow:0 12px 40px rgba(0,0,0,.35);color:#1d1630;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:calc(100vw - 24px)}
  #tuto .tutoMod{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:500;font-size:13.5px;color:#5E46B8}#tuto .tutoT{display:block;font-size:17px;margin:2px 0 4px;color:#2B1B5A}
  #tuto .tutoDots{margin-top:10px;line-height:0}#tuto .tutoDots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#D9D2F5;margin-right:5px}#tuto .tutoDots i.on{background:#5E46B8}
  #tuto .tutoBtns{display:flex;gap:8px;margin-top:12px;align-items:center}#tuto .tutoB{min-height:44px;min-width:44px;border-radius:12px;border:1px solid #D9D2F5;background:#fff;color:#2B1B5A;font-weight:700;font-size:15px;padding:0 14px}
  #tuto .tutoGo{margin-left:auto;background:#2B1B5A;border-color:#2B1B5A;color:#fff}#tuto .tutoSkip{color:#5b5670;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <div class="tb" id="tbTr"><div class="tbBand"><span class="tbLogo" id="tbTrLogo"></span><span class="tbMod"><span class="tbName">Tracé</span><span class="tbModName">Concepteur</span></span><span class="tbTrSite tbTrIn" id="siteBadge"></span><span class="tbCo" id="tbTrCo"></span></div></div><!-- 30/10 (charte « Tracé ») : bandeau + 2e ligne (chantier / étude en cours) -->
  <header>
    <span class="tbTrSite tbTrHdr" id="siteBadge2"></span><!-- 31/10 : au téléphone, le chantier / l'étude en cours = 1re ligne de la barre d'outils (pas de 2e ligne de bandeau : le dessin garde sa hauteur) -->
    <select class="f" id="supplier"><option>AXIOM</option><option>RENALIA</option><option>LOGSTOR</option><option>INPAL</option></select>
    <label class="muted">série <select class="f" id="serie"><option>1</option><option>2</option><option>3</option></select></label>
    <label class="muted">DN <select class="f" id="dn"></select></label>
    <label class="muted">barre <select class="f" id="bar"></select> m</label>
    <!-- 14/10 (édition du tracé) : DN et barre restent modifiables pendant le tracé (la ligne prend la valeur à la validation) ; profondeur de pose par défaut — variable des règles de dilatation à venir (surcharge par ligne dans sa fiche) -->
    <label class="muted" title="profondeur de pose par défaut (m), enregistrée avec le chantier ; se surcharge ligne par ligne dans la fiche de la ligne — servira aux règles de dilatation à venir">prof. <input class="f" id="prof" type="number" step="0.1" min="0" style="width:58px"> m</label>
    <span class="sep"></span>
    <button class="btn" id="mTrace">✎ Tracer une ligne</button>
    <button class="btn" id="mSelect">☝ Sélection</button>
    <button class="btn" id="mAdd">＋ Té / vanne / réduction / lyre / drapeau</button>
    <button class="btn" id="mOne" title="ne bouger qu'une conduite en glissant une soudure ou une pièce (ou Alt enfoncé)">◐ Un seul côté</button>
    <button class="btn" id="bUndo" title="annuler la dernière retouche (Ctrl+Z) — une action à la fois">↶</button>
    <button class="btn" id="bRedo" title="rétablir ce qui vient d'être annulé (Ctrl+Y ou Ctrl+Maj+Z)">↷</button>
    <span class="sep"></span>
    <span class="muted" style="font-size:11.5px">fond :</span>
    <!-- 14/10 (multi-plans) : plusieurs plans de fond (DXF du BE et/ou images : scan, capture), ajoutés en une fois, chacun calé dans l'onglet Fond -->
    <!-- 14/10 soir (T2) : « ＋ Plan » lit aussi le PDF (une page = un plan) ; le DWG est montré pour expliquer quoi en faire ; 📍 vue aérienne IGN par adresse, sous les plans -->
    <label class="btn" title="ajouter un ou plusieurs plans de fond : DXF (plan du BE, géomètre), PDF (une page = un plan) ou image (PNG, JPG, scan, capture d'écran) — chaque plan se cale ensuite (onglet Fond : échelle 1/N ou 2 points, déplacement, rotation, vue aérienne)">＋ Plan (DXF, PDF, image)<input type="file" id="bgAdd" accept=".dxf,.pdf,image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.dwg" multiple style="display:none"></label>
    <button class="btn" id="bAer" title="vue aérienne (IGN) en fond, par adresse, derrière les plans ; calage des lignes et des plans dessus">📍 Vue aérienne</button>
    <span id="bgTools" style="display:none;align-items:center;gap:6px">
      <button class="btn sm" id="bgScale" title="plan actif : clique deux points du plan dont tu connais la distance, puis entre-la">📏 Échelle</button>
      <button class="btn sm" id="bgEch" title="échelle d'un plan PDF ou image : 1/N (taille réelle de la page, ou dpi de l'image)">1/N</button>
      <button class="btn sm" id="bgMove" title="plan actif : glisse-le pour le déplacer">✥ Déplacer</button>
      <button class="btn sm" id="bgCal2" title="plan actif : 2 points sur le plan, puis les 2 mêmes endroits sur le tracé déjà calé → échelle, rotation et position d'un coup">⟲ 2 points</button>
      <label class="muted" style="font-size:11.5px">opacité <input type="range" id="bgOp" min="10" max="100" value="50" style="width:70px;vertical-align:middle"></label>
      <label class="muted" style="font-size:11.5px"><input type="checkbox" id="bgShow" checked> afficher</label>
      <button class="btn sm" id="bgLayers" title="options du plan DXF actif : calques du réseau, étendue, détail">⚙</button>
      <button class="btn sm" id="bgInfo" title="rapport de fidélité du plan DXF actif : ce qui est dessiné, ce qui manque (images externes, objets propriétaires…)">ⓘ</button>
      <button class="btn sm" id="bgFit" title="cadrer tous les plans de fond (et le réseau)">⤢ Tout voir</button>
      <button class="btn sm" id="bgClear" title="retirer le plan actif">✕</button>
    </span>
    <button class="btn" id="bClear">Tout effacer</button>
    <span class="sep"></span>
    <button class="btn on" id="bSave" title="remet le réseau à l'appli Tracé (chantier, soudures numérotées) et l'envoie au serveur si tu es connecté">💾 Enregistrer dans Tracé</button>
    <button class="btn" id="bOpenApp" title="ouvre l'appli">↗ Tracé</button>
    <button class="btn" id="bTuto" title="revoir le guide du traceur" aria-label="revoir le guide du traceur" style="min-width:36px;font-weight:700;color:#5E46B8">?</button>
    
    <button class="btn sm" id="bExport" title="fichier JSON de secours">⤓ JSON</button>
    <label class="btn sm">⤒ JSON<input type="file" id="impFile" accept=".json" style="display:none"></label>
  </header>
  <main id="main">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="bg"></g><g id="grid"></g><g id="net"></g><g id="draft"></g></g></svg>
    <div class="hint" id="hint" style="display:none"></div>
    <button class="btn" id="offscreen" style="display:none;position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.25)">↩ Réseau hors écran — revenir</button>
    <div class="zoominfo" id="zoominfo">1 m ≈ 10 px</div>
    <div class="disp" id="disp"></div>
    <div class="zoomctl"><button id="zEye" title="choisir ce qui s'affiche (étiquettes, n°, manchons, fond…)">👁</button><button id="zIn">+</button><button id="zOut">−</button><button id="zFit" title="tout voir">⌂</button></div>
    <div class="legend"><span><i style="background:#c8382f"></i>aller</span><span><i style="background:#2a5fb4"></i>retour</span><span>○ soudure</span><span><i style="background:#f0c76a"></i>sélection</span><span><i style="background:#d03b3b"></i>règle violée</span><span style="color:#b8560f">FC = fausse coupe (tubes coupés en biais)</span><span class="muted">molette : zoom · glisser : déplacer (à la souris, glisser dans le vide = rectangle de sélection) · Maj : angles par 15° · 👁 : choisir ce qui s'affiche</span></div>
  </main>
  <aside>
    <div class="tabs"><button data-tab="sel" class="on">Sélection</button><button data-tab="lignes">Lignes</button><button data-tab="soud">Soudures</button><button data-tab="nomen">Nomenclature</button><button data-tab="notes">Notes</button><button data-tab="fond" title="plans de fond : liste, calage de chaque plan">Fond</button><button data-tab="regles">Règles</button></div>
    <div class="panel" id="panel"></div>
  </aside>
  <footer id="foot"></footer>
</div>
<div class="modal" id="modal"><div id="modalBody"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
